<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-%%CSPHASH%%'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Folha de Pagamento e eSocial</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#17212b;--mut:#5d6b79;--line:#dbe2e9;--pri:#0f5c63;--pri2:#0a4146;--pri3:#e3f1f2;--acc:#b7791f;--ok:#1a7f4b;--okb:#e2f4ea;--warn:#9a6700;--warnb:#fff4d6;--err:#b42318;--errb:#fde8e6;--blue:#1f5fbf;--blueb:#e4edfb}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px}
#top{background:var(--pri2);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;position:sticky;top:0;z-index:20}
#top .logo{font-weight:700;font-size:17px;letter-spacing:.2px}#top .logo span{color:var(--acc2,#e8c37a)}#top .logo img{height:28px;vertical-align:middle;margin-right:8px;border-radius:4px}
#top .emp{margin-left:auto;font-size:12.5px;opacity:.9;text-align:right}
#top button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
#top button:hover{background:rgba(255,255,255,.22)}
#app{display:flex;align-items:flex-start;gap:0;max-width:1500px;margin:0 auto}
#side{width:230px;flex:none;padding:14px 10px;position:sticky;top:52px;max-height:calc(100vh - 130px);overflow:auto}
#side h6{margin:14px 8px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut)}
#side a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink);cursor:pointer;font-size:13.5px}
#side a:hover{background:#e5eaef}#side a.on{background:var(--pri);color:#fff}
#main{flex:1;min-width:0;padding:18px 20px 30px}
h1{font-size:21px;margin:0 0 2px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.grid>.f{grid-column:span 3}
.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px;font-weight:600}
.f input,.f select,.f textarea{width:100%;padding:8px 9px;border:1px solid #c7d0d9;border-radius:6px;font:inherit;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid #9ccfd3;border-color:var(--pri)}
.f input[readonly]{background:#eef2f5}
.f small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.chk{display:flex!important;align-items:center;gap:7px;font-weight:400!important;font-size:13.5px!important;color:var(--ink)!important;padding-top:6px}.chk input{width:auto!important}
.rq{color:var(--err)}
.btn{border:1px solid #bcc7d1;background:#fff;border-radius:7px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600;color:var(--ink)}
.btn:hover{background:#eef2f5}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.btn.send{background:var(--acc);border-color:var(--acc);color:#fff}.btn.send:hover{background:#97640f}
.btn.danger{color:var(--err);border-color:#e3b1ab}.btn.sm{padding:4px 9px;font-size:12.5px;font-weight:600}
.btn[disabled]{opacity:.5;cursor:not-allowed}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:10px;align-items:center;z-index:30;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
#bar .sp{flex:1}#bar .hint{color:var(--mut);font-size:11.5px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:#eef2f5;text-align:left;padding:7px 9px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 9px;border-bottom:1px solid #edf0f3;vertical-align:middle}
table.t tr:hover td{background:#fafcfd}.r{text-align:right}.c{text-align:center}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-gray{background:#e8ecf0;color:#4a5662}.b-blue{background:var(--blueb);color:var(--blue)}.b-ok{background:var(--okb);color:var(--ok)}.b-err{background:var(--errb);color:var(--err)}.b-warn{background:var(--warnb);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}.kpi b{display:block;font-size:20px;margin-top:2px}.kpi span{font-size:12px;color:var(--mut)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.step{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:6px}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--pri3);color:var(--pri);font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-right:6px}
.step.done .n{background:var(--ok);color:#fff}.step p{margin:0;color:var(--mut);font-size:12.5px;flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs a{padding:8px 14px;cursor:pointer;border:1px solid transparent;border-bottom:none;border-radius:7px 7px 0 0;color:var(--mut);font-weight:600}
.tabs a.on{background:#fff;border-color:var(--line);color:var(--pri);margin-bottom:-1px}
.note{border-left:4px solid var(--acc);background:var(--warnb);padding:9px 12px;border-radius:6px;font-size:13px;margin:0 0 14px}
.note.info{border-color:var(--blue);background:var(--blueb)}.note.err{border-color:var(--err);background:var(--errb)}.note.ok{border-color:var(--ok);background:var(--okb)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
pre.xml{background:#0f1a22;color:#d7e7ee;padding:12px;border-radius:8px;overflow:auto;max-height:420px;font-size:12px;line-height:1.5;white-space:pre}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
#modal{position:fixed;inset:0;background:rgba(15,26,34,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 14px;overflow:auto}
#modal.on{display:flex}.mbox{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mbox.wide{max-width:1000px}.mbox h2{margin-bottom:12px}
#toast{position:fixed;right:16px;top:64px;z-index:60;display:flex;flex-direction:column;gap:8px}
.tst{background:#17212b;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:380px;font-size:13px}.tst.ok{background:var(--ok)}.tst.err{background:var(--err)}
.hol{background:#fff;border:1px solid #222;padding:16px 18px;font-size:12.5px;color:#000;max-width:820px;margin:0 auto 14px}
.hol h4{margin:0;font-size:15px;text-align:center}.hol .hd{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:8px}
.hol table{width:100%;border-collapse:collapse}.hol th,.hol td{border:1px solid #444;padding:3px 6px}.hol th{background:#eee;font-size:11.5px}
.hol .bx{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:8px}.hol .bx div{border:1px solid #444;padding:4px 6px}.hol .bx small{display:block;font-size:10.5px;color:#333}
.hol .ass{margin-top:26px;display:flex;justify-content:space-between;gap:30px}.hol .ass div{flex:1;border-top:1px solid #000;text-align:center;padding-top:3px;font-size:11.5px}
#printarea{display:none}
.mat td input{width:78px;padding:4px 5px;border:1px solid #c7d0d9;border-radius:5px;text-align:right}
.mat td input.w{width:130px;text-align:left}
.dep{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr auto auto auto auto;gap:8px;align-items:end;margin-bottom:8px;padding:8px;background:#f7f9fa;border-radius:8px}
.dep .f{grid-column:auto}
@media (max-width:900px){#side{display:none}.grid>.f{grid-column:span 6!important}.dep{grid-template-columns:1fr 1fr}}
@media print{body{background:#fff;padding:0}body.printing #top,body.printing #app,body.printing #bar,body.printing #modal,body.printing #toast{display:none!important}body.printing #printarea{display:block}.hol{border:1px solid #000;page-break-after:always;margin:0 auto}}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:2px 0 8px;font-size:12.5px;color:var(--mut)}.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.hb{display:flex;flex-direction:column;gap:7px}.hrow{display:grid;grid-template-columns:minmax(110px,38%) 1fr 92px;gap:8px;align-items:center;font-size:13px}.hrow .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hrow .ht{background:#eef2f5;border-radius:4px;height:12px;display:block}.hrow .ht i{display:block;height:12px;border-radius:0 4px 4px 0}.hrow b{text-align:right;font-weight:600}
#tip{position:fixed;display:none;z-index:60;background:#17212b;color:#fff;padding:6px 9px;border-radius:6px;font-size:12px;max-width:250px;pointer-events:none}
.cmpg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}@media(max-width:900px){.cmpg{grid-template-columns:1fr}}
.cmpc{margin:0}.cmpc.best{border:2px solid var(--ok)}.cmpc.off{opacity:.8}.cmpc .big{font-size:24px;font-weight:700;margin:6px 0 2px}
details.tv{margin-top:8px}details.tv summary{cursor:pointer;color:var(--pri);font-size:13px}

.skip{position:absolute;left:-999px;top:0;background:#fff;color:#000;padding:8px 12px;z-index:200}.skip:focus{left:8px;top:8px}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px}#main:focus{outline:none}
#mnav{display:none;max-width:48vw;padding:6px;border-radius:6px}
#gate{position:fixed;inset:0;background:var(--pri2);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.gbox{background:#fff;border-radius:12px;max-width:460px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4)}.gbox h1{margin-bottom:8px}.gm{color:var(--err);min-height:18px;margin:6px 0}.gl{font-size:12px;color:var(--mut);margin-top:14px}
#ckb{position:fixed;left:12px;right:12px;bottom:12px;z-index:120;background:#fff;border:2px solid var(--pri);border-radius:12px;padding:14px 16px;max-width:860px;margin:0 auto;box-shadow:0 12px 40px rgba(0,0,0,.35)}#ckb h2{margin:0 0 4px}#ckb p{margin:0 0 10px;font-size:13px}#ckb .row{justify-content:flex-end}
.legal h3{margin:14px 0 4px}.legal p{margin:0 0 8px}
@media (max-width:900px){#mnav{display:block;flex:1 1 100%;max-width:none;order:9}#top{flex-wrap:wrap;gap:8px;padding:8px 10px}#top .emp{display:none}#top button{padding:5px 9px;white-space:nowrap}#bar .hint{display:none}#bar{overflow-x:auto;padding:8px 10px}#bar .btn{white-space:nowrap;padding:7px 10px}#main{padding:14px 12px 30px}#ckb{left:6px;right:6px;bottom:6px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{#gate,#ckb{display:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main" data-act="skipMain">Ir para o conteúdo</a>
<header id="top">
  <div class="logo" id="logo"></div>
  <button data-act="home" title="Alt+I">⌂ Tela inicial</button>
  <button data-act="back" title="Alt+V">◀ Voltar</button>
  <select id="mnav" aria-label="Menu de navegação"></select>
  <div class="emp" id="topemp"></div>
</header>
<div id="app"><nav id="side" aria-label="Menu principal"></nav><main id="main"></main></div>
<footer id="bar" role="contentinfo"></footer>
<div id="modal"></div><div id="tip"></div><div id="toast" role="status" aria-live="polite"></div><div id="printarea"></div>
<script>

<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="fp-api" content="">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-Qm3/371wClFwzDB9DcZF/BHnbQIxxyeqVdpQ9EeGHA8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">

<title>Folha de Pagamento e eSocial</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#17212b;--mut:#5d6b79;--line:#dbe2e9;--pri:#0f5c63;--pri2:#0a4146;--pri3:#e3f1f2;--acc:#b7791f;--ok:#1a7f4b;--okb:#e2f4ea;--warn:#9a6700;--warnb:#fff4d6;--err:#b42318;--errb:#fde8e6;--blue:#1f5fbf;--blueb:#e4edfb;--pt:#0f5c63;--s2:#eef2f5;--s3:#e1e7ed;--hov:#e8edf1;--ibd:#c7d0d9;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px}
#top{background:var(--pri2);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;position:sticky;top:0;z-index:20}
#top .logo{font-weight:700;font-size:17px;letter-spacing:.2px}#top .logo span{color:var(--acc2,#e8c37a)}#top .logo img{height:28px;vertical-align:middle;margin-right:8px;border-radius:4px}
#top .emp{margin-left:auto;font-size:12.5px;opacity:.9;text-align:right}
#top button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
#top button:hover{background:rgba(255,255,255,.22)}
#app{display:flex;align-items:flex-start;gap:0;max-width:1500px;margin:0 auto}
#side{width:264px;flex:none;padding:12px 10px;position:sticky;top:52px;max-height:calc(100vh - 130px);overflow:auto;scrollbar-width:thin}
#side .sq{position:sticky;top:-12px;background:var(--bg);padding:2px 0 8px;z-index:2}#side .sq input{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--ibd);border-radius:8px;font:inherit;font-size:13px;background:var(--card)}
#side .top{display:block;padding:8px 10px;margin-bottom:6px;border-radius:8px;color:var(--ink);cursor:pointer;font-weight:600;font-size:14px}
#side .sg{margin:2px 0;border-radius:10px}#side .sh{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;background:transparent;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px;font-weight:700;white-space:nowrap;color:var(--mut);text-align:left}
#side .sh:hover{background:var(--hov);color:var(--ink)}#side .si{width:20px;text-align:center;font-size:14px}#side .sn{flex:1;overflow:hidden;text-overflow:ellipsis}#side .sc{font-size:10.5px;font-weight:600;background:var(--s3);color:#4b5866;border-radius:9px;padding:1px 7px}
#side .sx{font-size:11px;transition:transform .15s}#side .sg.open .sx{transform:rotate(90deg)}#side .sg.open>.sh{color:var(--ink)}
#side .sb{display:none;margin:2px 0 6px 18px;padding-left:8px;border-left:2px solid var(--s3)}#side .sg.open .sb{display:block}
#side .sb a{display:block;padding:6px 10px;margin:1px 0;border-radius:6px;color:var(--ink);cursor:pointer;font-size:13px;line-height:1.3}#side .sb a.hid{display:none}
#side a:hover{background:var(--hov)}#side a.on{background:var(--pri);color:#fff}#side .sb a.on{box-shadow:inset 3px 0 0 rgba(255,255,255,.55)}
#main{flex:1;min-width:0;padding:18px 20px 30px}
h1{font-size:21px;margin:0 0 2px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.grid>.f{grid-column:span 3}
.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px;font-weight:600}
.f input,.f select,.f textarea{width:100%;padding:8px 9px;border:1px solid var(--ibd);border-radius:6px;font:inherit;background:var(--card)}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid #9ccfd3;border-color:var(--pt)}
.f input[readonly]{background:var(--s2)}
.f small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.chk{display:flex!important;align-items:center;gap:7px;font-weight:400!important;font-size:13.5px!important;color:var(--ink)!important;padding-top:6px}.chk input{width:auto!important}
.rq{color:var(--err)}
.btn{border:1px solid var(--ibd);background:var(--card);border-radius:7px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600;color:var(--ink)}
.btn:hover{background:var(--s2)}.btn.pri{background:var(--pri);border-color:var(--pt);color:#fff}.btn.pri:hover{background:var(--pri2)}
.btn.send{background:#8a5a0c;border-color:#8a5a0c;color:#fff}.btn.send:hover{background:#6f470a}
.btn.danger{color:var(--err);border-color:#e3b1ab}.btn.sm{padding:4px 9px;font-size:12.5px;font-weight:600}
.btn[disabled]{opacity:.5;cursor:not-allowed}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:10px;align-items:center;z-index:30;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
#bar .sp{flex:1}#bar .hint{color:var(--mut);font-size:11.5px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--s2);text-align:left;padding:7px 9px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:hover td{background:var(--hov)}.r{text-align:right}.c{text-align:center}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-gray{background:var(--s3);color:#4a5662}.b-blue{background:var(--blueb);color:var(--blue)}.b-ok{background:var(--okb);color:var(--ok)}.b-err{background:var(--errb);color:var(--err)}.b-warn{background:var(--warnb);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.kpi b{display:block;font-size:20px;margin-top:2px}.kpi span{font-size:12px;color:var(--mut)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.step{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--pri3);color:var(--pt);font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-right:6px}
.step.done .n{background:var(--ok);color:#fff}.step p{margin:0;color:var(--mut);font-size:12.5px;flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs a{padding:8px 14px;cursor:pointer;border:1px solid transparent;border-bottom:none;border-radius:7px 7px 0 0;color:var(--mut);font-weight:600}
.tabs a.on{background:var(--card);border-color:var(--line);color:var(--pt);margin-bottom:-1px}
.note{border-left:4px solid var(--acc);background:var(--warnb);padding:9px 12px;border-radius:6px;font-size:13px;margin:0 0 14px}
.note.info{border-color:var(--blue);background:var(--blueb)}.note.err{border-color:var(--err);background:var(--errb)}.note.ok{border-color:var(--ok);background:var(--okb)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
pre.xml{background:#0f1a22;color:#d7e7ee;padding:12px;border-radius:8px;overflow:auto;max-height:420px;font-size:12px;line-height:1.5;white-space:pre}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
#modal{position:fixed;inset:0;background:rgba(15,26,34,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 14px;overflow:auto}
#modal.on{display:flex}.mbox{background:var(--card);border-radius:12px;max-width:760px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mbox.wide{max-width:1000px}.mbox h2{margin-bottom:12px}
#toast{position:fixed;right:16px;top:64px;z-index:60;display:flex;flex-direction:column;gap:8px}
.tst{background:#17212b;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:380px;font-size:13px}.tst.ok{background:var(--ok)}.tst.err{background:var(--err)}
.hol{background:#fff;border:1px solid #222;padding:16px 18px;font-size:12.5px;color:#000;max-width:820px;margin:0 auto 14px}
.hol h4{margin:0;font-size:15px;text-align:center}.hol .hd{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:8px}
.hol table{width:100%;border-collapse:collapse}.hol th,.hol td{border:1px solid #444;padding:3px 6px}.hol th{background:#eee;font-size:11.5px}
.hol .bx{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:8px}.hol .bx div{border:1px solid #444;padding:4px 6px}.hol .bx small{display:block;font-size:10.5px;color:#333}
.hol .ass{margin-top:26px;display:flex;justify-content:space-between;gap:30px}.hol .ass div{flex:1;border-top:1px solid #000;text-align:center;padding-top:3px;font-size:11.5px}
.fch{background:#fff;border:1px solid #222;padding:12px 14px;font-size:11px;color:#000;margin:0 0 14px;position:relative;overflow-x:auto}.fch .fch-hd{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:6px}.fch table{width:100%;border-collapse:collapse}.fch th,.fch td{border:1px solid #444;padding:2px 4px}.fch th{background:#e9edf1}.fch-r::before{content:'RASCUNHO';position:absolute;top:45%;left:20%;font-size:90px;font-weight:700;color:rgba(180,35,24,.10);transform:rotate(-25deg);pointer-events:none}
@media print{.fch{font-size:8.5px;border:0}}
#printarea{display:none}
.mat td input{width:78px;padding:4px 5px;border:1px solid var(--ibd);border-radius:5px;text-align:right}
.mat td input.w{width:130px;text-align:left}
.dep{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr auto auto auto auto;gap:8px;align-items:end;margin-bottom:8px;padding:8px;background:var(--s2);border-radius:8px}
.dep .f{grid-column:auto}
@media (max-width:900px){#side{display:none}.grid>.f{grid-column:span 6!important}.dep{grid-template-columns:1fr 1fr}}
@media print{body{background:#fff;padding:0}body.printing #top,body.printing #app,body.printing #bar,body.printing #modal,body.printing #toast{display:none!important}body.printing #printarea{display:block}.hol{border:1px solid #000;page-break-after:always;margin:0 auto}}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:2px 0 8px;font-size:12.5px;color:var(--mut)}.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.hb{display:flex;flex-direction:column;gap:7px}.hrow{display:grid;grid-template-columns:minmax(110px,38%) 1fr 92px;gap:8px;align-items:center;font-size:13px}.hrow .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hrow .ht{background:var(--s2);border-radius:4px;height:12px;display:block}.hrow .ht i{display:block;height:12px;border-radius:0 4px 4px 0}.hrow b{text-align:right;font-weight:600}
#tip{position:fixed;display:none;z-index:60;background:#17212b;color:#fff;padding:6px 9px;border-radius:6px;font-size:12px;max-width:250px;pointer-events:none}
.cmpg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}@media(max-width:900px){.cmpg{grid-template-columns:1fr}}
.cmpc{margin:0}.cmpc.best{border:2px solid var(--ok)}.cmpc.off{opacity:.8}.cmpc .big{font-size:24px;font-weight:700;margin:6px 0 2px}
details.tv{margin-top:8px}details.tv summary{cursor:pointer;color:var(--pt);font-size:13px}

.skip{position:absolute;left:-999px;top:0;background:var(--card);color:#000;padding:8px 12px;z-index:200}.skip:focus{left:8px;top:8px}
:focus-visible{outline:3px solid #2563eb;outline-offset:2px}#main:focus{outline:none}
#mnav{display:none;max-width:48vw;padding:6px;border-radius:6px}
#gate{position:fixed;inset:0;background:var(--pri2);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.gbox{background:var(--card);border-radius:12px;max-width:460px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4)}.gbox h1{margin-bottom:8px}.gm{color:var(--err);min-height:18px;margin:6px 0}.gl{font-size:12px;color:var(--mut);margin-top:14px}
#ckb{position:fixed;left:12px;right:12px;bottom:12px;z-index:120;background:var(--card);border:2px solid var(--pri);border-radius:12px;padding:14px 16px;max-width:860px;margin:0 auto;box-shadow:0 12px 40px rgba(0,0,0,.35)}#ckb h2{margin:0 0 4px}#ckb p{margin:0 0 10px;font-size:13px}#ckb .row{justify-content:flex-end}
.legal h3{margin:14px 0 4px}.legal p{margin:0 0 8px}
@media (max-width:900px){#mnav{display:block;flex:1 1 100%;max-width:none;order:9}#top{flex-wrap:wrap;gap:8px;padding:8px 10px}#top .emp{display:none}#top button{padding:5px 9px;white-space:nowrap}#bar .hint{display:none}#bar{overflow-x:auto;padding:8px 10px}#bar .btn{white-space:nowrap;padding:7px 10px}#main{padding:14px 12px 30px}#ckb{left:6px;right:6px;bottom:6px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{#gate,#ckb{display:none!important}}
.upd-has{background:var(--acc2,#F2B544)!important;color:#000!important;font-weight:700}
/* campo de senha com olho para mostrar/ocultar */
.pw{position:relative;display:block;flex:1 1 auto;min-width:0}.pw input{width:100%;padding-right:40px;box-sizing:border-box}
.pw .pwb{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;padding:0;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#475467;border-radius:6px}
.pw .pwb:hover{background:rgba(0,0,0,.06)}.pw .pwb:focus-visible{outline:2px solid var(--brand,#0b5cad);outline-offset:1px}.pw .pwb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ===== Tema escuro, tokens e refinamentos (ui21) ===== */
:root[data-theme=dark]{--bg:#0d1217;--card:#151d25;--ink:#e6edf3;--mut:#a3b1bf;--line:#2a3541;--pri:#167a84;--pri2:#0b2f34;--pri3:#12363a;--pt:#6cc4cc;--acc:#b7791f;--ok:#4cc38a;--okb:#11301f;--warn:#f0c04a;--warnb:#36300f;--err:#ff8f86;--errb:#3d1b18;--blue:#8ab8ff;--blueb:#182a47;--s2:#1c2631;--s3:#26323f;--hov:#1f2a35;--ibd:#3a4856;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1217;--card:#151d25;--ink:#e6edf3;--mut:#a3b1bf;--line:#2a3541;--pri:#167a84;--pri2:#0b2f34;--pri3:#12363a;--pt:#6cc4cc;--acc:#b7791f;--ok:#4cc38a;--okb:#11301f;--warn:#f0c04a;--warnb:#36300f;--err:#ff8f86;--errb:#3d1b18;--blue:#8ab8ff;--blueb:#182a47;--s2:#1c2631;--s3:#26323f;--hov:#1f2a35;--ibd:#3a4856;color-scheme:dark}}
:root[data-theme=dark] .step.done .n,:root[data-theme=dark] .tst.ok,:root[data-theme=dark] .tst.err{color:#07130d}
:root[data-theme=dark] .b-gray{color:#c9d3dd}:root[data-theme=dark] .f input::placeholder{color:#7d8c9b}
:root[data-theme=dark] svg [fill="#5d6b79"]{fill:var(--mut)}:root[data-theme=dark] svg [fill="#17212b"]{fill:var(--ink)}:root[data-theme=dark] svg [stroke="#e3e8ee"]{stroke:var(--line)}:root[data-theme=dark] svg [stroke="#fff"]{stroke:var(--card)}
:root[data-theme=dark] #gate .gbox,:root[data-theme=dark] .mbox{color:var(--ink)}
:root[data-theme=dark] #side a.on,:root[data-theme=dark] #side .sb a.on{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .step.done .n,:root:not([data-theme=light]) .tst.ok,:root:not([data-theme=light]) .tst.err{color:#07130d}:root:not([data-theme=light]) .b-gray{color:#c9d3dd}:root:not([data-theme=light]) svg [fill="#5d6b79"]{fill:var(--mut)}:root:not([data-theme=light]) svg [fill="#17212b"]{fill:var(--ink)}:root:not([data-theme=light]) svg [stroke="#e3e8ee"]{stroke:var(--line)}:root:not([data-theme=light]) svg [stroke="#fff"]{stroke:var(--card)}}
#side .sc{color:var(--mut)}
/* números alinhados, cabeçalho de tabela fixo, alvos de toque (WCAG 2.2, critério 2.5.8) */
table.t td.r,table.t th.r,.kpi b,.hrow .hv{font-variant-numeric:tabular-nums}
.tw{max-height:72vh}.tw table.t th{position:sticky;top:0;z-index:1}
@media (pointer:coarse){.btn,#top button{min-height:44px}.btn.sm{min-height:40px}.f input,.f select{min-height:44px}#side .sb a{padding:10px}}
html{scroll-padding-top:70px}
/* paleta de comandos */
#cmdk{position:fixed;inset:0;z-index:90;background:rgba(5,10,14,.55);display:none;align-items:flex-start;justify-content:center;padding:12vh 14px 14px}
#cmdk.on{display:flex}#cmdk .cb{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:100%;max-width:640px;box-shadow:0 24px 70px rgba(0,0,0,.45);overflow:hidden}
#cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font:inherit;font-size:16px;background:transparent;color:var(--ink);outline:none}
#cmdk ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
#cmdk li{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer}
#cmdk li small{color:var(--mut)}#cmdk li[aria-selected=true]{background:var(--pri);color:#fff}#cmdk li[aria-selected=true] small{color:#e3f1f2}
#cmdk .ft{padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
kbd{font:11.5px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--ibd);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--s2)}
.empty{text-align:center;padding:28px 12px;color:var(--mut)}.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* carrossel de empresas (ui22) */
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ecar{overflow:hidden}.ec-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}.ec-top h2{margin:0}
.ec-busca{display:flex;align-items:center;gap:10px;flex:1;min-width:240px;max-width:480px}.ec-busca input{flex:1;min-height:38px;padding:6px 12px;border:1px solid var(--ibd);border-radius:20px;background:var(--card);color:var(--ink);font:inherit}
.ec-stage{position:relative;height:320px;margin:10px 0 4px;perspective:1100px;outline:none;touch-action:pan-y;user-select:none}
.ec-stage:focus-visible{box-shadow:0 0 0 3px var(--pt);border-radius:12px}
.ec-card{position:absolute;left:50%;top:14px;width:270px;min-height:250px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 6px 18px rgba(0,0,0,.14);cursor:pointer;display:flex;flex-direction:column;gap:4px;filter:saturate(.45) brightness(.97);transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s,filter .4s,box-shadow .4s,border-color .4s;will-change:transform}

const onlyD=s=>String(s==null?'':s).replace(/\D/g,'');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fx=v=>r2(v).toFixed(2);
const brIn=v=>(v===''||v==null||isNaN(v))?'':Number(v).toFixed(2).replace('.',',');
function cpfValido(c){c=onlyD(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);if((s*10)%11%10!=c[t])return false;}return true;}
const onlyC=s=>String(s==null?'':s).toUpperCase().replace(/[^A-Z0-9]/g,'');
/* CNPJ alfanumérico (IN RFB nº 2.229/2024): 8 posições de raiz e 4 de ordem em [A-Z0-9], 2 DV numéricos.
   DV por módulo 11, pesos 5,4,3,2,9,8,7,6,5,4,3,2 (1º) e 6,5,...,2 (2º); valor do caractere = código ASCII − 48.
   Para CNPJ só numérico o resultado é idêntico ao algoritmo anterior. */
const cnpjDV=(b)=>{const p1=[5,4,3,2,9,8,7,6,5,4,3,2],p2=[6,5,4,3,2,9,8,7,6,5,4,3,2];const v=i=>b.charCodeAt(i)-48;
  let s=0;for(let i=0;i<12;i++)s+=v(i)*p1[i];let r=s%11;const d1=r<2?0:11-r;
  s=0;for(let i=0;i<12;i++)s+=v(i)*p2[i];s+=d1*p2[12];r=s%11;const d2=r<2?0:11-r;return ''+d1+d2;};
function cnpjValido(c){c=onlyC(c);if(!/^[A-Z0-9]{12}\d{2}$/.test(c)||/^(.)\1+$/.test(c))return false;return cnpjDV(c.slice(0,12))===c.slice(12);}
const cnpjGerar=b=>{b=onlyC(b).slice(0,12).padEnd(12,'0');return b+cnpjDV(b);};
const fmtCPF=c=>{c=onlyD(c);return c.length===11?c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):c;};
const fmtCNPJ=c=>{c=onlyC(c);return c.length===14?c.replace(/^(.{2})(.{3})(.{3})(.{4})(.{2})$/,'$1.$2.$3/$4-$5'):c;};
const fmtCEP=c=>{c=onlyD(c);return c.length===8?c.replace(/(\d{5})(\d{3})/,'$1-$2'):c;};

function calc13(e,ano,P,media,fimProj){const avos=avos13(e,ano,fimProj),base=remunBase(e,P,media),bruto=r2(base/12*avos),p1v=r2(bruto/2);
  const nDep=(e.deps||[]).filter(d=>d.irrf).length;const inss13=calcInss(bruto,P);const ir=calcIrrf(bruto,inss13,nDep,0,P);
  return{avos,base,bruto,p1:p1v,inss13,irrf13:ir.irrf,fgts13:tr2(bruto*(e.categoria==='103'?P.fgtsAprendiz:P.fgts)/100),liq2:r2(bruto-p1v-inss13-ir.irrf)};}
const MOTIVOS_RESC={'01':'Justa causa (iniciativa do empregador)','02':'Sem justa causa (iniciativa do empregador)','06':'Término de contrato a termo','07':'Pedido de demissão (iniciativa do empregado)','17':'Rescisão indireta','33':'Acordo entre as partes (CLT, art. 484-A)'};
const AVISOS={indenizado:'Indenizado (empregador dispensa o cumprimento)',trabalhado:'Trabalhado',nao_cumprido:'Não cumprido pelo empregado (desconto)',dispensado:'Dispensado / não aplicável'};
function anosCompletos(ini,fim){const a=new Date(ini+'T12:00:00'),b=new Date(fim+'T12:00:00');let n=b.getFullYear()-a.getFullYear();const an=new Date(b.getFullYear(),a.getMonth(),a.getDate(),12);if(b<an)n--;return Math.max(0,n);}
/* Lei 12.506/2011: 30 dias + 3 por ano completo, até 90 */
const diasAviso=anos=>Math.min(90,30+3*Math.max(0,anos));
function calcRescisaoVerbas(e,r,P){const notas=[],mt=r.motivo;const anos=anosCompletos(e.admissao,e.desligamento);
  const rem=remunBase(e,P,r.media),d=rem/30;let avisoDias=diasAviso(anos),aviso=0,avisoDesc=0;
  const semJC=['02','17','33'].includes(mt);
  if(r.aviso==='indenizado'&&semJC){aviso=r2(d*avisoDias*(mt==='33'?0.5:1));if(mt==='33')notas.push('Acordo (art. 484-A, I, a, CLT): aviso prévio indenizado pela metade.');}
  else if(r.aviso==='nao_cumprido'&&mt==='07'){avisoDesc=r2(rem);notas.push('Aviso prévio não cumprido: desconto de 30 dias de remuneração (CLT, art. 487, §2º).');}
  if(r.aviso!=='indenizado')avisoDias=0;if(!aviso&&!avisoDesc)avisoDias=0;
  const proj=aviso>0?avisoDias:0;const fimProj=proj?new Date(new Date(e.desligamento+'T12:00:00').getTime()+proj*864e5):null;
  if(proj)notas.push('Aviso indenizado projeta o tempo de serviço para 13º e férias proporcionais (CLT, art. 487, §1º; Súmula 371 do TST) **.');
  let avos13c=0,d13=0,inss13=0,irrf13=0;
  if(mt!=='01'){avos13c=avos13(e,Number(e.desligamento.slice(0,4)),fimProj);d13=r2(rem/12*avos13c);
    const nDep=(e.deps||[]).filter(x=>x.irrf).length;inss13=calcInss(d13,P);irrf13=calcIrrf(d13,inss13,nDep,0,P).irrf;}
  else notas.push('Justa causa: sem 13º proporcional nem férias proporcionais (Lei 4.090/62, art. 3º; CLT, art. 146, parágrafo único) **.');
  const ferVencPer=num(r.ferVencPer),ferVenc=r2(rem*ferVencPer),ferVencTerco=r2(ferVenc/3);
  let avosFer=0,ferProp=0,ferPropTerco=0;
  if(mt!=='01'){const adm=new Date(e.admissao+'T12:00:00'),fim=fimProj||new Date(e.desligamento+'T12:00:00');
    let ult=new Date(fim.getFullYear(),adm.getMonth(),adm.getDate(),12);if(ult>fim)ult=new Date(fim.getFullYear()-1,adm.getMonth(),adm.getDate(),12);
    ult=new Date(Math.max(ult.getTime(),adm.getTime()));let m=0,cur=new Date(ult);
    while(true){const nx=new Date(cur.getFullYear(),cur.getMonth()+1,cur.getDate(),12);if(nx<=new Date(fim.getTime()+864e5)){m++;cur=nx;}else break;}
    const rest=Math.round((fim-cur)/864e5)+1;avosFer=Math.min(12,m+(rest>=15?1:0));if(avosFer>=12)avosFer=12;
    ferProp=r2(rem/12*avosFer);ferPropTerco=r2(ferProp/3);}
  const multaPct=['02','17'].includes(mt)?40:mt==='33'?20:0;
  const depRes=r2((aviso+d13)*P.fgts/100);const multaFgts=r2((num(r.saldoFgts)+depRes)*multaPct/100);
  if(multaPct)notas.push('Multa rescisória do FGTS de '+multaPct+(mt==='33'?'% (CLT, art. 484-A, I, b)':'% (Lei 8.036/90, art. 18, §1º)')+', estimada sobre o saldo informado mais os depósitos da rescisão; é paga via FGTS Digital e não integra o líquido **.');
  return{avisoDias:proj||avisoDias,aviso,avisoDesc,avos13:avos13c,d13,inss13,irrf13,ferVenc,ferVencTerco,avosFer,ferProp,ferPropTerco,multaPct,multaFgts,notas,
    bruto:r2(aviso+d13+ferVenc+ferVencTerco+ferProp+ferPropTerco)};}

// versão simples e segura de indentação
function fmtXml(xml){
  const tokens=xml.replace(/>\s*</g,'><').split(/(?=<)|(?<=>)/).filter(Boolean);
  let out=[],ind=0,i=0;
  while(i<tokens.length){
    const t=tokens[i];
    if(/^<\?/.test(t)){out.push(t);i++;continue;}
    if(/^<\//.test(t)){ind=Math.max(0,ind-1);out.push('  '.repeat(ind)+t);i++;continue;}
    if(/^<[^>]+\/>$/.test(t)){out.push('  '.repeat(ind)+t);i++;continue;}
    if(/^</.test(t)){
      if(tokens[i+1]&&!/^</.test(tokens[i+1])&&tokens[i+2]&&/^<\//.test(tokens[i+2])){out.push('  '.repeat(ind)+t+tokens[i+1]+tokens[i+2]);i+=3;continue;}
      out.push('  '.repeat(ind)+t);ind++;i++;continue;}
    i++;
  }
  return out.join('\n');
}

function validarBase(ev){
  const o=[],E=DB.empresa;if(!E){o.push('Empresa não cadastrada.');return o;}
  if(!cnpjValido(E.cnpj))o.push('CNPJ do empregador inválido.');

  const{tipo,args}=ev.gen;
  if((args&&args.ci)||tipo==='S-2300')return validarCI(ev,o,E);
  if(['S-1000'].includes(tipo)&&!E.classTrib)o.push('Informe a classificação tributária (classTrib).');
  if(tipo==='S-2200'||tipo==='S-2206'||tipo==='S-2230'||tipo==='S-2299'||tipo==='S-1200'||tipo==='S-1210'){
    const e=byId(DB.empregados,args.id);if(!e){o.push('Empregado não encontrado.');return o;}
    if(!cpfValido(e.cpf))o.push('CPF do empregado inválido.');
    if(tipo==='S-2200'){['nome','nasc','admissao','salario','mae','logr','cep','codMunic','uf'].forEach(k=>{if(!e[k]||(k==='salario'&&!num(e[k])))o.push('Campo obrigatório ausente no empregado: '+k);});if(!e.lotacao)o.push('Informe a lotação.');if(!e.estab)o.push('Informe o estabelecimento.');if(onlyC(e.sindCnpj).length!==14)o.push('Informe o CNPJ do sindicato da categoria profissional (S-2200: cnpjSindCategProf é obrigatório no leiaute S-1.3).');if(!String(e.dscJorn||'').trim())o.push('Informe a descrição da jornada contratual (S-2200: dscJorn é obrigatório no leiaute S-1.3).');}
  }
  if(['S-1010','S-1200','S-2299'].includes(tipo)){const rb=DB.rubricas.filter(r=>(!r.opt||rubricaUsada(r.sys))&&(!r.nat||!/^\d{4}$/.test(r.nat)));if(tipo==='S-1010'&&args.id){const r1=DB.rubricas.find(x=>x.sys===args.id);if(r1&&(!r1.nat||!/^\d{4}$/.test(r1.nat)))o.push('Rubrica '+r1.cod+' sem natureza válida (Tabela 3 do eSocial; XSD: natRubr obrigatório, 4 dígitos).');}else if(tipo!=='S-1010'&&rb.length)o.push('Rubricas sem natureza (Tabela 3 do eSocial): '+rb.map(r=>r.cod).join(', '));}
  /* dependências */
  const simOK=(t,f)=>DB.eventos.some(x=>x.tipo===t&&x.status==='processado'&&(!f||f(x)));
  if(tipo!=='S-1000'&&!simOK('S-1000'))o.push('Dependência: o S-1000 (empregador) ainda não foi processado com sucesso.');
  if(tipo==='S-1200'&&rescNoMes(args.id,args.comp))o.push('Este trabalhador foi desligado na competência: as verbas vão no S-2299, não no S-1200.');
  if(tipo==='S-1200'){if(!simOK('S-2200',x=>x.empId===args.id))o.push('Dependência: S-2200 (admissão) do trabalhador ainda não processado.');if(!simOK('S-1010'))o.push('Dependência: tabela de rubricas (S-1010) ainda não processada.');if(!simOK('S-1020'))o.push('Dependência: tabela de lotações (S-1020) ainda não processada.');}
  if(tipo==='S-1210'){if(rescNoMes(args.id,args.comp)){if(!simOK('S-2299',x=>x.empId===args.id))o.push('Dependência: S-2299 (desligamento, com as verbas rescisórias) ainda não processado.');}else if(!simOK('S-1200',x=>x.empId===args.id&&x.comp===args.comp))o.push('Dependência: S-1200 do trabalhador na competência ainda não processado.');}
  if(tipo==='S-1299'){const c=DB.comps[args.comp];const ids=c?Object.keys(c.res):[];ids.forEach(id=>{if(rescNoMes(id,args.comp)){if(!simOK('S-2299',x=>x.empId===id))o.push('Dependência: S-2299 pendente de '+(byId(DB.empregados,id)||{}).nome);}else if(!simOK('S-1200',x=>x.empId===id&&x.comp===args.comp))o.push('Dependência: S-1200 pendente de '+(byId(DB.empregados,id)||{}).nome);if(!simOK('S-1210',x=>x.empId===id&&x.comp===args.comp))o.push('Dependência: S-1210 pendente de '+(byId(DB.empregados,id)||{}).nome);});}
  return o;
}

    if(!l)o.push('Lotação do empregado não existe mais no cadastro.');if(!s)o.push('Estabelecimento do empregado não existe mais no cadastro.');
    if(l&&!DB.eventos.some(x=>x.tipo==='S-1020'&&x.status==='processado'&&x.gen.args.id===l.id))o.push('Dependência: a lotação '+l.cod+' (S-1020) ainda não foi processada.');
    if(s&&!DB.eventos.some(x=>x.tipo==='S-1005'&&x.status==='processado'&&x.gen.args.id===s.id))o.push('Dependência: o estabelecimento '+s.nome+' (S-1005) ainda não foi processado.');}}
  return o;}

/* ===================== Comparativo de regimes (Simples × Presumido × Real) ===================== */
/* Tabelas dos Anexos I a V — LC 123/2006, redação da LC 155/2016: [RBT12 até, alíquota nominal %, parcela a deduzir R$] */
const SN_TAB={
 I:[[180000,4,0],[360000,7.3,5940],[720000,9.5,13860],[1800000,10.7,22500],[3600000,14.3,87300],[4800000,19,378000]],
 II:[[180000,4.5,0],[360000,7.8,5940],[720000,10,13860],[1800000,11.2,22500],[3600000,14.7,85500],[4800000,30,720000]],
 III:[[180000,6,0],[360000,11.2,9360],[720000,13.5,17640],[1800000,16,35640],[3600000,21,125640],[4800000,33,648000]],
 IV:[[180000,4.5,0],[360000,9,8100],[720000,10.2,12420],[1800000,14,39780],[3600000,22,183780],[4800000,33,828000]],
 V:[[180000,15.5,0],[360000,18,4500],[720000,19.5,9900],[1800000,20.5,17100],[3600000,23,62100],[4800000,30.5,540000]]};
function snEfetiva(anexo,rbt12){const t=SN_TAB[anexo];const f=t.find(x=>rbt12<=x[0]);if(!f)return null;
  const rb=Math.max(rbt12,1);return{nom:f[1],pd:f[2],faixa:t.indexOf(f)+1,ef:rbt12<=0?f[1]:Math.max(0,(rb*f[1]/100-f[2])/rb*100)};}
/* Percentuais de presunção: [IRPJ %, CSLL %] — Lei 9.249/1995, arts. 15 e 20 */
const PRES={com:['Comércio e indústria',8,12],serv:['Serviços em geral, intermediação, locação (32%)',32,32],carga:['Transporte de cargas',8,12],hosp:['Serviços hospitalares',8,12],pass:['Transporte de passageiros',16,12]};
const CMP_DEF={rec:100000,rbt12:0,ativ:'serv',snServ:'fatorR',pres:'serv',iss:3,icms:0,sal:15000,prol:5000,desp:20000,credBase:5000,rat:2,terc:5.8,lc224:true};
function cmpEncargos(i,regime,anexoIV){ /* valor ANUAL */ // CPP patronal, RAT, terceiros — Lei 8.212/91, art. 22, I a III
  const pat=num(DB&&DB.params?DB.params.patronal:20);
  if(regime==='sn'&&!anexoIV)return 0;
  const temTerc=regime!=='sn';
  return r2((num(i.sal)*(pat+num(i.rat)+(temTerc?num(i.terc):0))/100+num(i.prol)*pat/100)*12);}
function calcSimplesCmp(i){const rec=num(i.rec),rbt=num(i.rbt12)>0?num(i.rbt12):rec*12,fgts=num(i.sal)*0.08;
  const o={key:'sn',nome:'Simples Nacional',notas:[]};
  if(rbt>4800000){o.elegivel=false;o.motivo='RBT12 acima de R$ 4,8 milhões: ultrapassa o limite do Simples (LC 123/2006, art. 3º, II).';return o;}
  const fatorR=rbt>0?(num(i.sal)+num(i.prol)+fgts)*12/rbt:0;o.fatorR=fatorR;
  let anexo=i.ativ==='com'?'I':i.ativ==='ind'?'II':(i.snServ==='fatorR'?(fatorR>=0.28?'III':'V'):i.snServ);
  if(i.ativ==='ind')anexo='II';
  const e=snEfetiva(anexo,rbt);o.anexo=anexo;o.efetiva=e.ef;o.faixa=e.faixa;
  if(i.ativ==='serv'&&i.snServ==='fatorR')o.notas.push('Fator R = '+(fatorR*100).toFixed(1).replace('.',',')+'% → '+(fatorR>=0.28?'Anexo III (fator R ≥ 28%)':'Anexo V (fator R < 28%)')+'.');
  const das=r2(rec*12*e.ef/100);const iv=anexo==='IV';const enc=cmpEncargos(i,'sn',iv);
  let fora=0;if(rbt>3600000){fora=r2(rec*12*(i.ativ==='serv'?num(i.iss):num(i.icms))/100);o.notas.push('RBT12 acima de R$ 3,6 milhões: ICMS/ISS são recolhidos fora do DAS (LC 123/2006, art. 13-A). Estimativa conservadora: o ISS/ICMS informado foi somado integralmente, sem abater sua parcela do DAS.');}
  if(iv)o.notas.push('Anexo IV: a CPP patronal (20%) e o RAT não estão no DAS e são recolhidos à parte (LC 123/2006, art. 18, §5º-C); terceiros dispensados.');
  o.partes={das,irpj:0,csll:0,pc:0,iss:i.ativ==='serv'?fora:0,icms:i.ativ==='serv'?0:fora,enc};o.elegivel=true;return o;}
function calcPresumidoCmp(i){const R=num(i.rec)*12,P=PRES[i.pres]||PRES.serv,lim=5000000,f=i.lc224?1.1:1;
  const o={key:'lp',nome:'Lucro Presumido',notas:[],elegivel:true};
  if(R>78000000){o.elegivel=false;o.motivo='Receita bruta anual acima de R$ 78 milhões: vedado o Lucro Presumido (Lei 9.718/1998, art. 14, I).';return o;}
  const baseIr=P[1]/100*(Math.min(R,lim)+f*Math.max(R-lim,0)),baseCs=P[2]/100*(Math.min(R,lim)+f*Math.max(R-lim,0));
  const irpj=r2(baseIr*0.15+Math.max(0,baseIr-240000)*0.10),csll=r2(baseCs*0.09);
  const pc=r2(R*0.0365),iss=i.ativ==='serv'?r2(R*num(i.iss)/100):0,icms=i.ativ==='serv'?0:r2(R*num(i.icms)/100);
  if(R>lim&&i.lc224)o.notas.push('Acréscimo de 10% nos percentuais de presunção sobre a receita anual que excede R$ 5 milhões (LC 224/2025; IN RFB 2.305/2025). A CSLL só sofre o acréscimo a partir de 1º/04/2026 e há discussão judicial: a conta aplica o acréscimo nos 12 meses **.');
  o.base={irpj:baseIr,csll:baseCs};o.partes={das:0,irpj,csll,pc,iss,icms,enc:cmpEncargos(i,'lp')};return o;}
function calcRealCmp(i){const R=num(i.rec)*12;const o={key:'lr',nome:'Lucro Real',notas:[],elegivel:true};
  const enc=cmpEncargos(i,'lr'),fgts=num(i.sal)*0.08*12,folha=num(i.sal)*12+num(i.prol)*12+fgts+enc;
  const deb=R*0.0925,cred=num(i.credBase)*12*0.0925,pc=r2(Math.max(0,deb-cred));
  const iss=i.ativ==='serv'?r2(R*num(i.iss)/100):0,icms=i.ativ==='serv'?0:r2(R*num(i.icms)/100);
  const lucro=R-pc-iss-icms-num(i.desp)*12-folha;o.lucro=lucro;
  const irpj=r2(Math.max(0,lucro)*0.15+Math.max(0,lucro-240000)*0.10),csll=r2(Math.max(0,lucro)*0.09);
  if(lucro<=0)o.notas.push('Prejuízo fiscal no período: IRPJ e CSLL zerados. O prejuízo pode ser compensado em períodos futuros (limite de 30% do lucro) — não simulado (Lei 9.065/1995, art. 15) **.');
  o.notas.push('PIS/COFINS não cumulativos: 1,65% + 7,6% sobre a receita, menos créditos de 9,25% sobre a base informada (Leis 10.637/2002 e 10.833/2003, arts. 2º e 3º).');
  o.partes={das:0,irpj,csll,pc,iss,icms,enc};return o;}
function compararRegimes(i){const R=num(i.rec)*12,fgts=num(i.sal)*0.08*12;
  const out=[calcSimplesCmp(i),calcPresumidoCmp(i),calcRealCmp(i)];
  out.forEach(o=>{if(!o.elegivel)return;const p=o.partes;o.total=r2(p.das+p.irpj+p.csll+p.pc+p.iss+p.icms+p.enc);o.carga=R>0?o.total/R*100:0;
    o.resultado=r2(R-num(i.desp)*12-num(i.sal)*12-num(i.prol)*12-fgts-o.total);});
  const el=out.filter(o=>o.elegivel);if(el.length){const m=Math.min(...el.map(o=>o.total));el.forEach(o=>{o.melhor=o.total===m;o.dif=r2(o.total-m);});}
  return out;}
function varrerReceita(i,mults){return mults.map(m=>{const j=Object.assign({},i,{rec:num(i.rec)*m,sal:num(i.sal)*m,prol:num(i.prol),desp:num(i.desp)*m,credBase:num(i.credBase)*m,rbt12:0});
  const r=compararRegimes(j);return{rec:j.rec*12,v:r.map(o=>o.elegivel?o.carga:null)};});}

/* ===================== CRUD genérico (cadastros auxiliares) ===================== */
function crud(name,cfg){
  CR[name]=cfg;
  SC[name]={
    view(p){const rows=cfg.list();const ed=p.edit!=null?cfg.list().find(x=>x[cfg.key]===p.edit):null;
      const showForm=p.novo||ed;
      return `<h1>${cfg.title}</h1><p class="sub">${cfg.sub||''}</p>${exigeEmpresa()}${cfg.note?`<div class="note info">${typeof cfg.note==='function'?cfg.note():cfg.note}</div>`:''}
      ${showForm?`<div class="card" data-form id="f"><h2>${ed?'Editar':'Novo'} registro</h2><div class="grid">${cfg.fields(ed||cfg.novo&&cfg.novo()||{},!!ed)}</div></div>`:''}
      <div class="card"><div class="row sp"><h2>Registros (${rows.length})</h2>${cfg.noAdd?'':`<button class="btn pri" data-act="crudNovo">${cfg.newLabel||'＋ Novo'}</button>`}</div>
      <div class="tw"><table class="t"><thead><tr>${cfg.cols.map(c=>`<th>${c[1]}</th>`).join('')}${cfg.tipo?'<th>eSocial</th>':''}<th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr>${cfg.cols.map(c=>`<td>${c[2]?c[2](r):esc(r[c[0]])}</td>`).join('')}${cfg.tipo?`<td>${stBadge(ultEv(cfg.tipo,e=>e.gen.args.id===r[cfg.key]))}</td>`:''}
      <td class="r"><button class="btn sm" data-act="crudEdit" data-id="${esc(r[cfg.key])}">Editar</button> ${cfg.tipo?`<button class="btn sm send" data-act="crudSend" data-id="${esc(r[cfg.key])}">Enviar ${cfg.tipo}</button> `:''}${cfg.rowBtns?cfg.rowBtns(r):''}${(typeof cfg.noDel==='function'?cfg.noDel(r):cfg.noDel)?'':`<button class="btn sm danger" data-act="crudDel" data-id="${esc(r[cfg.key])}">Excluir</button>`}</td></tr>`).join('')||`<tr><td colspan="${cfg.cols.length+2}" class="c" style="color:var(--mut);padding:18px">Nenhum registro cadastrado.</td></tr>`}
      </tbody></table></div></div>`;},
    actions(p){const a=[];if(p.novo||p.edit!=null){a.push({label:'Cancelar edição',act:'crudCancel'},{label:'💾 Salvar',act:'crudSave',cls:'pri',key:'save'});if(cfg.tipo)a.push({label:'Salvar e enviar '+cfg.tipo+' ao eSocial',act:'crudSaveSend',cls:'send',key:'send'});}
      else if(cfg.tipo)a.push({label:'Enviar todos ('+cfg.tipo+') ao eSocial',act:'crudSendAll',cls:'send',key:'send'});return a;}
  };
}
const crudCfg=()=>CR[NAV.cur.name];
ACT.crudNovo=()=>refresh({novo:true,edit:null});
ACT.crudCancel=()=>guard(()=>refresh({novo:false,edit:null}));
ACT.crudEdit=el=>refresh({edit:el.dataset.id,novo:false});
ACT.crudDel=el=>{const cfg=crudCfg();if(cfg.delCheck){const m=cfg.delCheck(cfg.list().find(x=>String(x[cfg.key])===el.dataset.id));if(m){toast(m,'err');return;}}modalConfirm(cfg.delMsg||'Excluir este registro? Eventos já enviados ao eSocial não são desfeitos por esta ação.',()=>{const a=cfg.list();const i=a.findIndex(x=>String(x[cfg.key])===el.dataset.id);if(i>=0)a.splice(i,1);saveDB();refresh();toast('Registro excluído.');},{yes:'Excluir'});};
function crudSalvar(){const cfg=crudCfg(),f=$('#f');if(!f)return null;const mis=faltando(f);if(mis.length){toast('Preencha: '+mis.join(', '),'err');return null;}
  const o=readForm(f),p=NAV.cur.params;if(cfg.validate){const m=cfg.validate(o);if(m){toast(m,'err');return null;}}
  const arr=cfg.list();let rec;if(p.edit!=null){rec=arr.find(x=>String(x[cfg.key])===String(p.edit));Object.assign(rec,o);}else{rec=Object.assign({[cfg.key]:uid('r')},o);arr.push(rec);}
  saveDB();DIRTY=false;toast('Registro salvo.','ok');return rec;}
ACT.crudSave=()=>{if(crudSalvar())refresh({novo:false,edit:null});};
ACT.crudSaveSend=async()=>{const cfg=crudCfg();const r=crudSalvar();if(!r)return;refresh({novo:false,edit:null});await enviarRegistro(cfg.tipo,r[cfg.key]);};
ACT.crudSend=async el=>{await enviarRegistro(crudCfg().tipo,el.dataset.id);};
ACT.crudSendAll=async()=>{const cfg=crudCfg();for(const r of cfg.list())await enviarRegistro(cfg.tipo,r[cfg.key],true);toast('Envio concluído. Veja a Biblioteca de eventos.','ok');refresh();};
async function enviarRegistro(tipo,id,quiet){if(!DB.empresa){toast('Cadastre a empresa primeiro.','err');return;}
  const ev=criarEvento(tipo,{id});const r=await enviarEventos([ev]);if(!quiet)resumoEnvio(r,[ev]);refresh();}
function resumoEnvio(r,evs){if(r.rej||r.err){modal(`<div class="note err">Envio com ocorrências.</div>${evs.filter(e=>e.status==='rejeitado'||e.status==='gerado').map(e=>`<p><b>${esc(e.tipo)} — ${esc(e.titulo)}</b><br>${(e.ocorr||[]).map(o=>'• '+esc(o)).join('<br>')||'Sem detalhes.'}</p>`).join('')}<div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Fechar</button><button class="btn pri" data-act="nav" data-to="biblioteca">Abrir biblioteca</button></div>`,{title:'Retorno do envio'});}
  else toast(`Enviado: ${r.ok} evento(s) processado(s) com sucesso${DB.cfg.modo==='sim'?' (simulação)':''}.`,'ok');}

crud('estabs',{title:'Estabelecimentos (S-1005)',sub:'Matriz, filiais e obras (CNO) onde há trabalhadores. É aqui que ficam o CNAE preponderante, o grau de risco (RAT) e o FAP.',tipo:'S-1005',key:'id',list:()=>DB.estabs,

  validate:o=>{const E=DB.empresa;if(!E)return 'Cadastre a empresa antes.';const ed=NAV.cur.params.edit;
    o.nrInsc=onlyC(o.nrInsc);

function regraPanel(E){E=E||{};const rg=E.regime||'lp',an=E.anexo||'std',cp=!!E.cprb&&rg!=='sn';
  const T=(n,inc,base)=>`<tr><td>${n}</td><td class="c">${inc}</td><td>${base}</td></tr>`;const sim=badge('Sim','ok'),nao=badge('Não','gray'),par=(x)=>badge(x,'warn');
  let rows='',txt='';
  if(rg==='sn'){const iv=an==='iv',mx=an==='misto';
    rows=T('CPP patronal 20%',iv?sim:mx?par('só lotações não substituídas'):nao,'LC 123/2006, art. 13, §3º e art. 18, §5º-C (Anexo IV e atividades vedadas)')+T('RAT × FAP',iv?sim:mx?par('só lotações não substituídas'):nao,'Mesmo tratamento da CPP')+T('Terceiros (Sistema S, salário-educação, INCRA)',nao,'LC 123/2006, art. 13, §3º')+T('FGTS 8%',sim,'Lei 8.036/90, art. 15')+T('INSS do empregado e IRRF',sim,'Lei 8.212/91, art. 20; Lei 7.713/88');
    txt=`classTrib <b>${classTribDe(E)||classTribDe({regime:'sn',anexo:an})}</b>. `+(iv?'Anexo IV: a CPP não está no DAS; a folha apura CPP 20% e RAT.':mx?'Misto: a classificação 02 exige que cada lotação diga se a atividade é de CPP substituída ou não.':'A CPP está no DAS; a folha só apura FGTS, INSS do empregado e IRRF.');}
  else{rows=T('CPP patronal 20%',cp?par('reduzida (reoneração gradual)'):sim,cp?'Lei 14.973/2024 (reoneração progressiva da folha: 25% em 2025, 50% em 2026, 75% em 2027) **':'Lei 8.212/91, art. 22, I')+T('RAT × FAP',sim,'Lei 8.212/91, art. 22, II; Lei 10.666/2003, art. 10')+T('Terceiros (conforme FPAS)',sim,'Tabela 4 do eSocial')+T('FGTS 8%',sim,'Lei 8.036/90, art. 15')+T('INSS do empregado e IRRF',sim,'Lei 8.212/91, art. 20; Lei 7.713/88');
    txt=`classTrib <b>99</b>. ${REGIMES[rg]}: a folha tem a mesma incidência previdenciária; o regime afeta IRPJ/CSLL/PIS/COFINS, que não são tratados aqui. ${cp?'No S-1000, indDesFolha = 1.':'No S-1000, indDesFolha = 0.'}`;}
  return `<div class="tw"><table class="t"><thead><tr><th>Contribuição</th><th class="c">Incide na folha?</th><th>Base legal</th></tr></thead><tbody>${rows}</tbody></table></div><p class="sub" style="margin:8px 0 0">${txt}</p>`;}
SC.empresa.mount=()=>{const f=$('#f');if(!f)return;const upd=()=>{const o=readForm(f);const E={regime:o.regime,anexo:o.anexo,cprb:o.cprb&&o.regime!=='sn'};
  const an=f.querySelector('[name=anexo]').closest('.f'),cb=f.querySelector('[name=cprb]').closest('.f');an.style.display=o.regime==='sn'?'':'none';cb.style.display=o.regime==='sn'?'none':'';
  f.querySelector('[name=classTribV]').value=classTribDe(E);$('#regraBox').innerHTML=regraPanel(E);
  if(o.regime==='sn'){f.querySelector('[name=cprb]').checked=false;}};
  ['regime','anexo','cprb'].forEach(n=>f.querySelector('[name='+n+']').addEventListener('change',upd));upd();DIRTY=false;};
function empSalvar(){const f=$('#f'),mis=faltando(f);if(mis.length){toast('Preencha: '+mis.join(', '),'err');return false;}const o=readForm(f);
  if(!cnpjValido(o.cnpj)){toast('CNPJ inválido.','err');return false;}if(!cpfValido(o.ctCpf)){toast('CPF do contato inválido.','err');return false;}
  o.cnpj=onlyC(o.cnpj);o.ctCpf=onlyD(o.ctCpf);delete o.classTribV;if(o.regime==='sn')o.cprb=false;else o.anexo='std';o.classTrib=classTribDe(o);DB.empresa=Object.assign(DB.empresa||{},o);
  if(!DB.estabs.length)DB.estabs.push({id:uid('e'),nome:'Matriz',tipoEstab:'matriz',tpInsc:'1',nrInsc:o.cnpj,cnae:o.cnae||'',rat:o.rat,fap:o.fap,iniValid:o.iniValid});
  saveDB();DIRTY=false;toast('Empresa salva.','ok');return true;}
ACT.empSave=()=>{if(empSalvar())refresh();};
ACT.empSend=async()=>{if(!empSalvar())return;const alt=DB.eventos.some(e=>e.tipo==='S-1000'&&e.status==='processado');const ev=criarEvento('S-1000',{alt});const r=await enviarEventos([ev]);resumoEnvio(r,[ev]);refresh();};

function empSalvarForm(){const f=$('#f');

  o.consig=[0,1,2].map(i=>({desc:o['cs'+i+'d'],tipo:o['cs'+i+'t'],parcela:o['cs'+i+'v'],ini:o['cs'+i+'i'],fim:o['cs'+i+'f']})).filter(c=>num(c.parcela)>0);[0,1,2].forEach(i=>['d','t','v','i','f'].forEach(k=>delete o['cs'+i+k]));
  if((num(o.insal)>0||o.peric)&&(!o.laudoNum||!o.laudoData)){toast('Insalubridade/periculosidade exige nº e data do laudo (aba Regras de trabalho).','err');return null;}
  if(o.estabTipo&&!o.estabFim){toast('Informe até quando vai a estabilidade provisória.','err');return null;}
  o.cpf=onlyD(o.cpf);o.sindCnpj=onlyC(o.sindCnpj);if(o.sindCnpj&&!cnpjValido(o.sindCnpj)){toast('CNPJ do sindicato inválido (verifique os dígitos verificadores).','err');return null;}const p=NAV.cur.params;
  if(DB.empregados.some(x=>x.cpf===o.cpf&&x.id!==p.id)){toast('Já existe empregado com este CPF.','err');return null;}
  if(DB.empregados.some(x=>x.mat===o.mat&&x.id!==p.id)){toast('Matrícula já utilizada.','err');return null;}
  o.deps=lerDeps();for(const d of o.deps){if(d.cpf&&!cpfValido(d.cpf)){toast('CPF inválido do dependente '+d.nome,'err');return null;}}
  let rec,alt=false;if(p.id){rec=byId(DB.empregados,p.id);const K=['nome','sexo','racaCor','estCiv','grauInstr','cep','tpLograd','logr','nr','compl','bairro','codMunic','uf','fone','email','deps'];const antes=JSON.stringify(K.map(k=>rec[k]||''));Object.assign(rec,o);alt=antes!==JSON.stringify(K.map(k=>rec[k]||''))&&DB.eventos.some(x=>x.tipo==='S-2200'&&x.empId===rec.id&&x.status==='processado');}else{rec=Object.assign({id:uid('emp')},o);DB.empregados.push(rec);NAV.cur.params.id=rec.id;}
  saveDB();DIRTY=false;toast('Empregado salvo.','ok');if(alt){try{criarEvento('S-2205',{id:rec.id});toast('Dados cadastrais alterados: evento S-2205 gerado na biblioteca, pronto para envio.','ok');}catch(e){toast('Não foi possível gerar o S-2205: '+e.message,'err');}}return rec;}

/* S-2230: existe afastamento anterior, de mesmo motivo, encerrado (ou em curso) até 60 dias antes do início? */
function movAfastAnterior60(empId,motivo,data){const t=x=>Date.parse(x+'T00:00:00Z');return (DB.movs||[]).some(m=>m.tipo==='S-2230'&&!m.fim&&m.empId===empId&&String(m.motivo)===String(motivo)&&m.data<data&&(()=>{const fimA=m.ate&&m.ate!=='9999-12'?new Date(Date.UTC(+m.ate.slice(0,4),+m.ate.slice(5,7),0)).toISOString().slice(0,10):m.data;return (t(data)-t(fimA))/864e5<=60;})());}

const GRUPO={'S-1000':1,'S-1005':1,'S-1010':1,'S-1020':1,'S-2200':2,'S-2206':2,'S-2230':2,'S-2299':2,'S-1200':3,'S-1210':3,'S-1299':3};
const hist=(ev,m)=>{(ev.historico=ev.historico||[]).push({t:agoraISO(),m});};
function refazerXml(ev){const g=GEN[ev.tipo](ev.gen.args,ev.opts||undefined);const old=ev.id;ev.id=g.id;ev.xml=fmtXml(g.xml);ev.titulo=g.titulo;DB.movs.forEach(m=>{if(m.evId===old)m.evId=ev.id;});}
async function enviarEventos(evs,log){const res={ok:0,rej:0,err:0};log=log||(()=>{});
  const prontos=[];
  for(const ev of evs){if(ev.status==='processado')continue;
    if(ev.status==='gerado'||ev.status==='rejeitado'){try{refazerXml(ev);}catch(e){}}
    const oc=validarEvento(ev);
    if(oc.length){ev.status='rejeitado';ev.ocorr=oc;hist(ev,'Rejeitado na validação local ('+oc.length+' ocorrência(s))');res.rej++;log(`✖ ${ev.tipo} ${ev.titulo}: ${oc[0]}`);saveDB();continue;}
    ev.ocorr=[];prontos.push(ev);}
  if(DB.cfg.modo==='gw'){
    for(let i=0;i<prontos.length;i+=50){const lote=prontos.slice(i,i+50);const grupos=[...new Set(lote.map(e=>GRUPO[e.tipo]))];
      for(const g of grupos){const L=lote.filter(e=>GRUPO[e.tipo]===g);
        try{const r=await fetch(DB.cfg.gateway.replace(/\/$/,'')+'/lotes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ambiente:DB.cfg.ambiente,grupo:g,empregador:{tpInsc:1,nrInsc:onlyD(DB.empresa.cnpj)},eventos:L.map(e=>({id:e.id,tipo:e.tipo,xml:e.xml}))})});
          if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();L.forEach(e=>{e.status='enviado';e.protocolo=j.protocolo;e.enviadoEm=agoraISO();hist(e,'Lote enviado — protocolo '+j.protocolo);});saveDB();
          let ok=false;for(let t=0;t<5&&!ok;t++){await sleep(1500);const q=await fetch(DB.cfg.gateway.replace(/\/$/,'')+'/lotes/'+encodeURIComponent(j.protocolo));const qj=await q.json();if(qj.status==='processado'){ok=true;(qj.eventos||[]).forEach(x=>{const e=L.find(y=>y.id===x.id);if(!e)return;if(x.situacao==='sucesso'){e.status='processado';e.recibo=x.recibo;e.processadoEm=agoraISO();hist(e,'Processado — recibo '+x.recibo);res.ok++;log('✔ '+e.tipo+' '+e.titulo);}else{e.status='rejeitado';e.ocorr=(x.ocorrencias||[]).map(o=>(o.codigo?o.codigo+' – ':'')+o.descricao);hist(e,'Rejeitado pelo eSocial');res.rej++;log('✖ '+e.tipo+' '+e.titulo);}});}}
          if(!ok)log('… lote '+j.protocolo+' ainda em processamento; use “Consultar” na biblioteca.');
        }catch(err){L.forEach(e=>{if(e.status!=='enviado'){e.status='gerado';hist(e,'Falha de comunicação com o gateway: '+err.message);}});res.err+=L.length;log('✖ Falha de comunicação: '+err.message+' (em páginas publicadas como artefato o navegador bloqueia chamadas externas; use o arquivo HTML local)');}
        saveDB();}}
  }else{
    for(const ev of prontos){ev.status='enviado';ev.protocolo='SIM-'+ts14()+String(Math.floor(Math.random()*9000)+1000);ev.enviadoEm=agoraISO();hist(ev,'Enviado (SIMULAÇÃO) — protocolo '+ev.protocolo);saveDB();await sleep(60);
      ev.status='processado';ev.recibo='SIM-1.2.'+ts14()+String(Math.floor(Math.random()*90000)+10000);ev.processadoEm=agoraISO();hist(ev,'Processado (SIMULAÇÃO) — recibo '+ev.recibo);res.ok++;log('✔ '+ev.tipo+' '+ev.titulo);saveDB();}
  }
  return res;}
function plano(comp){const c=DB.comps[comp],ids=c?Object.keys(c.res||{}):[],P=[];
  const add=(tipo,args,label,match)=>P.push({tipo,args,label,ev:ultEv(tipo,e=>!e.retif&&match(e))});
  add('S-1000',{},'Informações do empregador',()=>true);
  DB.estabs.forEach(s=>add('S-1005',{id:s.id},'Estabelecimento '+s.nome,e=>e.gen.args.id===s.id));
  DB.lotacoes.forEach(l=>add('S-1020',{id:l.id},'Lotação '+l.cod+' '+l.desc,e=>e.gen.args.id===l.id));
  DB.rubricas.filter(r=>r.tp!==3&&(!r.opt||rubricaUsada(r.sys))).forEach(r=>add('S-1010',{id:r.sys},'Rubrica '+r.cod+' '+r.desc,e=>e.gen.args.id===r.sys));
  DB.empregados.forEach(e=>add('S-2200',{id:e.id},'Admissão '+e.nome,x=>x.gen.args.id===e.id));
  ids.filter(id=>!rescNoMes(id,comp)).forEach(id=>add('S-1200',{id,comp},'Remuneração '+byId(DB.empregados,id).nome,x=>x.gen.args.id===id&&x.comp===comp));
  ids.forEach(id=>add('S-1210',{id,comp},'Pagamento '+byId(DB.empregados,id).nome,x=>x.gen.args.id===id&&x.comp===comp));
  ids.filter(id=>rescNoMes(id,comp)).forEach(id=>{const mv=DB.movs.find(m=>m.tipo==='S-2299'&&m.empId===id);if(mv)add('S-2299',{id,mov:mv},'Desligamento '+byId(DB.empregados,id).nome,x=>x.gen.args.id===id);});
  if(ids.length)add('S-1299',{comp},'Fechamento da competência',x=>x.comp===comp);
  return P;}

  ${ORDEM.filter(t=>grp[t]).map(t=>{const g=grp[t];const ok=g.filter(x=>x.ev&&x.ev.status==='processado').length,rj=g.filter(x=>x.ev&&x.ev.status==='rejeitado').length;return `<tr><td><b>${t}</b></td><td>${TIPOS[t]}</td><td class="c">${g.length}</td><td class="c">${ok?badge(ok,'ok'):'0'}</td><td class="c">${g.length-ok-rj}</td><td class="c">${rj?badge(rj,'err'):'0'}</td><td class="r"><button class="btn sm send" data-act="envioTipo" data-t="${t}" ${ok===g.length?'disabled':''}>Enviar ${t}</button></td></tr>`;}).join('')}
  </tbody></table></div></div>
  <div class="card"><h2>Andamento</h2><pre class="xml" id="log" style="max-height:220px;min-height:60px">Aguardando envio…</pre></div>`;},
  mount(){bindComp();},

let ENVIANDO=false;
async function executarPlano(comp,tipos){if(ENVIANDO)return;if(!DB.empresa){toast('Cadastre a empresa.','err');return;}ENVIANDO=true;const lg=$('#log');lg.textContent='';const L=m=>{lg.textContent+=m+'\n';lg.scrollTop=lg.scrollHeight;};const tot={ok:0,rej:0,err:0};
  try{const c=DB.comps[comp]||{status:'aberta'};
    for(const t of ORDEM){if(tipos&&!tipos.includes(t))continue;const itens=plano(comp).filter(x=>x.tipo===t);if(!itens.length)continue;
      if(['S-1200','S-1210'].includes(t)&&c.status==='aberta'){L('— '+t+' ignorado: folha não calculada.');continue;}
      if(t==='S-1299'&&c.status!=='fechada'){L('— S-1299 ignorado: feche a competência antes.');continue;}
      const evs=[];for(const it of itens){const u=it.ev;if(u&&u.status==='processado')continue;if(u&&(u.status==='gerado'||u.status==='enviado')){if(u.status==='gerado')evs.push(u);continue;}evs.push(criarEvento(t,it.args));}
      if(!evs.length)continue;L(`▸ ${t} — ${TIPOS[t]} (${evs.length})`);const r=await enviarEventos(evs,L);tot.ok+=r.ok;tot.rej+=r.rej;tot.err+=r.err;
      if(r.rej||r.err){L('■ Interrompido: corrija as ocorrências deste grupo antes de seguir (há dependências entre eventos).');break;}}
    L(`\nConcluído — ${tot.ok} processado(s), ${tot.rej} rejeitado(s), ${tot.err} falha(s).`);
  }finally{ENVIANDO=false;}
  toast(tot.rej||tot.err?'Envio com ocorrências — veja o andamento.':'Envio concluído.',tot.rej||tot.err?'err':'ok');renderSide();}

/* ===================== Estrutura (estabelecimentos x lotações x regime) ===================== */
function checarEstrutura(){const E=DB.empresa,o=[];const add=(n,t)=>o.push({n,t});
  if(!E){add('err','Empresa não cadastrada.');return o;}
  if(!E.regime)add('err','Regime tributário não informado na empresa.');else add('ok','Regime: '+regimeTxt(E)+' (classTrib '+classTribDe(E)+').');
  const ms=DB.estabs.filter(x=>x.tipoEstab==='matriz');
  if(ms.length===1)add('ok','Uma matriz cadastrada.');else add('err',ms.length?'Há mais de uma matriz.':'Nenhuma matriz cadastrada.');
  DB.estabs.forEach(s=>{if(s.tpInsc==='1'&&onlyC(s.nrInsc).slice(0,8)!==onlyC(E.cnpj).slice(0,8))add('err','Estabelecimento '+s.nome+': raiz do CNPJ diferente da do empregador.');
    if(ratIncide(E)&&![1,2,3].includes(Number(s.rat)))add('err','Estabelecimento '+s.nome+': grau de risco (RAT) deve ser 1, 2 ou 3.');
    if(!DB.empregados.some(e=>e.estab===s.id))add('warn','Estabelecimento '+s.nome+' sem empregados vinculados.');});
  DB.rubricas.filter(r=>r.custom&&/consign/i.test(r.desc||'')&&r.nat!=='9253').forEach(r=>add('warn','Rubrica '+r.cod+' ('+r.desc+'): desconto de consignado do programa Crédito do Trabalhador (eConsignado) deve usar a natureza 9253, para entrar no S-5003 e na guia do FGTS Digital (MOS S-1.3, S-1200, informações adicionais) **.'));
  DB.lotacoes.forEach(l=>{if(E.regime==='sn'&&String(l.codTercs)!=='0000')add('err','Lotação '+l.cod+': Simples Nacional exige terceiros 0000.');
    if(E.regime&&E.regime!=='sn'&&String(l.codTercs)==='0000')add('warn','Lotação '+l.cod+': terceiros 0000 em empresa de Presumido/Real — confira o FPAS.');
    if(compAtual()>='2026-05'&&['507','833'].includes(String(l.fpas))&&['0067','0071','0075'].includes(String(l.codTercs)))add('warn','Lotação '+l.cod+': a partir da competência 05/2026, quem recolhia terceiros por convênio deve criar nova vigência da S-1020 (início 2026-05) com FPAS 507 ou 833 e código de terceiros 0079 (MOS eSocial S-1.3, S-1020, informações adicionais, item 1.4.1) **.');
    if(['507','833'].includes(String(l.fpas))&&DB.empregados.filter(e=>e.situacao!=='desligado').length>500)add('warn','Lotação '+l.cod+': com mais de 500 segurados empregados, o eSocial apura automaticamente, desde 05/2026, a contribuição adicional ao SENAI (MOS S-1.3, S-5011, item 1.6); o cálculo de terceiros deste sistema não a inclui **.');
    if(E.regime==='sn'&&E.anexo==='misto'&&!l.atvSimples)add('err','Lotação '+l.cod+': indique se a atividade é de CPP substituída ou não (Simples misto).');
    if(!DB.empregados.some(e=>e.lotacao===l.id))add('warn','Lotação '+l.cod+' sem empregados vinculados.');});
  if(!DB.lotacoes.length)add('err','Nenhuma lotação cadastrada: o S-1200 exige lotação.');
  const sem=DB.empregados.filter(e=>!byId(DB.estabs,e.estab)||!byId(DB.lotacoes,e.lotacao));
  if(sem.length)add('err',sem.length+' empregado(s) sem estabelecimento ou lotação válidos: '+sem.map(e=>e.nome).join(', ')+'.');
  if(E.regime==='sn'&&E.cprb)add('err','CPRB é incompatível com o Simples Nacional.');
  if(E.regime&&E.regime!=='sn'&&E.cprb&&DB.lotacoes.every(l=>l.cprb==='nao'))add('warn','CPRB marcada na empresa, mas nenhuma lotação é desonerada.');
  if(!o.some(x=>x.n==='err'))add('ok','Nenhuma inconsistência impeditiva encontrada.');
  return o;}

  return `<h1>Mapa da estrutura e regras de tributação</h1><p class="sub">Como o regime da empresa, cada estabelecimento e cada lotação se combinam no cálculo e no eSocial.</p>${exigeEmpresa()}

  <div class="card"><div class="row sp"><h2>Lotações tributárias</h2><button class="btn sm" data-act="nav" data-to="lotacoes">Cadastrar / editar</button></div><div class="tw"><table class="t"><thead><tr><th>Lotação</th><th>FPAS / terceiros</th><th>Regra aplicada nesta lotação</th><th class="c">Empregados</th><th>S-1020</th></tr></thead><tbody>
  ${DB.lotacoes.map(l=>{const R=regraLot(E,l,comp,DB.params);return `<tr><td><b>${esc(l.cod)}</b> ${esc(l.desc)}</td><td>${esc(l.fpas)} / ${esc(l.codTercs)}</td><td style="font-size:12.5px">${esc(R.nota)}</td><td class="c">${DB.empregados.filter(e=>e.lotacao===l.id).length}</td><td>${stBadge(ultEv('S-1020',x=>x.gen.args.id===l.id))}</td></tr>`;}).join('')||'<tr><td colspan="5" class="c" style="color:var(--mut)">Nenhuma lotação.</td></tr>'}</tbody></table></div></div>`;},

/* ===================== Gráficos (SVG/HTML, sem dependências) ===================== */
const SER=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6','#e34948'];
const brlK=n=>{const a=Math.abs(n);return (n<0?'-':'')+(a>=1e6?(a/1e6).toFixed(a>=1e7?0:1).replace('.',',')+' mi':a>=1e3?(a/1e3).toFixed(a>=1e4?0:1).replace('.',',')+' mil':String(Math.round(a)));};
const niceMax=v=>{if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=4?4:f<=8?8:10)*e;};
const legendHtml=(names,cols)=>`<div class="legend">${names.map((n,i)=>`<span><i class="sw" style="background:${(cols||SER)[i]}"></i>${esc(n)}</span>`).join('')}</div>`;
function vbars(cats,series,o){o=o||{};const W=640,H=o.h||250,m={l:50,r:8,t:12,b:30},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const tot=cats.map((_,i)=>series.reduce((a,s)=>a+(s.v[i]||0),0)),mx=niceMax(Math.max(...tot,1)),step=iw/Math.max(cats.length,1),bw=Math.min(54,step*0.6);
  let g='';for(let k=0;k<=4;k++){const y=m.t+ih-ih*k/4;g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="#e3e8ee" stroke-width="1"/><text x="${m.l-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#5d6b79">${brlK(mx*k/4)}</text>`;}
  let b='';cats.forEach((c,i)=>{let acc=0;const x=m.l+step*i+(step-bw)/2;series.forEach((s,j)=>{const v=s.v[i]||0;if(v<=0)return;const h=ih*v/mx,y=m.t+ih-ih*acc/mx-h;acc+=v;
    b+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,0)}" rx="${j===series.length-1?3:0}" fill="${(o.cols||SER)[j]}" stroke="#fff" stroke-width="2" data-tip="${esc(c+' — '+s.n+': R$ '+brl(v))}"/>`;});
    b+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="#5d6b79">${esc(c)}</text>`;if(o.totals)b+=`<text x="${x+bw/2}" y="${m.t+ih-ih*acc/mx-5}" text-anchor="middle" font-size="11" font-weight="600" fill="#17212b">${brlK(acc)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label||'gráfico de barras')}">${g}${b}</svg>`;}
function hbars(items,o){o=o||{};const mx=Math.max(...items.map(x=>Math.abs(x.v)),1);
  return `<div class="hb">${items.map((x,i)=>`<div class="hrow" data-tip="${esc(x.l+': '+(o.fmt?o.fmt(x.v):'R$ '+brl(x.v)))}"><span class="hl">${esc(x.l)}</span><span class="ht"><i style="width:${Math.max(1,Math.abs(x.v)/mx*100)}%;background:${x.c||SER[0]}"></i></span><b>${o.fmt?o.fmt(x.v):brl(x.v)}</b></div>`).join('')}</div>`;}
function linhas(xs,series,o){o=o||{};const W=640,H=o.h||260,m={l:46,r:12,t:12,b:34},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const vals=series.flatMap(s=>s.v.filter(v=>v!=null)),mx=niceMax(Math.max(...vals,1));const X=i=>m.l+iw*i/Math.max(xs.length-1,1),Y=v=>m.t+ih-ih*v/mx;
  let g='';for(let k=0;k<=4;k++){const y=m.t+ih-ih*k/4;g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="#e3e8ee"/><text x="${m.l-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#5d6b79">${(v=>Number.isInteger(v)?v:v.toFixed(1).replace('.',','))(mx*k/4)}%</text>`;}
  xs.forEach((x,i)=>{g+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#5d6b79">${esc(x)}</text>`;});

/* ===================== SEGURANÇA, PRIVACIDADE (LGPD), COOKIES, ACESSIBILIDADE ===================== */
/* Cofre local: PBKDF2-SHA-256 (600.000 iterações) + AES-GCM-256. A senha nunca é gravada; sem ela os dados não são recuperáveis. */
const VK='folhaPro.vault.v1',FAILK='folhaPro.fail.v1',CONSENT_KEY='folhaPro.consent.v1',CONSENT_VER='2026-11-14';
const VAULT={on:false,key:null,salt:null,it:600000,pend:null,busy:false,idleT:null,flushing:null};
let CONSENT=null;
const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=u=>[...new Uint8Array(u)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function sha256(t){return hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)));}
async function deriveKey(pw,salt,it){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function vEnc(str){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},VAULT.key,new TextEncoder().encode(str));
  return JSON.stringify({v:1,it:VAULT.it,salt:b64(VAULT.salt),iv:b64(iv),ct:b64(ct)});}
async function vTry(raw,pw){const o=JSON.parse(raw);const k=await deriveKey(pw,unb64(o.salt),o.it);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},k,unb64(o.ct));return{key:k,salt:unb64(o.salt),it:o.it,text:new TextDecoder().decode(pt)};}
async function bkCifrar(txt,pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),it=600000;const k=await deriveKey(pw,salt,it);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(txt));return{kdf:'PBKDF2-SHA-256',it,salt:b64(salt),iv:b64(iv),ct:b64(ct)};}
async function bkDecifrar(o,pw){const k=await deriveKey(pw,unb64(o.salt),o.it);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},k,unb64(o.ct)));}
/* persistência assíncrona com fila (último estado vence) */
function vaultPersist(s){VAULT.pend=s;if(VAULT.busy)return;VAULT.busy=true;VAULT.flushing=(async()=>{try{while(VAULT.pend!=null){const x=VAULT.pend;VAULT.pend=null;const out=await vEnc(x);try{localStorage.setItem(VK,out);}catch(e){toast('Não foi possível gravar os dados (armazenamento cheio ou bloqueado). Exporte um backup agora.','err');}}}finally{VAULT.busy=false;}})();}
const vaultFlush=async()=>{while(VAULT.busy||VAULT.pend!=null){await VAULT.flushing;}};
/* tentativas */
function failGet(){try{return JSON.parse(localStorage.getItem(FAILK)||'{"n":0,"until":0}');}catch(e){return{n:0,until:0};}}
function failSet(o){try{localStorage.setItem(FAILK,JSON.stringify(o));}catch(e){}}
function senhaForca(p){let c=0;if(/[a-z]/.test(p))c++;if(/[A-Z]/.test(p))c++;if(/\d/.test(p))c++;if(/[^A-Za-z0-9]/.test(p))c++;return{ok:p.length>=12&&c>=3,len:p.length,c};}
/* ---------- trilha de auditoria (LGPD, art. 37) ---------- */
function audit(a,d){if(!DB)return;(DB.audit=DB.audit||[]).push({ts:new Date().toISOString(),a:String(a).slice(0,60),d:d==null?'':String(d).slice(0,200)});if(DB.audit.length>3000)DB.audit.splice(0,DB.audit.length-3000);VAULT.audit=DB.audit;}
function wrapAudit(){const re=/(Save|Del|Send|Env|Export|Import|Reset|Demo|Fechar|Reabr|Excl|Cancel|Gerar|Calc|bkFile|bkLoad|titular|ckAll|ckNec|pwd)/;Object.keys(ACT).forEach(k=>{if(!re.test(k)||ACT[k].__au)return;const f=ACT[k];ACT[k]=function(el,ev){try{audit('ação:'+k,(el&&el.dataset&&el.dataset.arg)||NAV.cur.name);}catch(e){}return f.apply(this,arguments);};ACT[k].__au=1;});}

/* ---------- consentimento / cookies ---------- */
function consentLoad(){try{const r=JSON.parse(localStorage.getItem(CONSENT_KEY)||'null');if(r&&r.ver===CONSENT_VER)CONSENT=r;}catch(e){}}

  if(pref)brandSave();else{try{localStorage.removeItem(BRAND_KEY);}catch(e){}}applyBrand();bannerHide();if(DB)audit('consentimento',pref?'necessários + preferências':'somente necessários');}

  d.innerHTML=`<h2 id="ckt">Privacidade e cookies</h2><p id="ckd">Este sistema usa o armazenamento local do navegador <b>estritamente necessário</b> para funcionar (seus dados, criptografados com a sua senha, e o controle de acesso). Se você permitir, também guardamos <b>preferências de aparência</b> (cores e logotipo) e carregamos a <b>fonte da marca</b> do Google Fonts, serviço de terceiro que recebe o seu endereço IP. Não usamos cookies de publicidade nem de análise de comportamento. <a href="#" data-act="ckPolicy" data-arg="cookies">Política de cookies</a> · <a href="#" data-act="ckPolicy" data-arg="privacidade">Política de privacidade</a></p>
  <div class="row"><button class="btn" data-act="ckNec">Somente necessários</button><button class="btn" data-act="ckCustom">Personalizar</button><button class="btn pri" data-act="ckAll">Aceitar todos</button></div>`;document.body.appendChild(d);}

function cookiesHTML(){return `<div class="legal"><p><b>Versão ${CONSENT_VER}.</b> O sistema <b>não grava cookies HTTP</b>. Para funcionar, usa o <i>armazenamento local</i> do navegador (localStorage), que tratamos, por transparência (LGPD, art. 9º), como equivalente a cookies.</p>
<div class="tw"><table class="t"><thead><tr><th scope="col">Item</th><th scope="col">Categoria</th><th scope="col">Finalidade</th><th scope="col">Duração</th></tr></thead><tbody>
<tr><td class="mono">folhaPro.vault.v1</td><td>Estritamente necessário</td><td>Guarda os dados cadastrais e da folha, criptografados (AES-GCM-256) com chave derivada da sua senha.</td><td>Até a eliminação pelo usuário</td></tr>
<tr><td class="mono">folhaPro.fail.v1</td><td>Estritamente necessário (segurança)</td><td>Conta tentativas de acesso malsucedidas para retardar ataques de adivinhação de senha.</td><td>Até o acesso bem-sucedido</td></tr>
<tr><td class="mono">folhaPro.consent.v1</td><td>Estritamente necessário (conformidade)</td><td>Registra a sua escolha sobre cookies, com data e versão desta política.</td><td>Até a revogação ou nova versão da política</td></tr>
<tr><td class="mono">folhaPro.brand.v1</td><td>Preferência (requer consentimento)</td><td>Memoriza nome, cores e logotipo configurados.</td><td>Até a revogação</td></tr>
<tr><td class="mono">fp_tema</td><td>Preferência (requer consentimento)</td><td>Memoriza o tema de cores escolhido (claro, escuro ou automático).</td><td>Até a revogação</td></tr>
<tr><td class="mono">fonts.googleapis.com / fonts.gstatic.com</td><td>Terceiro (requer consentimento)</td><td>Entrega a fonte da marca. O Google recebe o endereço IP e dados técnicos do navegador, conforme a política do próprio Google.</td><td>Sessão de navegação</td></tr></tbody></table></div>
<p>Não utilizamos cookies de publicidade, de perfilamento ou de análise de comportamento. A hospedagem do sistema (provedor de infraestrutura) pode registrar o endereço IP e a data de acesso em logs técnicos de servidor, para segurança e disponibilidade.</p>
<p><b>Como gerir.</b> A qualquer momento você pode alterar a escolha em <i>Sistema → Privacidade e cookies</i> ou pelo botão abaixo. Rejeitar os itens opcionais não reduz as funções do sistema; apenas a fonte da marca é substituída pela fonte padrão do dispositivo e as preferências de aparência valem somente até fechar a página. Também é possível limpar o armazenamento local nas configurações do navegador (isso apaga os dados do sistema; faça backup antes).</p>
<h3>9. Atualizações do sistema</h3><p>O botão “Atualizar” consulta o servidor do fornecedor para saber se há nova versão ou novos parâmetros legais. A consulta envia apenas o número da última atualização aplicada (sem cookies, sem identificação do usuário e sem dados de empregados, empresas ou folhas); como em qualquer conexão de rede, o servidor recebe o endereço IP e o navegador do dispositivo, tratados para segurança e para a entrega do serviço. Os pacotes são assinados digitalmente e só são aplicados se a assinatura conferir.</p></div>`;}
function privacidadeHTML(){const E=DB&&DB.empresa;return `<div class="legal"><p><b>Versão ${CONSENT_VER}.</b> Esta política descreve o tratamento de dados pessoais no sistema, nos termos da Lei nº 13.709/2018 (LGPD). Os trechos entre colchetes devem ser preenchidos pela empresa licenciada antes da entrada em produção.</p>
<h3>1. Quem é quem</h3><p><b>Controlador:</b> ${E?esc(E.razao)+' (CNPJ '+esc(fmtCNPJ(E.cnpj))+')':'a empresa que utiliza o sistema (identificada no cadastro da empresa)'}, que decide sobre os dados de seus empregados e dependentes. <b>Fornecedor do software:</b> ${FORN()}. <b>Encarregado (art. 41):</b> ${DPO()}.</p>
<h3>2. Dados tratados e finalidades</h3><p>Dados cadastrais de empregados (nome, CPF, nascimento, filiação, endereço, dados contratuais e salariais), de dependentes (inclusive menores, hipótese em que se observa o melhor interesse da criança e do adolescente, art. 14) e do responsável pelo envio ao eSocial. Finalidades: cálculo da folha, recolhimentos e declaração ao eSocial. Movimentações de afastamento por motivo de saúde podem revelar <b>dado pessoal sensível</b> (art. 5º, II), tratado apenas para cumprimento de obrigação legal (art. 11, II, “a”) e com o mínimo necessário.</p>
<h3>3. Bases legais</h3><p>Cumprimento de obrigação legal ou regulatória pelo controlador (art. 7º, II), execução de contrato de trabalho (art. 7º, V) e exercício regular de direitos (art. 7º, VI). Não há tratamento fundado em consentimento para os dados da folha. O consentimento (art. 8º) é usado apenas para os cookies opcionais descritos na política de cookies.</p>
<h3>4. Onde ficam os dados e quem os acessa</h3><p>Os dados ficam <b>apenas no navegador deste dispositivo</b>, criptografados com a senha do usuário; o fornecedor não tem acesso a eles. Ao transmitir ao eSocial por gateway próprio, os dados seguem ao gateway configurado pela empresa e ao ambiente nacional do eSocial. Não há venda nem compartilhamento para publicidade.</p>
<h3>5. Direitos do titular (art. 18)</h3><p>Confirmação, acesso, correção, anonimização, portabilidade, eliminação, informação sobre compartilhamento e revogação de consentimento. O sistema permite <b>exportar os dados de um titular</b> (tela <i>Privacidade e cookies</i>) e corrigir cadastros. A <b>eliminação</b> não se aplica aos dados que a empresa deve conservar por obrigação legal (art. 16, I); os prazos de guarda trabalhista, previdenciária, fiscal e do FGTS devem ser confirmados pelo controlador **. Requisições: ${DPO()}.</p>
<h3>6. Segurança (art. 46)</h3><p>Criptografia em repouso (AES-GCM-256, chave derivada por PBKDF2-SHA-256 com 600.000 iterações), senha com no mínimo 12 caracteres, bloqueio por inatividade, atraso progressivo após tentativas malsucedidas, política de segurança de conteúdo (CSP) restritiva e trilha de auditoria das operações (art. 37). <b>Limites:</b> o sistema não substitui controles do dispositivo (antivírus, bloqueio de tela, atualizações) e a senha esquecida não pode ser recuperada; mantenha backups.</p>
<h3>7. Incidentes (art. 48)</h3><p>Em caso de incidente com risco ou dano relevante aos titulares, o controlador deve comunicar a ANPD e os titulares em prazo razoável, conforme regulamentação da ANPD **. Registre o fato com o encarregado.</p>
<h3>8. Cookies</h3><p>Veja a política de cookies. As escolhas ficam registradas com data e versão.</p></div>`;}

 <div class="card">${privacidadeHTML()}</div>
 <div class="card"><h2>Exportar dados de um titular (art. 18, II e V)</h2><div class="row"><div class="f"><label for="ttcpf">CPF do titular</label><input id="ttcpf" data-mask="cpf" inputmode="numeric" autocomplete="off"></div><button class="btn pri" data-act="titularExport" style="align-self:flex-end">Gerar arquivo</button></div><p class="sub">Gera um arquivo JSON com o cadastro, dependentes, férias, movimentações e lançamentos do empregado.</p></div>

function pickById(o,id,d){d=d||0;if(d>6||o==null||typeof o!=='object')return undefined;if(Array.isArray(o)){const r=o.map(x=>pickById(x,id,d+1)).filter(x=>x!==undefined);return r.length?r:undefined;}
  const out={};let hit=false;for(const k of Object.keys(o)){if(k===id){out[k]=o[k];hit=true;continue;}if(o[k]&&typeof o[k]==='object'){const r=pickById(o[k],id,d+1);if(r!==undefined){out[k]=r;hit=true;}}else if(o[k]===id&&(k==='empId'||k==='id')){out[k]=o[k];hit=true;}}return hit?out:undefined;}
function dl(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
ACT.titularExport=()=>{const cpf=onlyD($('#ttcpf').value);if(!cpfValido(cpf)){toast('Informe um CPF válido.','err');return;}const e=DB.empregados.find(x=>x.cpf===cpf);if(!e){toast('Nenhum empregado com este CPF.','err');return;}
  const out={titular:e,ferias:DB.ferias.filter(x=>x.empId===e.id),movimentacoes:DB.movs.filter(x=>x.empId===e.id),rescisao:(DB.rescisoes||{})[e.id]||null,competencias:pickById(DB.comps,e.id)||{},geradoEm:new Date().toISOString()};
  dl('dados-titular-'+cpf.slice(0,3)+'.json',JSON.stringify(out,null,2));toast('Arquivo gerado.','ok');};

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folha de Pagamento e eSocial</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#17212b;--mut:#5d6b79;--line:#dbe2e9;--pri:#0f5c63;--pri2:#0a4146;--pri3:#e3f1f2;--acc:#b7791f;--ok:#1a7f4b;--okb:#e2f4ea;--warn:#9a6700;--warnb:#fff4d6;--err:#b42318;--errb:#fde8e6;--blue:#1f5fbf;--blueb:#e4edfb}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:76px}
#top{background:var(--pri2);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;position:sticky;top:0;z-index:20}
#top .logo{font-weight:700;font-size:17px;letter-spacing:.2px}#top .logo span{color:var(--acc2,#e8c37a)}#top .logo img{height:28px;vertical-align:middle;margin-right:8px;border-radius:4px}
#top .emp{margin-left:auto;font-size:12.5px;opacity:.9;text-align:right}
#top button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;font-size:13px}
#top button:hover{background:rgba(255,255,255,.22)}
#app{display:flex;align-items:flex-start;gap:0;max-width:1500px;margin:0 auto}
#side{width:230px;flex:none;padding:14px 10px;position:sticky;top:52px;max-height:calc(100vh - 130px);overflow:auto}
#side h6{margin:14px 8px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut)}
#side a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink);cursor:pointer;font-size:13.5px}
#side a:hover{background:#e5eaef}#side a.on{background:var(--pri);color:#fff}
#main{flex:1;min-width:0;padding:18px 20px 30px}
h1{font-size:21px;margin:0 0 2px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.grid>.f{grid-column:span 3}
.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px;font-weight:600}
.f input,.f select,.f textarea{width:100%;padding:8px 9px;border:1px solid #c7d0d9;border-radius:6px;font:inherit;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid #9ccfd3;border-color:var(--pri)}
.f input[readonly]{background:#eef2f5}
.f small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.chk{display:flex!important;align-items:center;gap:7px;font-weight:400!important;font-size:13.5px!important;color:var(--ink)!important;padding-top:6px}.chk input{width:auto!important}
.rq{color:var(--err)}
.btn{border:1px solid #bcc7d1;background:#fff;border-radius:7px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600;color:var(--ink)}
.btn:hover{background:#eef2f5}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.btn.send{background:var(--acc);border-color:var(--acc);color:#fff}.btn.send:hover{background:#97640f}
.btn.danger{color:var(--err);border-color:#e3b1ab}.btn.sm{padding:4px 9px;font-size:12.5px;font-weight:600}
.btn[disabled]{opacity:.5;cursor:not-allowed}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:10px;align-items:center;z-index:30;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
#bar .sp{flex:1}#bar .hint{color:var(--mut);font-size:11.5px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:#eef2f5;text-align:left;padding:7px 9px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 9px;border-bottom:1px solid #edf0f3;vertical-align:middle}
table.t tr:hover td{background:#fafcfd}.r{text-align:right}.c{text-align:center}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-gray{background:#e8ecf0;color:#4a5662}.b-blue{background:var(--blueb);color:var(--blue)}.b-ok{background:var(--okb);color:var(--ok)}.b-err{background:var(--errb);color:var(--err)}.b-warn{background:var(--warnb);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}.kpi b{display:block;font-size:20px;margin-top:2px}.kpi span{font-size:12px;color:var(--mut)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.step{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:6px}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--pri3);color:var(--pri);font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-right:6px}
.step.done .n{background:var(--ok);color:#fff}.step p{margin:0;color:var(--mut);font-size:12.5px;flex:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs a{padding:8px 14px;cursor:pointer;border:1px solid transparent;border-bottom:none;border-radius:7px 7px 0 0;color:var(--mut);font-weight:600}
.tabs a.on{background:#fff;border-color:var(--line);color:var(--pri);margin-bottom:-1px}
.note{border-left:4px solid var(--acc);background:var(--warnb);padding:9px 12px;border-radius:6px;font-size:13px;margin:0 0 14px}
.note.info{border-color:var(--blue);background:var(--blueb)}.note.err{border-color:var(--err);background:var(--errb)}.note.ok{border-color:var(--ok);background:var(--okb)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
pre.xml{background:#0f1a22;color:#d7e7ee;padding:12px;border-radius:8px;overflow:auto;max-height:420px;font-size:12px;line-height:1.5;white-space:pre}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
#modal{position:fixed;inset:0;background:rgba(15,26,34,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 14px;overflow:auto}
#modal.on{display:flex}.mbox{background:#fff;border-radius:12px;max-width:760px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mbox.wide{max-width:1000px}.mbox h2{margin-bottom:12px}
#toast{position:fixed;right:16px;top:64px;z-index:60;display:flex;flex-direction:column;gap:8px}
.tst{background:#17212b;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:380px;font-size:13px}.tst.ok{background:var(--ok)}.tst.err{background:var(--err)}
.hol{background:#fff;border:1px solid #222;padding:16px 18px;font-size:12.5px;color:#000;max-width:820px;margin:0 auto 14px}
.hol h4{margin:0;font-size:15px;text-align:center}.hol .hd{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:8px}
.hol table{width:100%;border-collapse:collapse}.hol th,.hol td{border:1px solid #444;padding:3px 6px}.hol th{background:#eee;font-size:11.5px}
.hol .bx{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:8px}.hol .bx div{border:1px solid #444;padding:4px 6px}.hol .bx small{display:block;font-size:10.5px;color:#333}
.hol .ass{margin-top:26px;display:flex;justify-content:space-between;gap:30px}.hol .ass div{flex:1;border-top:1px solid #000;text-align:center;padding-top:3px;font-size:11.5px}
#printarea{display:none}
.mat td input{width:78px;padding:4px 5px;border:1px solid #c7d0d9;border-radius:5px;text-align:right}
.mat td input.w{width:130px;text-align:left}
.dep{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr auto auto auto auto;gap:8px;align-items:end;margin-bottom:8px;padding:8px;background:#f7f9fa;border-radius:8px}
.dep .f{grid-column:auto}
@media (max-width:900px){#side{display:none}.grid>.f{grid-column:span 6!important}.dep{grid-template-columns:1fr 1fr}}
@media print{body{background:#fff;padding:0}body.printing #top,body.printing #app,body.printing #bar,body.printing #modal,body.printing #toast{display:none!important}body.printing #printarea{display:block}.hol{border:1px solid #000;page-break-after:always;margin:0 auto}}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:2px 0 8px;font-size:12.5px;color:var(--mut)}.legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.hb{display:flex;flex-direction:column;gap:7px}.hrow{display:grid;grid-template-columns:minmax(110px,38%) 1fr 92px;gap:8px;align-items:center;font-size:13px}.hrow .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hrow .ht{background:#eef2f5;border-radius:4px;height:12px;display:block}.hrow .ht i{display:block;height:12px;border-radius:0 4px 4px 0}.hrow b{text-align:right;font-weight:600}
#tip{position:fixed;display:none;z-index:60;background:#17212b;color:#fff;padding:6px 9px;border-radius:6px;font-size:12px;max-width:250px;pointer-events:none}
.cmpg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}@media(max-width:900px){.cmpg{grid-template-columns:1fr}}
.cmpc{margin:0}.cmpc.best{border:2px solid var(--ok)}.cmpc.off{opacity:.8}.cmpc .big{font-size:24px;font-weight:700;margin:6px 0 2px}
details.tv{margin-top:8px}details.tv summary{cursor:pointer;color:var(--pri);font-size:13px}
</style>
</head>
<body>
<header id="top">
  <div class="logo" id="logo"></div>
  <button data-act="home" title="Alt+I">⌂ Tela inicial</button>
  <button data-act="back" title="Alt+V">◀ Voltar</button>
  <div class="emp" id="topemp"></div>
</header>
<div id="app"><nav id="side"></nav><main id="main"></main></div>
<footer id="bar"></footer>
<div id="modal"></div><div id="tip"></div><div id="toast"></div><div id="printarea"></div>
<script>
'use strict';
/* =====================================================================
   FOLHA PRO — núcleo (sem DOM): utilitários, parâmetros legais, motor de
   cálculo, banco local e geradores de eventos do eSocial (leiaute S-1.3)
   ===================================================================== */
const r2=v=>Math.round((Number(v)+Number.EPSILON)*100)/100;
const onlyD=s=>String(s==null?'':s).replace(/\D/g,'');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>{ if(typeof v==='number') return v; let s=String(v==null?'':v).trim(); if(!s) return 0; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isNaN(n)?0:n; };
const fx=v=>r2(v).toFixed(2);
const brIn=v=>(v===''||v==null||isNaN(v))?'':Number(v).toFixed(2).replace('.',',');
function cpfValido(c){c=onlyD(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=c[i]*(t+1-i);if((s*10)%11%10!=c[t])return false;}return true;}
function cnpjValido(c){c=onlyD(c);if(c.length!==14||/^(\d)\1+$/.test(c))return false;const f=n=>{let p=n-7,s=0;for(let i=0;i<n;i++){s+=c[i]*p--;if(p<2)p=9;}const r=s%11;return r<2?0:11-r;};return f(12)==c[12]&&f(13)==c[13];}
const fmtCPF=c=>{c=onlyD(c);return c.length===11?c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):c;};
const fmtCNPJ=c=>{c=onlyD(c);return c.length===14?c.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):c;};
const fmtCEP=c=>{c=onlyD(c);return c.length===8?c.replace(/(\d{5})(\d{3})/,'$1-$2'):c;};
const fmtData=d=>d?String(d).split('-').reverse().join('/'):'';
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const compLabel=c=>{const [a,m]=String(c).split('-');return MESES[+m-1]+'/'+a;};
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const compAtual=()=>hoje().slice(0,7);
const diasMes=c=>{const [a,m]=c.split('-').map(Number);return new Date(a,m,0).getDate();};
const idadeEm=(nasc,ref)=>{if(!nasc)return 0;const n=new Date(nasc),r=new Date(ref);let i=r.getFullYear()-n.getFullYear();if(r.getMonth()<n.getMonth()||(r.getMonth()==n.getMonth()&&r.getDate()<n.getDate()))i--;return i;};
const agoraISO=()=>new Date().toISOString();
const dtHora=iso=>{if(!iso)return '';const d=new Date(iso);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});};

/* ---------------- Parâmetros legais 2026 (editáveis na tela própria) ---------------- */
function defaultParams(){return{
  salMin:1621.00, tetoInss:8475.55,
  inss:[[1621.00,7.5],[2902.84,9],[4354.27,12],[8475.55,14]],
  irrf:[[2428.80,0,0],[2826.65,7.5,182.16],[3751.05,15,394.16],[4664.68,22.5,675.49],[999999999,27.5,908.73]],
  depIr:189.59, simpl:607.20,
  redutor:{isento:5000.00,teto:7350.00,a:978.62,b:0.133145},
  salFam:{cota:67.54,limite:1980.38,idade:14},
  fgts:8, fgtsAprendiz:2, vtPerc:6,
  patronal:20, rat:2, fap:1, terceiros:5.8, adNoturno:20, peric:30, he50:50, he100:100, divisor:220, cprbFrac:{2025:25,2026:50,2027:75}, venc:{inss:20,fgts:20}
};}


/* ---------------- Identidade visual (white-label) ---------------- */
// Padrão: cliente Mallora Tecnologia. Única cor confirmada no site: #0B0B0B (meta theme-color); demais valores provisórios [CONFIRMAR COM O MANUAL DE MARCA].
const BRAND_KEY='folhaPro.brand.v1';
const BRAND_DEF={nome:'Mallora',produto:'Folha',titulo:'Folha de Pagamento e eSocial',slogan:'Onde soluções se conectam.',pri:'#0B0B0B',pri2:'#0B0B0B',acc:'#F2B544',fonte:'Inter',logo:''};
let BRAND=Object.assign({},BRAND_DEF);
function brandLoad(){try{const r=localStorage.getItem(BRAND_KEY);if(r)BRAND=Object.assign({},BRAND_DEF,JSON.parse(r));}catch(e){}}
function brandSave(){try{localStorage.setItem(BRAND_KEY,JSON.stringify(BRAND));}catch(e){}}
function mixHex(a,b,t){const p=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return[0,2,4].map(i=>parseInt(h.substr(i,2),16));};const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v*(1-t)+B[i]*t).toString(16).padStart(2,'0')).join('');}
function applyBrand(b){b=b||BRAND;const s=document.documentElement.style;
  s.setProperty('--pri',b.pri);s.setProperty('--pri2',b.pri2);s.setProperty('--pri3',mixHex(b.pri,'#ffffff',.9));s.setProperty('--acc2',b.acc);s.setProperty('--acc',mixHex(b.acc,'#000000',.3));
  const fam=b.fonte?`"${b.fonte}",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  document.body.style.fontFamily=fam;
  let l=document.getElementById('brandfont');if(!l){l=document.createElement('link');l.id='brandfont';l.rel='stylesheet';document.head.appendChild(l);}
  l.href=b.fonte?'https://fonts.googleapis.com/css2?family='+encodeURIComponent(b.fonte).replace(/%20/g,'+')+':wght@400;600;700&display=swap':'';
  document.title=b.nome+' — '+b.titulo;
  const lg=document.getElementById('logo');if(lg)lg.innerHTML=(b.logo?`<img alt="" src="${b.logo}">`:'')+esc(b.nome)+' <span>'+esc(b.produto)+'</span>';
}

/* ---------------- Rubricas padrão ---------------- */
// natureza (Tabela 3) preenchida apenas onde confirmada em fonte oficial: 1000, 1409, 9200, 9201, 9203.
/* Natureza das rubricas — Tabela 3 do eSocial (códigos conferidos em reprodução da tabela; confirmar no Anexo I do leiaute vigente) */
const NATMAP={SAL:'1000',INSAL:'1202',PERIC:'1203',ADNOT:'1205',HE50:'1003',HE100:'1003',DSRHE:'1002',COMIS:'1207',GRAT:'1211',OUTP:'1099',SALFAM:'1409',
 FALTAS:'9209',ATRASOS:'9209',INSS:'9201',IRRF:'9203',VT:'9216',ADIANT:'9200',PENSAO:'9213',OUTD:'9299',FERIAS:'1020',FERTERCO:'1020',ABONO:'1023',ABONOTERCO:'1023',
 D13:'5001',D13P1:'9214',D13INSS:'9201',D13IRRF:'9203',AVISO:'6003',FERVENC:'6007',FERPROP:'6006',FERPTERCO:'6006',D13PROP:'6002',AVISOD:'6901'};
function defaultRubricas(){
  const R=(sys,cod,desc,tp,nat,cp,ir,fg,reduz)=>({sys,cod,desc,tp,nat,incCP:cp,incIRRF:ir,incFGTS:fg,reduz:!!reduz,conf:['1000','1409','9200','9201','9203'].includes(nat)?false:false});
  return [
    R('SAL','001','SALÁRIO',1,'1000','11','11','11'),
    R('INSAL','002','ADICIONAL DE INSALUBRIDADE',1,'','11','11','11'),
    R('PERIC','003','ADICIONAL DE PERICULOSIDADE',1,'','11','11','11'),
    R('ADNOT','004','ADICIONAL NOTURNO',1,'','11','11','11'),
    R('HE50','005','HORAS EXTRAS 50%',1,'','11','11','11'),
    R('HE100','006','HORAS EXTRAS 100%',1,'','11','11','11'),
    R('DSRHE','007','DSR SOBRE HORAS EXTRAS',1,'','11','11','11'),
    R('COMIS','008','COMISSÕES',1,'','11','11','11'),
    R('GRAT','009','GRATIFICAÇÕES',1,'','11','11','11'),
    R('OUTP','010','OUTROS PROVENTOS TRIBUTÁVEIS',1,'','11','11','11'),
    R('SALFAM','011','SALÁRIO-FAMÍLIA',1,'1409','00','00','00'),
    R('FALTAS','101','FALTAS INJUSTIFICADAS',2,'','11','11','11',true),
    R('ATRASOS','102','ATRASOS / SAÍDAS ANTECIPADAS',2,'','11','11','11',true),
    R('INSS','103','INSS',2,'9201','31','41','00'),
    R('IRRF','104','IRRF',2,'9203','00','31','00'),
    R('VT','105','VALE-TRANSPORTE (6%)',2,'','00','00','00'),
    R('ADIANT','106','ADIANTAMENTO SALARIAL',2,'9200','00','00','00'),
    R('PENSAO','107','PENSÃO ALIMENTÍCIA',2,'','00','00','00'),
    R('OUTD','108','OUTROS DESCONTOS',2,'','00','00','00'),
    R('FERIAS','012','FÉRIAS',1,'','11','11','11'),
    R('FERTERCO','013','1/3 CONSTITUCIONAL DE FÉRIAS',1,'','11','11','11'),
    R('ABONO','014','ABONO PECUNIÁRIO DE FÉRIAS',1,'','00','00','00'),
    R('ABONOTERCO','015','1/3 S/ ABONO PECUNIÁRIO',1,'','00','00','00'),
    R('D13','016','13º SALÁRIO',1,'','12','12','12'),
    R('D13P1','109','ADIANTAMENTO 13º (1ª PARCELA)',2,'','00','00','00'),
    R('D13INSS','110','INSS S/ 13º SALÁRIO',2,'9201','32','42','00'),
    R('D13IRRF','111','IRRF S/ 13º SALÁRIO',2,'9203','00','32','00'),
    R('AVISO','017','AVISO PRÉVIO INDENIZADO',1,'','00','00','11'),
    R('FERVENC','018','FÉRIAS VENCIDAS INDENIZADAS',1,'','00','00','00'),
    R('FERPROP','019','FÉRIAS PROPORCIONAIS',1,'','00','00','00'),
    R('FERPTERCO','020','1/3 S/ FÉRIAS NA RESCISÃO',1,'','00','00','00'),
    R('D13PROP','021','13º SALÁRIO PROPORCIONAL',1,'','12','12','12'),
    R('AVISOD','112','DESCONTO AVISO PRÉVIO NÃO CUMPRIDO',2,'','00','00','00')
  ].map(r=>{if(!r.nat&&NATMAP[r.sys])r.nat=NATMAP[r.sys];return r;});
}

/* ---------------- Banco local ---------------- */
const LS_KEY='folhaPro.v1';
let DB=null,_mem=null;

  const impL=impostoTabela(baseL,P),impS=impostoTabela(baseS,P);

  const ferVencPer=num(r.ferVencPer),ferVenc=r2(rem*ferVencPer),ferVencTerco=r2(ferVenc/3);
  let avosFer=0,ferProp=0,ferPropTerco=0;
  if(mt!=='01'){const adm=new Date(e.admissao+'T12:00:00'),fim=fimProj||new Date(e.desligamento+'T12:00:00');
    let ult=new Date(fim.getFullYear(),adm.getMonth(),adm.getDate(),12);if(ult>fim)ult=new Date(fim.getFullYear()-1,adm.getMonth(),adm.getDate(),12);

// versão simples e segura de indentação
function fmtXml(xml){
  const tokens=xml.replace(/>\s*</g,'><').split(/(?=<)|(?<=>)/).filter(Boolean);
  let out=[],ind=0,i=0;
  while(i<tokens.length){
    const t=tokens[i];
    if(/^<\?/.test(t)){out.push(t);i++;continue;}
    if(/^<\//.test(t)){ind=Math.max(0,ind-1);out.push('  '.repeat(ind)+t);i++;continue;}
    if(/^<[^>]+\/>$/.test(t)){out.push('  '.repeat(ind)+t);i++;continue;}
    if(/^</.test(t)){
      if(tokens[i+1]&&!/^</.test(tokens[i+1])&&tokens[i+2]&&/^<\//.test(tokens[i+2])){out.push('  '.repeat(ind)+t+tokens[i+1]+tokens[i+2]);i+=3;continue;}
      out.push('  '.repeat(ind)+t);ind++;i++;continue;}
    i++;
  }
  return out.join('\n');
}

const evPorTipoRef=(tipo,pred)=>DB.eventos.find(e=>e.tipo===tipo&&e.status==='processado'&&(!pred||pred(e)));
/* validação local + dependências (simula a ordem exigida pelo eSocial) */
function validarBase(ev){
  const o=[],E=DB.empresa;if(!E){o.push('Empresa não cadastrada.');return o;}
  if(!cnpjValido(E.cnpj))o.push('CNPJ do empregador inválido.');
  if(!ev.gen)return o;
  const{tipo,args}=ev.gen;
  if(['S-1000'].includes(tipo)&&!E.classTrib)o.push('Informe a classificação tributária (classTrib).');
  if(tipo==='S-2200'||tipo==='S-2206'||tipo==='S-2230'||tipo==='S-2299'||tipo==='S-1200'||tipo==='S-1210'){
    const e=byId(DB.empregados,args.id);if(!e){o.push('Empregado não encontrado.');return o;}
    if(!cpfValido(e.cpf))o.push('CPF do empregado inválido.');
    if(tipo==='S-2200'){['nome','nasc','admissao','salario','mae','logr','cep','codMunic','uf'].forEach(k=>{if(!e[k]||(k==='salario'&&!num(e[k])))o.push('Campo obrigatório ausente no empregado: '+k);});if(!e.lotacao)o.push('Informe a lotação.');if(!e.estab)o.push('Informe o estabelecimento.');if(onlyD(e.sindCnpj).length!==14)o.push('Informe o CNPJ do sindicato da categoria profissional (S-2200: cnpjSindCategProf é obrigatório no leiaute S-1.3).');if(!String(e.dscJorn||'').trim())o.push('Informe a descrição da jornada contratual (S-2200: dscJorn é obrigatório no leiaute S-1.3).');}
  }
  if(['S-1010','S-1200','S-2299'].includes(tipo)){const rb=DB.rubricas.filter(r=>!r.nat||!/^\d{4}$/.test(r.nat));if(tipo==='S-1010'&&args.id){const r1=DB.rubricas.find(x=>x.sys===args.id);if(r1&&(!r1.nat||!/^\d{4}$/.test(r1.nat)))o.push('Rubrica '+r1.cod+' sem natureza válida (Tabela 3 do eSocial; XSD: natRubr obrigatório, 4 dígitos).');}else if(tipo!=='S-1010'&&rb.length)o.push('Rubricas sem natureza (Tabela 3 do eSocial): '+rb.map(r=>r.cod).join(', '));}
  /* dependências */
  const simOK=(t,f)=>DB.eventos.some(x=>x.tipo===t&&x.status==='processado'&&(!f||f(x)));
  if(tipo!=='S-1000'&&!simOK('S-1000'))o.push('Dependência: o S-1000 (empregador) ainda não foi processado com sucesso.');
  if(tipo==='S-1200'&&rescNoMes(args.id,args.comp))o.push('Este trabalhador foi desligado na competência: as verbas vão no S-2299, não no S-1200.');
  if(tipo==='S-1200'){if(!simOK('S-2200',x=>x.empId===args.id))o.push('Dependência: S-2200 (admissão) do trabalhador ainda não processado.');if(!simOK('S-1010'))o.push('Dependência: tabela de rubricas (S-1010) ainda não processada.');if(!simOK('S-1020'))o.push('Dependência: tabela de lotações (S-1020) ainda não processada.');}
  if(tipo==='S-1210'){if(rescNoMes(args.id,args.comp)){if(!simOK('S-2299',x=>x.empId===args.id))o.push('Dependência: S-2299 (desligamento, com as verbas rescisórias) ainda não processado.');}else if(!simOK('S-1200',x=>x.empId===args.id&&x.comp===args.comp))o.push('Dependência: S-1200 do trabalhador na competência ainda não processado.');}
  if(tipo==='S-1299'){const c=DB.comps[args.comp];const ids=c?Object.keys(c.res):[];ids.forEach(id=>{if(rescNoMes(id,args.comp)){if(!simOK('S-2299',x=>x.empId===id))o.push('Dependência: S-2299 pendente de '+(byId(DB.empregados,id)||{}).nome);}else if(!simOK('S-1200',x=>x.empId===id&&x.comp===args.comp))o.push('Dependência: S-1200 pendente de '+(byId(DB.empregados,id)||{}).nome);if(!simOK('S-1210',x=>x.empId===id&&x.comp===args.comp))o.push('Dependência: S-1210 pendente de '+(byId(DB.empregados,id)||{}).nome);});}
  return o;
}

const rescNoMes=(id,comp)=>{const e=byId(DB.empregados,id),r=(DB.rescisoes||{})[id];return !!(e&&r&&e.desligamento&&e.desligamento.slice(0,7)===comp);};
const FPAS_OK=/^\d{3}$/;
function validarEvento(ev){const o=validarBase(ev),E=DB.empresa;if(!E||!ev.gen)return o;const{tipo,args}=ev.gen;
  if(tipo==='S-1000'){if(!E.regime)o.push('Informe o regime tributário (Simples Nacional, Lucro Presumido ou Lucro Real).');
    if(E.regime==='sn'&&!E.anexo)o.push('Simples Nacional: informe o enquadramento da CPP (Anexos I–III/V, Anexo IV ou misto).');
    if(E.regime==='sn'&&E.cprb)o.push('CPRB (desoneração) é incompatível com o Simples Nacional.');
    if(E.regime&&E.classTrib&&E.classTrib!==classTribDe(E))o.push('classTrib '+E.classTrib+' não corresponde ao regime informado (esperado '+classTribDe(E)+'). Salve a empresa novamente.');
    if(E.cprb&&!E.cnae)o.push('CPRB: informe o CNAE principal para conferir o enquadramento na atividade desonerada (Lei 12.546/2011, art. 7º-A) [VERIFICAR FONTE OFICIAL].');}
  if(tipo==='S-1005'){const s=byId(DB.estabs,args.id);if(s){
    if(String(s.tpInsc)==='1'&&!cnpjValido(s.nrInsc))o.push('CNPJ do estabelecimento inválido.');
    if(String(s.tpInsc)==='1'&&onlyD(s.nrInsc).slice(0,8)!==onlyD(E.cnpj).slice(0,8))o.push('O CNPJ do estabelecimento deve ter a mesma raiz (8 primeiros dígitos) do empregador.');
    if(onlyD(s.cnae).length!==7)o.push('CNAE do estabelecimento deve ter 7 dígitos.');
    if(ratIncide(E)){if(![1,2,3].includes(Number(s.rat)))o.push('RAT (grau de risco) deve ser 1, 2 ou 3 conforme o CNAE (Decreto 3.048/99, Anexo V) [VERIFICAR FONTE OFICIAL].');
      const f=num(s.fap);if(!(f>=0.5&&f<=2))o.push('FAP deve estar entre 0,5000 e 2,0000 (Lei 10.666/2003, art. 10).');}
    if(DB.estabs.filter(x=>x.tpInsc==s.tpInsc&&onlyD(x.nrInsc)===onlyD(s.nrInsc)).length>1)o.push('Inscrição de estabelecimento duplicada.');}}
  if(tipo==='S-1020'){const l=byId(DB.lotacoes,args.id);if(l){
    if(!FPAS_OK.test(String(l.fpas||'')))o.push('FPAS deve ter 3 dígitos (Tabela 4).');
    if(!/^\d{4}$/.test(String(l.codTercs||'')))o.push('Código de terceiros deve ter 4 dígitos (Tabela 4); use 0000 quando não houver recolhimento a terceiros.');
    if(E.regime==='sn'&&String(l.codTercs)!=='0000')o.push('Simples Nacional: terceiros dispensados — use código 0000 (LC 123/2006, art. 13, §3º).');
    if(E.regime!=='sn'&&String(l.codTercs)==='0000')o.push('Lucro Presumido/Real: informe o código de terceiros do FPAS (ex.: 0115 para FPAS 515; 0079 para FPAS 507) [VERIFICAR FONTE OFICIAL — Tabela 4].');
    if(E.regime==='sn'&&E.anexo==='misto'&&!l.atvSimples)o.push('Simples misto: indique se a lotação é de atividade com CPP substituída ou não substituída.');
    if(DB.lotacoes.filter(x=>String(x.cod)===String(l.cod)).length>1)o.push('Código de lotação duplicado.');}}
  if(tipo==='S-2200'){const e=byId(DB.empregados,args.id);if(e){const l=byId(DB.lotacoes,e.lotacao),s=byId(DB.estabs,e.estab);
    if(!l)o.push('Lotação do empregado não existe mais no cadastro.');if(!s)o.push('Estabelecimento do empregado não existe mais no cadastro.');
    if(l&&!DB.eventos.some(x=>x.tipo==='S-1020'&&x.status==='processado'&&x.gen.args.id===l.id))o.push('Dependência: a lotação '+l.cod+' (S-1020) ainda não foi processada.');
    if(s&&!DB.eventos.some(x=>x.tipo==='S-1005'&&x.status==='processado'&&x.gen.args.id===s.id))o.push('Dependência: o estabelecimento '+s.nome+' (S-1005) ainda não foi processado.');}}
  return o;}

/* ===================== Comparativo de regimes (Simples × Presumido × Real) ===================== */
/* Tabelas dos Anexos I a V — LC 123/2006, redação da LC 155/2016: [RBT12 até, alíquota nominal %, parcela a deduzir R$] */
const SN_TAB={
 I:[[180000,4,0],[360000,7.3,5940],[720000,9.5,13860],[1800000,10.7,22500],[3600000,14.3,87300],[4800000,19,378000]],
 II:[[180000,4.5,0],[360000,7.8,5940],[720000,10,13860],[1800000,11.2,22500],[3600000,14.7,85500],[4800000,30,720000]],
 III:[[180000,6,0],[360000,11.2,9360],[720000,13.5,17640],[1800000,16,35640],[3600000,21,125640],[4800000,33,648000]],
 IV:[[180000,4.5,0],[360000,9,8100],[720000,10.2,12420],[1800000,14,39780],[3600000,22,183780],[4800000,33,828000]],
 V:[[180000,15.5,0],[360000,18,4500],[720000,19.5,9900],[1800000,20.5,17100],[3600000,23,62100],[4800000,30.5,540000]]};
function snEfetiva(anexo,rbt12){const t=SN_TAB[anexo];const f=t.find(x=>rbt12<=x[0]);if(!f)return null;
  const rb=Math.max(rbt12,1);return{nom:f[1],pd:f[2],faixa:t.indexOf(f)+1,ef:rbt12<=0?f[1]:Math.max(0,(rb*f[1]/100-f[2])/rb*100)};}
/* Percentuais de presunção: [IRPJ %, CSLL %] — Lei 9.249/1995, arts. 15 e 20 */
const PRES={com:['Comércio e indústria',8,12],serv:['Serviços em geral, intermediação, locação (32%)',32,32],carga:['Transporte de cargas',8,12],hosp:['Serviços hospitalares',8,12],pass:['Transporte de passageiros',16,12]};
const CMP_DEF={rec:100000,rbt12:0,ativ:'serv',snServ:'fatorR',pres:'serv',iss:3,icms:0,sal:15000,prol:5000,desp:20000,credBase:5000,rat:2,terc:5.8,lc224:true};
function cmpEncargos(i,regime,anexoIV){ /* valor ANUAL */ // CPP patronal, RAT, terceiros — Lei 8.212/91, art. 22, I a III
  const pat=num(DB&&DB.params?DB.params.patronal:20);
  if(regime==='sn'&&!anexoIV)return 0;
  const temTerc=regime!=='sn';
  return r2((num(i.sal)*(pat+num(i.rat)+(temTerc?num(i.terc):0))/100+num(i.prol)*pat/100)*12);}
function calcSimplesCmp(i){const rec=num(i.rec),rbt=num(i.rbt12)>0?num(i.rbt12):rec*12,fgts=num(i.sal)*0.08;
  const o={key:'sn',nome:'Simples Nacional',notas:[]};
  if(rbt>4800000){o.elegivel=false;o.motivo='RBT12 acima de R$ 4,8 milhões: ultrapassa o limite do Simples (LC 123/2006, art. 3º, II).';return o;}
  const fatorR=rbt>0?(num(i.sal)+num(i.prol)+fgts)*12/rbt:0;o.fatorR=fatorR;
  let anexo=i.ativ==='com'?'I':i.ativ==='ind'?'II':(i.snServ==='fatorR'?(fatorR>=0.28?'III':'V'):i.snServ);
  if(i.ativ==='ind')anexo='II';
  const e=snEfetiva(anexo,rbt);o.anexo=anexo;o.efetiva=e.ef;o.faixa=e.faixa;
  if(i.ativ==='serv'&&i.snServ==='fatorR')o.notas.push('Fator R = '+(fatorR*100).toFixed(1).replace('.',',')+'% → '+(fatorR>=0.28?'Anexo III (fator R ≥ 28%)':'Anexo V (fator R < 28%)')+'.');
  const das=r2(rec*12*e.ef/100);const iv=anexo==='IV';const enc=cmpEncargos(i,'sn',iv);
  let fora=0;if(rbt>3600000){fora=r2(rec*12*(i.ativ==='serv'?num(i.iss):num(i.icms))/100);o.notas.push('RBT12 acima de R$ 3,6 milhões: ICMS/ISS são recolhidos fora do DAS (LC 123/2006, art. 13-A). Estimativa conservadora: o ISS/ICMS informado foi somado integralmente, sem abater sua parcela do DAS.');}
  if(iv)o.notas.push('Anexo IV: a CPP patronal (20%) e o RAT não estão no DAS e são recolhidos à parte (LC 123/2006, art. 18, §5º-C); terceiros dispensados.');
  o.partes={das,irpj:0,csll:0,pc:0,iss:i.ativ==='serv'?fora:0,icms:i.ativ==='serv'?0:fora,enc};o.elegivel=true;return o;}
function calcPresumidoCmp(i){const R=num(i.rec)*12,P=PRES[i.pres]||PRES.serv,lim=5000000,f=i.lc224?1.1:1;
  const o={key:'lp',nome:'Lucro Presumido',notas:[],elegivel:true};
  if(R>78000000){o.elegivel=false;o.motivo='Receita bruta anual acima de R$ 78 milhões: vedado o Lucro Presumido (Lei 9.718/1998, art. 14, I).';return o;}
  const baseIr=P[1]/100*(Math.min(R,lim)+f*Math.max(R-lim,0)),baseCs=P[2]/100*(Math.min(R,lim)+f*Math.max(R-lim,0));
  const irpj=r2(baseIr*0.15+Math.max(0,baseIr-240000)*0.10),csll=r2(baseCs*0.09);
  const pc=r2(R*0.0365),iss=i.ativ==='serv'?r2(R*num(i.iss)/100):0,icms=i.ativ==='serv'?0:r2(R*num(i.icms)/100);
  if(R>lim&&i.lc224)o.notas.push('Acréscimo de 10% nos percentuais de presunção sobre a receita anual que excede R$ 5 milhões (LC 224/2025; IN RFB 2.305/2025). A CSLL só sofre o acréscimo a partir de 1º/04/2026 e há discussão judicial: a conta aplica o acréscimo nos 12 meses [VERIFICAR FONTE OFICIAL].');
  o.base={irpj:baseIr,csll:baseCs};o.partes={das:0,irpj,csll,pc,iss,icms,enc:cmpEncargos(i,'lp')};return o;}
function calcRealCmp(i){const R=num(i.rec)*12;const o={key:'lr',nome:'Lucro Real',notas:[],elegivel:true};
  const enc=cmpEncargos(i,'lr'),fgts=num(i.sal)*0.08*12,folha=num(i.sal)*12+num(i.prol)*12+fgts+enc;
  const deb=R*0.0925,cred=num(i.credBase)*12*0.0925,pc=r2(Math.max(0,deb-cred));
  const iss=i.ativ==='serv'?r2(R*num(i.iss)/100):0,icms=i.ativ==='serv'?0:r2(R*num(i.icms)/100);
  const lucro=R-pc-iss-icms-num(i.desp)*12-folha;o.lucro=lucro;
  const irpj=r2(Math.max(0,lucro)*0.15+Math.max(0,lucro-240000)*0.10),csll=r2(Math.max(0,lucro)*0.09);
  if(lucro<=0)o.notas.push('Prejuízo fiscal no período: IRPJ e CSLL zerados. O prejuízo pode ser compensado em períodos futuros (limite de 30% do lucro) — não simulado (Lei 9.065/1995, art. 15) [VERIFICAR FONTE OFICIAL].');
  o.notas.push('PIS/COFINS não cumulativos: 1,65% + 7,6% sobre a receita, menos créditos de 9,25% sobre a base informada (Leis 10.637/2002 e 10.833/2003, arts. 2º e 3º).');
  o.partes={das:0,irpj,csll,pc,iss,icms,enc};return o;}
function compararRegimes(i){const R=num(i.rec)*12,fgts=num(i.sal)*0.08*12;
  const out=[calcSimplesCmp(i),calcPresumidoCmp(i),calcRealCmp(i)];
  out.forEach(o=>{if(!o.elegivel)return;const p=o.partes;o.total=r2(p.das+p.irpj+p.csll+p.pc+p.iss+p.icms+p.enc);o.carga=R>0?o.total/R*100:0;
    o.resultado=r2(R-num(i.desp)*12-num(i.sal)*12-num(i.prol)*12-fgts-o.total);});
  const el=out.filter(o=>o.elegivel);if(el.length){const m=Math.min(...el.map(o=>o.total));el.forEach(o=>{o.melhor=o.total===m;o.dif=r2(o.total-m);});}
  return out;}
function varrerReceita(i,mults){return mults.map(m=>{const j=Object.assign({},i,{rec:num(i.rec)*m,sal:num(i.sal)*m,prol:num(i.prol),desp:num(i.desp)*m,credBase:num(i.credBase)*m,rbt12:0});
  const r=compararRegimes(j);return{rec:j.rec*12,v:r.map(o=>o.elegivel?o.carga:null)};});}

function F(label,name,val,o){o=o||{};const t=o.t||'text',span=o.w?` style="grid-column:span ${o.w}"`:'';const v=val==null?'':val;
  const c=`name="${name}" ${o.req?'required':''} ${o.ro?'readonly':''} ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${o.mask?`data-mask="${o.mask}"`:''} ${o.max?`maxlength="${o.max}"`:''}`;
  let inp;
  if(t==='select')inp=`<select ${c}>${(o.opts||[]).map(x=>{const [k,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(k)}" ${String(k)===String(v)?'selected':''}>${esc(l)}</option>`;}).join('')}</select>`;
  else if(t==='money')inp=`<input type="text" inputmode="decimal" data-t="money" ${c} value="${v===''?'':brIn(num(v))}">`;
  else if(t==='check')inp=`<label class="chk"><input type="checkbox" name="${name}" ${v?'checked':''}> ${esc(o.cl||'Sim')}</label>`;
  else if(t==='textarea')inp=`<textarea ${c} rows="${o.rows||3}">${esc(v)}</textarea>`;
  else inp=`<input type="${t}" ${c} ${o.list?`list="${o.list}"`:''} value="${esc(v)}">`;
  return `<div class="f"${span}><label>${esc(label)}${o.req?' <b class="rq">*</b>':''}</label>${inp}${o.hint?`<small>${o.hint}</small>`:''}</div>`;}
function readForm(root){const o={};$$('[name]',root).forEach(el=>{const n=el.name;if(el.type==='checkbox')o[n]=el.checked;else if(el.dataset.t==='money')o[n]=num(el.value);else o[n]=el.value.trim();});return o;}
function faltando(root){const m=[];$$('[required]',root).forEach(el=>{if(!el.value.trim()){const l=el.closest('.f');m.push(l?l.querySelector('label').textContent.replace('*','').trim():el.name);}});return m;}
const badge=(t,c)=>`<span class="badge b-${c||'gray'}">${esc(t)}</span>`;
const ST={gerado:['Gerado','gray'],enviado:['Enviado','blue'],processado:['Processado','ok'],rejeitado:['Rejeitado','err']};
const stBadge=ev=>ev?badge(ST[ev.status][0],ST[ev.status][1]):badge('Não enviado','warn');
const ultEv=(tipo,pred)=>DB.eventos.find(e=>e.tipo===tipo&&(!pred||pred(e)));
const compInput=(val)=>`<input type="month" id="compSel" value="${val}" style="padding:7px 9px;border:1px solid #c7d0d9;border-radius:6px;font:inherit">`;

/* ===================== CRUD genérico (cadastros auxiliares) ===================== */
function crud(name,cfg){
  CR[name]=cfg;
  SC[name]={
    view(p){const rows=cfg.list();const ed=p.edit!=null?cfg.list().find(x=>x[cfg.key]===p.edit):null;
      const showForm=p.novo||ed;
      return `<h1>${cfg.title}</h1><p class="sub">${cfg.sub||''}</p>${exigeEmpresa()}${cfg.note?`<div class="note info">${typeof cfg.note==='function'?cfg.note():cfg.note}</div>`:''}
      ${showForm?`<div class="card" data-form id="f"><h2>${ed?'Editar':'Novo'} registro</h2><div class="grid">${cfg.fields(ed||cfg.novo&&cfg.novo()||{},!!ed)}</div></div>`:''}
      <div class="card"><div class="row sp"><h2>Registros (${rows.length})</h2>${cfg.noAdd?'':`<button class="btn pri" data-act="crudNovo">＋ Novo</button>`}</div>
      <div class="tw"><table class="t"><thead><tr>${cfg.cols.map(c=>`<th>${c[1]}</th>`).join('')}${cfg.tipo?'<th>eSocial</th>':''}<th></th></tr></thead><tbody>
      ${rows.map(r=>`<tr>${cfg.cols.map(c=>`<td>${c[2]?c[2](r):esc(r[c[0]])}</td>`).join('')}${cfg.tipo?`<td>${stBadge(ultEv(cfg.tipo,e=>e.gen.args.id===r[cfg.key]))}</td>`:''}
      <td class="r"><button class="btn sm" data-act="crudEdit" data-id="${esc(r[cfg.key])}">Editar</button> ${cfg.tipo?`<button class="btn sm send" data-act="crudSend" data-id="${esc(r[cfg.key])}">Enviar ${cfg.tipo}</button> `:''}${cfg.noDel?'':`<button class="btn sm danger" data-act="crudDel" data-id="${esc(r[cfg.key])}">Excluir</button>`}</td></tr>`).join('')||`<tr><td colspan="${cfg.cols.length+2}" class="c" style="color:var(--mut);padding:18px">Nenhum registro cadastrado.</td></tr>`}
      </tbody></table></div></div>`;},
    actions(p){const a=[];if(p.novo||p.edit!=null){a.push({label:'Cancelar edição',act:'crudCancel'},{label:'💾 Salvar',act:'crudSave',cls:'pri',key:'save'});if(cfg.tipo)a.push({label:'Salvar e enviar '+cfg.tipo+' ao eSocial',act:'crudSaveSend',cls:'send',key:'send'});}
      else if(cfg.tipo)a.push({label:'Enviar todos ('+cfg.tipo+') ao eSocial',act:'crudSendAll',cls:'send',key:'send'});return a;}
  };
}
const crudCfg=()=>CR[NAV.cur.name];
ACT.crudNovo=()=>refresh({novo:true,edit:null});
ACT.crudCancel=()=>guard(()=>refresh({novo:false,edit:null}));
ACT.crudEdit=el=>refresh({edit:el.dataset.id,novo:false});
ACT.crudDel=el=>{const cfg=crudCfg();modalConfirm('Excluir este registro? Eventos já enviados ao eSocial não são desfeitos por esta ação.',()=>{const a=cfg.list();const i=a.findIndex(x=>String(x[cfg.key])===el.dataset.id);if(i>=0)a.splice(i,1);saveDB();refresh();toast('Registro excluído.');},{yes:'Excluir'});};
function crudSalvar(){const cfg=crudCfg(),f=$('#f');if(!f)return null;const mis=faltando(f);if(mis.length){toast('Preencha: '+mis.join(', '),'err');return null;}
  const o=readForm(f),p=NAV.cur.params;if(cfg.validate){const m=cfg.validate(o);if(m){toast(m,'err');return null;}}
  const arr=cfg.list();let rec;if(p.edit!=null){rec=arr.find(x=>String(x[cfg.key])===String(p.edit));Object.assign(rec,o);}else{rec=Object.assign({[cfg.key]:uid('r')},o);arr.push(rec);}
  saveDB();DIRTY=false;toast('Registro salvo.','ok');return rec;}
ACT.crudSave=()=>{if(crudSalvar())refresh({novo:false,edit:null});};
ACT.crudSaveSend=async()=>{const cfg=crudCfg();const r=crudSalvar();if(!r)return;refresh({novo:false,edit:null});await enviarRegistro(cfg.tipo,r[cfg.key]);};
ACT.crudSend=async el=>{await enviarRegistro(crudCfg().tipo,el.dataset.id);};
ACT.crudSendAll=async()=>{const cfg=crudCfg();for(const r of cfg.list())await enviarRegistro(cfg.tipo,r[cfg.key],true);toast('Envio concluído. Veja a Biblioteca de eventos.','ok');refresh();};
async function enviarRegistro(tipo,id,quiet){if(!DB.empresa){toast('Cadastre a empresa primeiro.','err');return;}
  const ev=criarEvento(tipo,{id});const r=await enviarEventos([ev]);if(!quiet)resumoEnvio(r,[ev]);refresh();}
function resumoEnvio(r,evs){if(r.rej||r.err){modal(`<div class="note err">Envio com ocorrências.</div>${evs.filter(e=>e.status==='rejeitado'||e.status==='gerado').map(e=>`<p><b>${esc(e.tipo)} — ${esc(e.titulo)}</b><br>${(e.ocorr||[]).map(o=>'• '+esc(o)).join('<br>')||'Sem detalhes.'}</p>`).join('')}<div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal">Fechar</button><button class="btn pri" data-act="nav" data-to="biblioteca">Abrir biblioteca</button></div>`,{title:'Retorno do envio'});}
  else toast(`Enviado: ${r.ok} evento(s) processado(s) com sucesso${DB.cfg.modo==='sim'?' (simulação)':''}.`,'ok');}

crud('estabs',{title:'Estabelecimentos (S-1005)',sub:'Matriz, filiais e obras (CNO) onde há trabalhadores. É aqui que ficam o CNAE preponderante, o grau de risco (RAT) e o FAP.',tipo:'S-1005',key:'id',list:()=>DB.estabs,

  cols:[['nome','Nome'],['tipoEstab','Natureza',r=>TPEST[r.tipoEstab]||'—'],['nrInsc','Inscrição',r=>r.tpInsc==1?fmtCNPJ(r.nrInsc):esc(r.nrInsc)],['cnae','CNAE'],['rat','RAT %',r=>ratIncide(DB.empresa)?esc(r.rat):'—'],['fap','FAP',r=>ratIncide(DB.empresa)?esc(r.fap):'—'],['n','Empregados',r=>String(DB.empregados.filter(e=>e.estab===r.id).length)]],
  novo:()=>({tipoEstab:DB.estabs.some(x=>x.tipoEstab==='matriz')?'filial':'matriz',tpInsc:'1',rat:2,fap:1,iniValid:DB.empresa?DB.empresa.iniValid:compAtual()}),

  validate:o=>{const E=DB.empresa;if(!E)return 'Cadastre a empresa antes.';const ed=NAV.cur.params.edit;
    o.nrInsc=onlyD(o.nrInsc);
    if(o.tpInsc==='1'){if(!cnpjValido(o.nrInsc))return 'CNPJ do estabelecimento inválido.';
      if(o.nrInsc.slice(0,8)!==onlyD(E.cnpj).slice(0,8))return 'O CNPJ do estabelecimento deve ter a mesma raiz (8 primeiros dígitos) do CNPJ do empregador.';
      if(o.tipoEstab==='matriz'&&o.nrInsc!==onlyD(E.cnpj))return 'A matriz deve ter o mesmo CNPJ do empregador ('+fmtCNPJ(E.cnpj)+').';
      if(o.tipoEstab==='filial'&&o.nrInsc===onlyD(E.cnpj))return 'Filial não pode ter o CNPJ da matriz.';
      if(o.tipoEstab==='obra')return 'Obra deve ser cadastrada com inscrição tipo 4 (CNO).';}
    else{if(o.tipoEstab!=='obra')return 'Inscrição CNO (tipo 4) só se aplica a obras.';if(o.nrInsc.length!==12)return 'O CNO deve ter 12 dígitos.';}
    if(onlyD(o.cnae).length!==7)return 'O CNAE deve ter 7 dígitos.';
    if(DB.estabs.some(x=>x.id!==ed&&x.tpInsc===o.tpInsc&&onlyD(x.nrInsc)===o.nrInsc))return 'Já existe estabelecimento com esta inscrição.';
    if(o.tipoEstab==='matriz'&&DB.estabs.some(x=>x.id!==ed&&x.tipoEstab==='matriz'))return 'Já existe uma matriz cadastrada.';
    if(ratIncide(E)){if(![1,2,3].includes(Number(o.rat)))return 'Informe o grau de risco (RAT) 1, 2 ou 3.';const f=num(o.fap);if(!(f>=0.5&&f<=2))return 'FAP deve estar entre 0,5 e 2,0.';}
    return null;}});

function regraPanel(E){E=E||{};const rg=E.regime||'lp',an=E.anexo||'std',cp=!!E.cprb&&rg!=='sn';
  const T=(n,inc,base)=>`<tr><td>${n}</td><td class="c">${inc}</td><td>${base}</td></tr>`;const sim=badge('Sim','ok'),nao=badge('Não','gray'),par=(x)=>badge(x,'warn');

    rows=T('CPP patronal 20%',iv?sim:mx?par('só lotações não substituídas'):nao,'LC 123/2006, art. 13, §3º e art. 18, §5º-C (Anexo IV e atividades vedadas)')+T('RAT × FAP',iv?sim:mx?par('só lotações não substituídas'):nao,'Mesmo tratamento da CPP')+T('Terceiros (Sistema S, salário-educação, INCRA)',nao,'LC 123/2006, art. 13, §3º')+T('FGTS 8%',sim,'Lei 8.036/90, art. 15')+T('INSS do empregado e IRRF',sim,'Lei 8.212/91, art. 20; Lei 7.713/88');

const GRUPO={'S-1000':1,'S-1005':1,'S-1010':1,'S-1020':1,'S-2200':2,'S-2206':2,'S-2230':2,'S-2299':2,'S-1200':3,'S-1210':3,'S-1299':3};
const hist=(ev,m)=>{(ev.historico=ev.historico||[]).push({t:agoraISO(),m});};
function refazerXml(ev){const g=GEN[ev.tipo](ev.gen.args,ev.opts||undefined);const old=ev.id;ev.id=g.id;ev.xml=fmtXml(g.xml);ev.titulo=g.titulo;DB.movs.forEach(m=>{if(m.evId===old)m.evId=ev.id;});}
async function enviarEventos(evs,log){const res={ok:0,rej:0,err:0};log=log||(()=>{});
  const prontos=[];
  for(const ev of evs){if(ev.status==='processado')continue;
    if(ev.status==='gerado'||ev.status==='rejeitado'){try{refazerXml(ev);}catch(e){}}
    const oc=validarEvento(ev);
    if(oc.length){ev.status='rejeitado';ev.ocorr=oc;hist(ev,'Rejeitado na validação local ('+oc.length+' ocorrência(s))');res.rej++;log(`✖ ${ev.tipo} ${ev.titulo}: ${oc[0]}`);saveDB();continue;}
    ev.ocorr=[];prontos.push(ev);}
  if(DB.cfg.modo==='gw'){
    for(let i=0;i<prontos.length;i+=50){const lote=prontos.slice(i,i+50);const grupos=[...new Set(lote.map(e=>GRUPO[e.tipo]))];
      for(const g of grupos){const L=lote.filter(e=>GRUPO[e.tipo]===g);
        try{const r=await fetch(DB.cfg.gateway.replace(/\/$/,'')+'/lotes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ambiente:DB.cfg.ambiente,grupo:g,empregador:{tpInsc:1,nrInsc:onlyD(DB.empresa.cnpj)},eventos:L.map(e=>({id:e.id,tipo:e.tipo,xml:e.xml}))})});
          if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();L.forEach(e=>{e.status='enviado';e.protocolo=j.protocolo;e.enviadoEm=agoraISO();hist(e,'Lote enviado — protocolo '+j.protocolo);});saveDB();
          let ok=false;for(let t=0;t<5&&!ok;t++){await sleep(1500);const q=await fetch(DB.cfg.gateway.replace(/\/$/,'')+'/lotes/'+encodeURIComponent(j.protocolo));const qj=await q.json();if(qj.status==='processado'){ok=true;(qj.eventos||[]).forEach(x=>{const e=L.find(y=>y.id===x.id);if(!e)return;if(x.situacao==='sucesso'){e.status='processado';e.recibo=x.recibo;e.processadoEm=agoraISO();hist(e,'Processado — recibo '+x.recibo);res.ok++;log('✔ '+e.tipo+' '+e.titulo);}else{e.status='rejeitado';e.ocorr=(x.ocorrencias||[]).map(o=>(o.codigo?o.codigo+' – ':'')+o.descricao);hist(e,'Rejeitado pelo eSocial');res.rej++;log('✖ '+e.tipo+' '+e.titulo);}});}}
          if(!ok)log('… lote '+j.protocolo+' ainda em processamento; use “Consultar” na biblioteca.');
        }catch(err){L.forEach(e=>{if(e.status!=='enviado'){e.status='gerado';hist(e,'Falha de comunicação com o gateway: '+err.message);}});res.err+=L.length;log('✖ Falha de comunicação: '+err.message+' (em páginas publicadas como artefato o navegador bloqueia chamadas externas; use o arquivo HTML local)');}
        saveDB();}}
  }else{
    for(const ev of prontos){ev.status='enviado';ev.protocolo='SIM-'+ts14()+String(Math.floor(Math.random()*9000)+1000);ev.enviadoEm=agoraISO();hist(ev,'Enviado (SIMULAÇÃO) — protocolo '+ev.protocolo);saveDB();await sleep(60);
      ev.status='processado';ev.recibo='SIM-1.2.'+ts14()+String(Math.floor(Math.random()*90000)+10000);ev.processadoEm=agoraISO();hist(ev,'Processado (SIMULAÇÃO) — recibo '+ev.recibo);res.ok++;log('✔ '+ev.tipo+' '+ev.titulo);saveDB();}
  }
  return res;}
function plano(comp){const c=DB.comps[comp],ids=c?Object.keys(c.res||{}):[],P=[];
  const add=(tipo,args,label,match)=>P.push({tipo,args,label,ev:ultEv(tipo,e=>!e.retif&&match(e))});
  add('S-1000',{},'Informações do empregador',()=>true);
  DB.estabs.forEach(s=>add('S-1005',{id:s.id},'Estabelecimento '+s.nome,e=>e.gen.args.id===s.id));
  DB.lotacoes.forEach(l=>add('S-1020',{id:l.id},'Lotação '+l.cod+' '+l.desc,e=>e.gen.args.id===l.id));
  DB.rubricas.filter(r=>r.tp!==3).forEach(r=>add('S-1010',{id:r.sys},'Rubrica '+r.cod+' '+r.desc,e=>e.gen.args.id===r.sys));
  DB.empregados.forEach(e=>add('S-2200',{id:e.id},'Admissão '+e.nome,x=>x.gen.args.id===e.id));
  ids.filter(id=>!rescNoMes(id,comp)).forEach(id=>add('S-1200',{id,comp},'Remuneração '+byId(DB.empregados,id).nome,x=>x.gen.args.id===id&&x.comp===comp));
  ids.forEach(id=>add('S-1210',{id,comp},'Pagamento '+byId(DB.empregados,id).nome,x=>x.gen.args.id===id&&x.comp===comp));
  ids.filter(id=>rescNoMes(id,comp)).forEach(id=>{const mv=DB.movs.find(m=>m.tipo==='S-2299'&&m.empId===id);if(mv)add('S-2299',{id,mov:mv},'Desligamento '+byId(DB.empregados,id).nome,x=>x.gen.args.id===id);});
  if(ids.length)add('S-1299',{comp},'Fechamento da competência',x=>x.comp===comp);
  return P;}

  return `<h1>Envio ao eSocial — ${compLabel(comp)}</h1><p class="sub">Ordem de transmissão: tabelas → admissões → remuneração (S-1200) → pagamentos (S-1210) → fechamento (S-1299). O envio cria os eventos que ainda faltam e respeita as dependências.</p>${exigeEmpresa()}${compBar(comp)}

  <div class="card"><div class="tw"><table class="t"><thead><tr><th>Evento</th><th>Descrição</th><th class="c">Total</th><th class="c">Processados</th><th class="c">Pendentes</th><th class="c">Rejeitados</th><th></th></tr></thead><tbody>
  ${ORDEM.filter(t=>grp[t]).map(t=>{const g=grp[t];const ok=g.filter(x=>x.ev&&x.ev.status==='processado').length,rj=g.filter(x=>x.ev&&x.ev.status==='rejeitado').length;return `<tr><td><b>${t}</b></td><td>${TIPOS[t]}</td><td class="c">${g.length}</td><td class="c">${ok?badge(ok,'ok'):'0'}</td><td class="c">${g.length-ok-rj}</td><td class="c">${rj?badge(rj,'err'):'0'}</td><td class="r"><button class="btn sm send" data-act="envioTipo" data-t="${t}" ${ok===g.length?'disabled':''}>Enviar ${t}</button></td></tr>`;}).join('')}
  </tbody></table></div></div>
  <div class="card"><h2>Andamento</h2><pre class="xml" id="log" style="max-height:220px;min-height:60px">Aguardando envio…</pre></div>`;},
  mount(){bindComp();},
  actions:()=>[{label:'Biblioteca de eventos',act:'go',arg:'',cls:''},{label:'🚀 Enviar tudo em ordem',act:'envioTudo',cls:'send',key:'send'}]};

let ENVIANDO=false;
async function executarPlano(comp,tipos){if(ENVIANDO)return;if(!DB.empresa){toast('Cadastre a empresa.','err');return;}ENVIANDO=true;const lg=$('#log');lg.textContent='';const L=m=>{lg.textContent+=m+'\n';lg.scrollTop=lg.scrollHeight;};const tot={ok:0,rej:0,err:0};
  try{const c=DB.comps[comp]||{status:'aberta'};
    for(const t of ORDEM){if(tipos&&!tipos.includes(t))continue;const itens=plano(comp).filter(x=>x.tipo===t);if(!itens.length)continue;
      if(['S-1200','S-1210'].includes(t)&&c.status==='aberta'){L('— '+t+' ignorado: folha não calculada.');continue;}
      if(t==='S-1299'&&c.status!=='fechada'){L('— S-1299 ignorado: feche a competência antes.');continue;}
      const evs=[];for(const it of itens){const u=it.ev;if(u&&u.status==='processado')continue;if(u&&(u.status==='gerado'||u.status==='enviado')){if(u.status==='gerado')evs.push(u);continue;}evs.push(criarEvento(t,it.args));}
      if(!evs.length)continue;L(`▸ ${t} — ${TIPOS[t]} (${evs.length})`);const r=await enviarEventos(evs,L);tot.ok+=r.ok;tot.rej+=r.rej;tot.err+=r.err;
      if(r.rej||r.err){L('■ Interrompido: corrija as ocorrências deste grupo antes de seguir (há dependências entre eventos).');break;}}
    L(`\nConcluído — ${tot.ok} processado(s), ${tot.rej} rejeitado(s), ${tot.err} falha(s).`);
  }finally{ENVIANDO=false;}
  toast(tot.rej||tot.err?'Envio com ocorrências — veja o andamento.':'Envio concluído.',tot.rej||tot.err?'err':'ok');renderSide();}

function checarEstrutura(){const E=DB.empresa,o=[];const add=(n,t)=>o.push({n,t});
  if(!E){add('err','Empresa não cadastrada.');return o;}
  if(!E.regime)add('err','Regime tributário não informado na empresa.');else add('ok','Regime: '+regimeTxt(E)+' (classTrib '+classTribDe(E)+').');

  if(ms.length===1)add('ok','Uma matriz cadastrada.');else add('err',ms.length?'Há mais de uma matriz.':'Nenhuma matriz cadastrada.');

const SER=['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#6250d6','#e34948'];
const brlK=n=>{const a=Math.abs(n);return (n<0?'-':'')+(a>=1e6?(a/1e6).toFixed(a>=1e7?0:1).replace('.',',')+' mi':a>=1e3?(a/1e3).toFixed(a>=1e4?0:1).replace('.',',')+' mil':String(Math.round(a)));};
const niceMax=v=>{if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=4?4:f<=8?8:10)*e;};
const legendHtml=(names,cols)=>`<div class="legend">${names.map((n,i)=>`<span><i class="sw" style="background:${(cols||SER)[i]}"></i>${esc(n)}</span>`).join('')}</div>`;
function vbars(cats,series,o){o=o||{};const W=640,H=o.h||250,m={l:50,r:8,t:12,b:30},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const tot=cats.map((_,i)=>series.reduce((a,s)=>a+(s.v[i]||0),0)),mx=niceMax(Math.max(...tot,1)),step=iw/Math.max(cats.length,1),bw=Math.min(54,step*0.6);
  let g='';for(let k=0;k<=4;k++){const y=m.t+ih-ih*k/4;g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="#e3e8ee" stroke-width="1"/><text x="${m.l-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#5d6b79">${brlK(mx*k/4)}</text>`;}
  let b='';cats.forEach((c,i)=>{let acc=0;const x=m.l+step*i+(step-bw)/2;series.forEach((s,j)=>{const v=s.v[i]||0;if(v<=0)return;const h=ih*v/mx,y=m.t+ih-ih*acc/mx-h;acc+=v;
    b+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h,0)}" rx="${j===series.length-1?3:0}" fill="${(o.cols||SER)[j]}" stroke="#fff" stroke-width="2" data-tip="${esc(c+' — '+s.n+': R$ '+brl(v))}"/>`;});
    b+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="#5d6b79">${esc(c)}</text>`;if(o.totals)b+=`<text x="${x+bw/2}" y="${m.t+ih-ih*acc/mx-5}" text-anchor="middle" font-size="11" font-weight="600" fill="#17212b">${brlK(acc)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label||'gráfico de barras')}">${g}${b}</svg>`;}
function hbars(items,o){o=o||{};const mx=Math.max(...items.map(x=>Math.abs(x.v)),1);
  return `<div class="hb">${items.map((x,i)=>`<div class="hrow" data-tip="${esc(x.l+': '+(o.fmt?o.fmt(x.v):'R$ '+brl(x.v)))}"><span class="hl">${esc(x.l)}</span><span class="ht"><i style="width:${Math.max(1,Math.abs(x.v)/mx*100)}%;background:${x.c||SER[0]}"></i></span><b>${o.fmt?o.fmt(x.v):brl(x.v)}</b></div>`).join('')}</div>`;}
function linhas(xs,series,o){o=o||{};const W=640,H=o.h||260,m={l:46,r:12,t:12,b:34},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const vals=series.flatMap(s=>s.v.filter(v=>v!=null)),mx=niceMax(Math.max(...vals,1));const X=i=>m.l+iw*i/Math.max(xs.length-1,1),Y=v=>m.t+ih-ih*v/mx;
  let g='';for(let k=0;k<=4;k++){const y=m.t+ih-ih*k/4;g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="#e3e8ee"/><text x="${m.l-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#5d6b79">${(v=>Number.isInteger(v)?v:v.toFixed(1).replace('.',','))(mx*k/4)}%</text>`;}
  xs.forEach((x,i)=>{g+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#5d6b79">${esc(x)}</text>`;});
  let l='';series.forEach((s,j)=>{let d='',pen=false;s.v.forEach((v,i)=>{if(v==null){pen=false;return;}d+=(pen?'L':'M')+X(i)+' '+Y(v)+' ';pen=true;});
    l+=`<path d="${d}" fill="none" stroke="${(o.cols||SER)[j]}" stroke-width="2" stroke-linejoin="round"/>`;
    s.v.forEach((v,i)=>{if(v==null)return;l+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="${(o.cols||SER)[j]}" stroke="#fff" stroke-width="2" data-tip="${esc(s.n+' — receita anual R$ '+xs[i]+': '+v.toFixed(1).replace('.',',')+'% de carga')}"/>`;});});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label||'gráfico de linhas')}">${g}${l}</svg>`;}

SC.integr={view(){const C=DB.cfg;
  return `<h1>Webservice do eSocial / Integração</h1><p class="sub">Configuração do ambiente e do serviço de transmissão.</p>
  <div data-form id="f"><div class="card"><h2>Ambiente e modo de envio</h2><div class="grid">${F('Ambiente do eSocial','ambiente',C.ambiente,{t:'select',opts:[['2','2 – Produção restrita (testes)'],['1','1 – Produção (valor jurídico)']],w:4})+F('Modo de envio','modo',C.modo,{t:'select',opts:[['sim','Simulação local (sem transmissão)'],['gw','Webservice via gateway']],w:4})+F('URL do gateway de integração','gateway',C.gateway,{w:4,ph:'https://seu-servidor/esocial'})}</div></div></div>
  <div class="card"><h2>Como a transmissão real funciona</h2><p>O eSocial exige <b>comunicação segura com certificado digital (e-CNPJ ou e-CPF de procurador)</b> e <b>assinatura XMLDSig</b> em cada evento — operações que um navegador não executa com segurança nem consegue sempre realizar por restrição de CORS. Por isso este sistema separa as responsabilidades:</p>
  <p><b>1. Este sistema (front-end)</b> cadastra, calcula, gera o XML de cada evento (leiaute S-1.3), mantém a biblioteca e controla status, recibo e retificações.<br><b>2. Gateway de integração (servidor seu)</b> valida o XML contra os XSD oficiais, assina com o certificado A1, monta o <span class="mono">envioLoteEventos</span> e chama os serviços SOAP do eSocial.</p>
  <h3>Serviços do eSocial (conferir no Manual de Orientação do Desenvolvedor, seção “URL dos Web Services”)</h3>
  <div class="tw"><table class="t"><tbody><tr><td>Envio de lote — produção restrita</td><td class="mono">https://webservices.producaorestrita.esocial.gov.br/servicos/empregador/enviarloteeventos/WsEnviarLoteEventos.svc</td></tr><tr><td>Consulta de lote — produção restrita</td><td class="mono">https://webservices.producaorestrita.esocial.gov.br/servicos/empregador/consultarloteeventos/WsConsultarLoteEventos.svc</td></tr><tr><td>Envio / consulta — produção</td><td class="mono">https://webservices.envio.esocial.gov.br/servicos/empregador/… (mesmos nomes de serviço)</td></tr></tbody></table></div>
  <h3 style="margin-top:14px">Contrato que o gateway deve expor para este sistema</h3>
  <pre class="xml">POST {gateway}/lotes
{ "ambiente": 2, "grupo": 1|2|3,           // 1 tabelas/iniciais · 2 não periódicos · 3 periódicos
  "empregador": {"tpInsc":1,"nrInsc":"CNPJ14"},
  "eventos": [ {"id":"ID1…","tipo":"S-1200","xml":"&lt;eSocial …&gt;"} ]  // até 50 por lote
}  →  200 {"protocolo":"…"}

GET {gateway}/lotes/{protocolo}
  →  {"status":"processando"|"processado",
      "eventos":[{"id":"ID1…","situacao":"sucesso"|"rejeitado","recibo":"…",
                  "ocorrencias":[{"codigo":"…","descricao":"…"}]}]}

GET {gateway}/status   →  200 (teste de conexão)</pre>
  <div class="note">Em páginas publicadas como artefato do Claude o navegador bloqueia chamadas a outros domínios; o modo webservice funciona quando o arquivo HTML é aberto localmente ou hospedado no seu domínio (com CORS liberado no gateway). Antes de usar em <b>produção</b>, valide todos os eventos em produção restrita.</div></div>`;},
  actions:()=>[{label:'Testar conexão',act:'intTest'},{label:'💾 Salvar configuração',act:'intSave',cls:'pri',key:'save'}]};
ACT.intSave=()=>{const o=readForm($('#f'));DB.cfg.ambiente=Number(o.ambiente);DB.cfg.modo=o.modo;DB.cfg.gateway=o.gateway;if(o.modo==='gw'&&!o.gateway){toast('Informe a URL do gateway.','err');return;}saveDB();DIRTY=false;toast('Configuração salva.','ok');refresh();};
ACT.intTest=async()=>{const u=($('[name=gateway]').value||'').replace(/\/$/,'');if(!u){toast('Informe a URL do gateway.','err');return;}try{const r=await fetch(u+'/status');toast(r.ok?'Gateway respondeu normalmente.':'Gateway respondeu HTTP '+r.status,r.ok?'ok':'err');}catch(e){toast('Sem conexão com o gateway: '+e.message,'err');}};

SC.backup={view(){return `<h1>Backup e dados</h1><p class="sub">Os dados ficam salvos no navegador deste dispositivo. Faça backup periódico.</p>
  <div class="card"><h2>Exportar / importar</h2><div class="row"><button class="btn pri" data-act="bkExport">Exportar backup (JSON)</button><button class="btn" data-act="bkImport">Importar backup</button></div></div>
  <div class="card"><h2>Dados de demonstração</h2><p class="sub">Carrega uma empresa fictícia (matriz e filial), 3 empregados e lançamentos para percorrer todo o fluxo. Escolha o regime a simular (substitui os dados atuais).</p><div class="row"><button class="btn" data-act="bkDemo" data-arg="sn">Simples Nacional (Anexo III/V)</button><button class="btn" data-act="bkDemo" data-arg="sn4">Simples Nacional (Anexo IV)</button><button class="btn" data-act="bkDemo" data-arg="lp">Lucro Presumido</button><button class="btn" data-act="bkDemo" data-arg="lr">Lucro Real</button><button class="btn" data-act="bkDemo" data-arg="lpcprb">Presumido com CPRB</button></div></div>
  <div class="card"><h2>Apagar tudo</h2><p class="sub">Remove todos os cadastros, folhas e eventos deste navegador.</p><button class="btn danger" data-act="bkReset">Apagar todos os dados</button></div>
  <div class="note info">Armazenamento local: ${(JSON.stringify(DB).length/1024).toFixed(0)} KB. Em páginas publicadas como artefato, o armazenamento pode ser limpo pelo navegador — mantenha sempre um backup.</div>`;},actions:()=>[]};
ACT.bkExport=()=>{const s=JSON.stringify(DB);modal(`<textarea id="bkt" style="width:100%;height:280px" class="mono" readonly>${esc(s)}</textarea><div class="row" style="margin-top:8px"><button class="btn pri" id="bkc">Copiar</button><button class="btn" id="bkd">Baixar .json</button></div>`,{title:'Backup completo',wide:true});
  $('#bkc').onclick=async()=>{try{await navigator.clipboard.writeText(s);toast('Copiado.','ok');}catch(e){$('#bkt').select();toast('Selecione e copie manualmente (Ctrl+C).');}};$('#bkd').onclick=()=>baixar('folhapro_backup_'+hoje()+'.json',s,'application/json');};
ACT.bkImport=()=>{modal(`<p class="sub">Cole o conteúdo do backup (JSON). Os dados atuais serão substituídos.</p><textarea id="bki" style="width:100%;height:260px" class="mono"></textarea><div class="row" style="margin-top:8px"><button class="btn pri" id="bkok">Importar</button></div>`,{title:'Importar backup',wide:true});
  $('#bkok').onclick=()=>{try{const d=JSON.parse($('#bki').value);if(!d||typeof d!=='object'||!Array.isArray(d.empregados))throw new Error('formato inválido');const e=emptyDB();DB=Object.assign(e,d,{cfg:Object.assign(e.cfg,d.cfg||{}),params:Object.assign(e.params,d.params||{})});migrar(DB);saveDB();closeModal();toast('Backup importado.','ok');refresh();}catch(x){toast('Backup inválido: '+x.message,'err');}};};
ACT.bkDemo=el=>modalConfirm('Substituir todos os dados atuais pelos dados de demonstração?',()=>{seedDemo(el&&el.dataset&&el.dataset.arg||'lp');toast('Dados de demonstração carregados.','ok');home();render();},{yes:'Carregar'});
ACT.bkReset=()=>modalConfirm('<b>Apagar todos os dados?</b> Esta ação não pode ser desfeita.',()=>{DB=emptyDB();saveDB();toast('Dados apagados.');home();render();},{yes:'Apagar tudo'});

SC.home={view(){const comp=DB.cfg.comp,c=DB.comps[comp],t=totaisComp(comp);const proc=s=>DB.eventos.some(e=>e.tipo===s&&e.status==='processado');
  const pend=DB.eventos.filter(e=>e.status==='gerado').length,rej=DB.eventos.filter(e=>e.status==='rejeitado').length;
  const S=(n,t,d,done,to,lab)=>`<div class="step ${done?'done':''}"><div><span class="n">${done?'✓':n}</span><b>${t}</b></div><p>${d}</p><div><button class="btn sm ${done?'':'pri'}" data-act="nav" data-to="${to}">${lab}</button></div></div>`;
  const eAtivos=DB.empregados.filter(e=>e.situacao==='ativo').length;
  return `<h1>${esc(BRAND.nome)} ${esc(BRAND.titulo)}</h1><p class="sub">Departamento pessoal, folha de pagamento, contracheque e eSocial — da abertura da empresa à entrega do recibo e ao envio dos eventos.</p>
  ${!DB.empresa?`<div class="note"><b>Comece por aqui:</b> cadastre a empresa ou carregue dados de demonstração para percorrer o fluxo completo. <button class="btn sm" data-act="bkDemo" style="margin-left:8px">Carregar demonstração</button> <button class="btn sm pri" data-act="nav" data-to="empresa">Cadastrar empresa</button></div>`:''}
  <div class="kpis"><div class="kpi"><span>Empregados ativos</span><b>${eAtivos}</b></div><div class="kpi"><span>Competência</span><b>${compLabel(comp)}</b></div><div class="kpi"><span>Líquido da folha</span><b>R$ ${brl(t.liq)}</b></div><div class="kpi"><span>Eventos processados</span><b style="color:var(--ok)">${DB.eventos.filter(e=>e.status==='processado').length}</b></div><div class="kpi"><span>Pendentes / rejeitados</span><b>${pend} / <span style="color:${rej?'var(--err)':'inherit'}">${rej}</span></b></div></div>
  <h2>Fluxo de trabalho</h2><div class="steps">
  ${S(1,'Empresa','Dados do empregador, endereço, encargos e responsável (S-1000).',!!DB.empresa&&proc('S-1000'),'empresa','Cadastro da empresa')}
  ${S(2,'Tabelas','Estabelecimentos, lotações tributárias, cargos e rubricas (S-1005, S-1020, S-1010). Veja o mapa da estrutura.',proc('S-1005')&&proc('S-1020')&&proc('S-1010'),'estrutura','Mapa da estrutura')}
  ${S(3,'Empregados','Cadastro de trabalhadores, dependentes e contrato; admissão (S-2200).',DB.empregados.length>0&&DB.empregados.every(e=>DB.eventos.some(x=>x.tipo==='S-2200'&&x.gen.args.id===e.id&&x.status==='processado')),'empregados','Cadastro de empregados')}
  ${S(4,'Lançamentos','Horas extras, faltas, comissões e descontos do mês.',!!c&&Object.keys(c.lanc||{}).length>0,'lanc','Lançar eventos do mês')}
  ${S(5,'Cálculo da folha','INSS, IRRF, FGTS, salário-família, VT e encargos; fechamento.',!!c&&c.status==='fechada','folha','Calcular e fechar')}
  ${S(6,'Contracheque','Recibo de pagamento para visualizar, imprimir e registrar a entrega.',DB.empregados.length>0&&Object.keys((c||{}).res||{}).length>0&&Object.keys(c.res).every(id=>DB.entregues[comp+'|'+id]),'holerite','Contracheques')}
  ${S(7,'Envio ao eSocial','S-1200, S-1210 e S-1299 da competência, com dependências respeitadas.',DB.eventos.some(e=>e.tipo==='S-1299'&&e.comp===comp&&e.status==='processado'),'envio','Enviar competência')}
  ${S(8,'Biblioteca','Todos os XML, protocolos, recibos, ocorrências e retificações.',false,'biblioteca','Abrir biblioteca')}
  ${S(9,'Painel e comparativo','Dashboards da folha, encargos e eSocial; comparativo entre Simples, Presumido e Real.',false,'painel','Abrir painel')}
  </div>
  <div class="note info" style="margin-top:16px">Atalhos: <b>Alt+V</b> volta à tela anterior · <b>Alt+I</b> tela inicial · <b>Alt+S</b> salva · <b>Alt+E</b> envia ao eSocial. Além do fluxo mensal, o sistema calcula férias, 13º salário e rescisão, diferencia Simples Nacional, Lucro Presumido e Lucro Real e mostra a estrutura de estabelecimentos e lotações. Ainda não cobre: eventos de SST (S-2210/2220/2240), RAIS e DIRF/EFD-Reinf.</div>`;},
  actions:()=>[{label:'Cadastro da empresa',act:'nav',arg:'',cls:''},{label:'Calcular folha →',act:'nav',arg:'',cls:'pri'}]};
// ações da home usam data-to; ajuste das duas de rodapé:
SC.home.actions=()=>[{label:'Biblioteca de eventos',act:'goBib'},{label:'Cálculo da folha →',act:'goFolha',cls:'pri',key:'save'},{label:'Enviar ao eSocial →',act:'goEnvio',cls:'send',key:'send'}];
ACT.goBib=()=>go('biblioteca');ACT.goFolha=()=>go('folha',{comp:DB.cfg.comp});ACT.goEnvio=()=>go('envio',{comp:DB.cfg.comp});

SC.marca={view(){const b=BRAND;const F=(l,id,v,sp,t)=>`<div class="f" style="grid-column:span ${sp||4}"><label>${l}</label><input id="mb_${id}" type="${t||'text'}" value="${esc(v)}"${t==='color'?' style="height:36px;padding:2px"':''}></div>`;
 return `<h1>Identidade visual</h1><p class="sub">Adapta o sistema à marca do cliente: nome, cores, fonte e logotipo. A configuração fica guardada neste navegador, separada dos dados da folha, e não é apagada por "Apagar todos os dados".</p>
 <div class="card"><h2>Marca</h2><div class="grid">${F('Nome da empresa','nome',b.nome)}${F('Nome do produto (curto)','produto',b.produto)}${F('Título completo','titulo',b.titulo)}
 ${F('Cor primária (botões, links)','pri',b.pri,3,'color')}${F('Cor da barra superior','pri2',b.pri2,3,'color')}${F('Cor de destaque (logotipo)','acc',b.acc,3,'color')}${F('Fonte (nome no Google Fonts)','fonte',b.fonte,3)}
 <div class="f" style="grid-column:span 6"><label>Logotipo (PNG/SVG/JPG, até 150 KB)</label><input id="mb_logo" type="file" accept="image/*"></div>
 <div class="f" style="grid-column:span 6"><label>Logotipo atual</label><div id="mb_prev" style="min-height:34px">${b.logo?`<img src="${b.logo}" style="height:34px;background:${esc(b.pri2)};padding:4px;border-radius:4px">`:'<span class="sub">Sem logotipo (usa o nome em texto)</span>'}</div></div></div>
 <div class="row" style="margin-top:10px"><button class="btn pri" data-act="marcaSave">Aplicar e salvar</button><button class="btn" data-act="marcaReset">Restaurar padrão</button></div></div>
 <div class="note warn">Valores padrão para o cliente Mallora: apenas a cor <b>#0B0B0B</b> foi identificada no site; o destaque e a fonte são provisórios [CONFIRMAR COM O MANUAL DE MARCA]. A fonte só é carregada se o navegador tiver acesso ao Google Fonts; sem acesso, usa a fonte do sistema.</div>`;},
 mount(){const rd=()=>{const g=i=>($('#mb_'+i)||{}).value;return Object.assign({},BRAND,{nome:g('nome')||BRAND.nome,produto:g('produto')||'',titulo:g('titulo')||BRAND.titulo,pri:g('pri'),pri2:g('pri2'),acc:g('acc'),fonte:(g('fonte')||'').trim()});};
  ['nome','produto','titulo','pri','pri2','acc'].forEach(i=>{const e=$('#mb_'+i);if(e)e.addEventListener('input',()=>applyBrand(rd()));});
  const lf=$('#mb_logo');if(lf)lf.addEventListener('change',()=>{const f=lf.files[0];if(!f)return;if(f.size>150*1024){toast('Arquivo acima de 150 KB.','err');lf.value='';return;}const r=new FileReader();r.onload=()=>{BRAND.logo=r.result;applyBrand(rd());$('#mb_prev').innerHTML=`<img src="${r.result}" style="height:34px;background:${esc(rd().pri2)};padding:4px;border-radius:4px">`;};r.readAsDataURL(f);});
  SC.marca._rd=rd;},actions:()=>[]};
ACT.marcaSave=()=>{BRAND=SC.marca._rd();brandSave();applyBrand();toast('Identidade visual aplicada.','ok');};
ACT.marcaReset=()=>{BRAND=Object.assign({},BRAND_DEF);try{localStorage.removeItem(BRAND_KEY);}catch(e){}applyBrand();render();toast('Padrão restaurado.','ok');};
brandLoad();applyBrand();DB=loadDB();render();
</script></body></html>

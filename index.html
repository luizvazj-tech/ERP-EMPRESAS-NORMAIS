SC.seguranca={view(){const id=DB.cfg.idle||15;return `<h1>Segurança e acesso</h1><p class="sub">Senha do cofre, bloqueio automático e estado da proteção.</p>
 <div class="card"><h2>Estado</h2><p>Criptografia em repouso: <b>${VAULT.on?'ativa (AES-GCM-256, PBKDF2 600.000 iterações)':'inativa (modo de teste)'}</b>. Bloqueio por inatividade: <b>${id} min</b>.</p>
 <div class="row"><button class="btn" data-act="lock">Bloquear agora</button></div></div>
 <div class="card"><h2>Bloqueio por inatividade</h2><div class="row"><div class="f"><label for="idle">Minutos (5 a 60)</label><input id="idle" type="number" min="5" max="60" value="${id}"></div><button class="btn" data-act="idleSave" style="align-self:flex-end">Salvar</button></div></div>
 <div class="card"><h2>Alterar senha</h2><div class="grid"><div class="f" style="grid-column:span 4"><label for="pw0">Senha atual</label><input id="pw0" type="password" autocomplete="current-password"></div><div class="f" style="grid-column:span 4"><label for="pw1">Nova senha (mín. 12, com 3 tipos de caractere)</label><input id="pw1" type="password" autocomplete="new-password"></div><div class="f" style="grid-column:span 4"><label for="pw2">Repita a nova senha</label><input id="pw2" type="password" autocomplete="new-password"></div></div>
 <div class="row" style="margin-top:10px"><button class="btn pri" data-act="pwdChange">Alterar senha</button></div></div>
 <div class="note warn">A senha não é recuperável. Mantenha um backup (Sistema → Backup e dados). Um único usuário acessa o cofre; perfis, permissões por usuário e login corporativo exigem servidor (ver planilha de pendências).</div>`;},actions:()=>[]};
ACT.idleSave=()=>{const v=Math.max(5,Math.min(60,parseInt($('#idle').value,10)||15));DB.cfg.idle=v;saveDB();vaultIdle();toast('Salvo.','ok');render();};
ACT.pwdChange=async()=>{const a=$('#pw0').value,b=$('#pw1').value,c=$('#pw2').value;if(b!==c){toast('As novas senhas não conferem.','err');return;}if(!senhaForca(b).ok){toast('A nova senha deve ter ao menos 12 caracteres e 3 tipos (maiúscula, minúscula, número, símbolo).','err');return;}
  try{await vaultFlush();await vTry(localStorage.getItem(VK),a);}catch(e){toast('Senha atual incorreta.','err');return;}
  VAULT.salt=crypto.getRandomValues(new Uint8Array(16));VAULT.key=await deriveKey(b,VAULT.salt,VAULT.it);audit('senha alterada');saveDB();await vaultFlush();toast('Senha alterada.','ok');render();};
ACT.lock=async()=>{await vaultFlush();vaultLock();};
function vaultIdle(){clearTimeout(VAULT.idleT);if(!VAULT.on)return;VAULT.idleT=setTimeout(()=>{ACT.lock();},((DB&&DB.cfg&&DB.cfg.idle)||15)*60000);}
function vaultLock(msg){VAULT.key=null;VAULT.on=false;DB=null;clearTimeout(VAULT.idleT);closeModal();$('#main').innerHTML='';$('#bar').innerHTML='';$('#side').innerHTML='';$('#topemp').textContent='Sessão bloqueada';gateUnlock(msg||'Sessão bloqueada por segurança.');}

/* ---------- tela de acesso ---------- */
function gate(html){let g=document.getElementById('gate');if(!g){g=document.createElement('div');g.id='gate';g.setAttribute('role','dialog');g.setAttribute('aria-modal','true');g.setAttribute('aria-labelledby','gt');document.body.appendChild(g);}g.innerHTML=`<div class="gbox">${html}<p class="gl"><a href="#" data-act="ckPolicy" data-arg="privacidade">Privacidade</a> · <a href="#" data-act="ckPolicy" data-arg="cookies">Cookies</a> · <a href="#" data-act="ckReopen">Preferências de cookies</a></p></div>`;const f=g.querySelector('input');f&&f.focus();return g;}
function gateClose(){const g=document.getElementById('gate');if(g)g.remove();}
function gateSetup(){const legacy=(()=>{try{return localStorage.getItem(LS_KEY);}catch(e){return null;}})();
  const g=gate(`<h1 id="gt">${esc(BRAND.nome)} ${esc(BRAND.produto)}</h1><p>Primeiro acesso: crie a senha que protege os dados deste navegador.${legacy?' <b>Foram encontrados dados anteriores sem proteção; eles serão criptografados e a cópia aberta será removida.</b>':''}</p>
  <div class="f"><label for="g1">Senha (mínimo 12 caracteres, com 3 tipos entre maiúscula, minúscula, número e símbolo)</label><input id="g1" type="password" autocomplete="new-password"></div>
  <div class="f"><label for="g2">Repita a senha</label><input id="g2" type="password" autocomplete="new-password"></div>
  <p class="gm" id="gmsg" role="alert"></p><div class="note warn">Esta senha <b>não pode ser recuperada</b>. Sem ela, os dados só voltam por backup.</div>
  <button class="btn pri" id="gok" style="width:100%">Criar senha e entrar</button>`);
  const go=async()=>{const a=$('#g1').value,b=$('#g2').value,m=$('#gmsg');if(a!==b){m.textContent='As senhas não conferem.';return;}if(!senhaForca(a).ok){m.textContent='Senha fraca: use 12 ou mais caracteres e ao menos 3 tipos.';return;}
    $('#gok').disabled=true;m.textContent='Gerando chave…';try{VAULT.salt=crypto.getRandomValues(new Uint8Array(16));VAULT.key=await deriveKey(a,VAULT.salt,VAULT.it);
      let txt=legacy||null;DB=loadDB(txt);VAULT.on=true;audit('cofre criado');saveDB();await vaultFlush();try{localStorage.removeItem(LS_KEY);}catch(e){}startApp();}catch(e){m.textContent='Falha ao criar o cofre: '+e.message;$('#gok').disabled=false;}};
  $('#gok').onclick=go;g.addEventListener('keydown',e=>{if(e.key==='Enter')go();});}
function gateUnlock(msg){const g=gate(`<h1 id="gt">${esc(BRAND.nome)} ${esc(BRAND.produto)}</h1><p>${msg?esc(msg)+' ':''}Informe a senha para abrir os dados.</p>
  <div class="f"><label for="g1">Senha</label><input id="g1" type="password" autocomplete="current-password"></div><p class="gm" id="gmsg" role="alert"></p>
  <button class="btn pri" id="gok" style="width:100%">Entrar</button><p style="margin-top:12px"><a href="#" id="gforg">Esqueci a senha</a></p>`);
  const go=async()=>{const f=failGet(),now=Date.now(),m=$('#gmsg');if(f.until>now){m.textContent='Aguarde '+Math.ceil((f.until-now)/1000)+' s para tentar novamente.';return;}
    $('#gok').disabled=true;m.textContent='Verificando…';try{const raw=localStorage.getItem(VK);const r=await vTry(raw,$('#g1').value);VAULT.key=r.key;VAULT.salt=r.salt;VAULT.it=r.it;failSet({n:0,until:0});DB=loadDB(r.text);VAULT.on=true;audit('acesso');startApp();}
    catch(e){const n=(f.n||0)+1;const wait=n>=5?Math.min(900,30*Math.pow(2,n-5)):0;failSet({n,until:wait?Date.now()+wait*1000:0});m.textContent='Senha incorreta.'+(wait?' Nova tentativa em '+wait+' s.':'');$('#gok').disabled=false;$('#g1').select();}};
  $('#gok').onclick=go;g.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  $('#gforg').onclick=e=>{e.preventDefault();gate(`<h1 id="gt">Esqueci a senha</h1><p>A senha não pode ser recuperada. Se houver um <b>backup</b>, apague os dados deste navegador, crie nova senha e restaure o backup. Para confirmar a eliminação, digite <b>APAGAR</b>.</p><div class="f"><label for="g1">Confirmação</label><input id="g1" autocomplete="off"></div><div class="row"><button class="btn" id="gb">Voltar</button><button class="btn danger" id="gd">Apagar dados</button></div>`);
    $('#gb').onclick=()=>gateUnlock();$('#gd').onclick=()=>{if($('#g1').value.trim()!=='APAGAR')return;try{localStorage.removeItem(VK);localStorage.removeItem(FAILK);}catch(x){}gateSetup();};};}
function startApp(){gateClose();wrapAudit();['mousemove','keydown','click','scroll','touchstart'].forEach(ev=>document.addEventListener(ev,vaultIdleThrottle,{passive:true}));NAV={stack:[],cur:{name:'home',params:{}}};vaultIdle();render();}
let _idt=0;function vaultIdleThrottle(){const n=Date.now();if(n-_idt>5000){_idt=n;vaultIdle();}}

/* ---------- Conferência de regras ---------- */
function conferirRegras(){const out=[],P=DB.params,comp=DB.cfg.comp,c=DB.comps[comp]||{res:{}};
  const add=(sev,e,msg,base)=>out.push({sev,emp:e?e.nome:'',msg,base});
  DB.empregados.filter(e=>e.situacao!=='desligado').forEach(e=>{
    const sal=num(e.salario),pi=pisoDoEmpregado(e);
    if(pi&&sal<pi)add('erro',e,'Salário '+brl(sal)+' abaixo do piso da convenção ('+brl(pi)+').','CF, art. 7º, V; convenção coletiva vinculada');
    if(sal>0&&sal<P.salMin&&(e.tpSal||'mensal')==='mensal'&&num(e.horasSem||44)>=44)add('alerta',e,'Salário mensal inferior ao mínimo nacional ('+brl(P.salMin)+').','CF, art. 7º, IV **');
    if((num(e.insal)>0||e.peric)&&(!e.laudoNum||!e.laudoData))add('erro',e,'Adicional de insalubridade/periculosidade sem laudo registrado.','CLT, art. 195');
    if(e.j1236&&!e.cct)add('alerta',e,'Jornada 12x36 sem convenção coletiva vinculada; exige acordo individual escrito ou norma coletiva.','CLT, art. 59-A');
    if(e.estabTipo&&e.estabFim&&e.estabFim>=hojeISO())add('info',e,'Estabilidade provisória ('+e.estabTipo+') vigente até '+fmtData(e.estabFim)+'; a dispensa sem justa causa é bloqueada na rescisão.','ADCT, art. 10, II; Lei 8.213/1991, art. 118; CLT, art. 543, §3º');
    if(e.pensaoModo&&e.pensaoModo!=='fixo'&&!num(e.pensaoPct))add('erro',e,'Pensão alimentícia por percentual sem o percentual informado.','Decisão judicial ou acordo homologado');
    const r=c.res&&c.res[e.id];
    if(r&&r.margem){const m=r.margem;if(m.usoEmp>m.limEmp+0.005)add('erro',e,'Consignado de empréstimo ('+brl(m.usoEmp)+') excede a margem de '+P.consig.emp+'% ('+brl(m.limEmp)+').','Lei 10.820/2003, art. 2º, §2º **');
      if(m.usoCar>m.limCar+0.005)add('erro',e,'Consignado de cartão ('+brl(m.usoCar)+') excede a margem de '+P.consig.cartao+'% ('+brl(m.limCar)+').','Lei 10.820/2003, art. 2º, §2º **');}
    const sb=saldoBH(e.id);if(sb>0){const velho=(DB.bh||[]).filter(x=>x.empId===e.id&&num(x.h)>0).map(x=>x.data).sort()[0];if(velho&&(Date.now()-new Date(velho).getTime())/864e5>180)add('alerta',e,'Banco de horas com saldo de '+sb+' h e crédito há mais de seis meses.','CLT, art. 59, §5º (acordo individual) **');}
    if(sb<0)add('alerta',e,'Banco de horas com saldo negativo de '+Math.abs(sb)+' h; descontar na rescisão só nos limites da CLT, art. 477, §5º.','CLT, art. 477, §5º');
    if((num(e.insal)>0||e.peric)&&!(DB.sstRisco||[]).some(x=>x.empId===e.id))add('alerta',e,'Empregado com adicional de risco sem S-2240 cadastrado.','Layout eSocial S-1.3, evento S-2240');
    if(!(DB.sstAso||[]).some(x=>x.empId===e.id&&String(x.tpExame)==='0'))add('info',e,'Sem ASO admissional (S-2220) cadastrado.','NR-7, item 7.5.x **');});
  return out;}

function lerRetorno(xml){const d=new DOMParser().parseFromString(xml,'application/xml');if(d.querySelector('parsererror'))return null;
  const raiz=d.documentElement&&d.documentElement.firstElementChild;if(!raiz)return null;const nome=raiz.localName;
  const q=(el,n)=>el?Array.from(el.getElementsByTagName('*')).filter(x=>x.localName===n):[];
  const v1=(el,n)=>{const a=q(el,n)[0];return a?a.textContent.trim():'';};
  const somaN=(el,n)=>q(el,n).reduce((a,x)=>a+num(x.textContent),0);
  const per=v1(raiz,'perApur');
  if(nome==='evtBasesTrab')return{tipo:'S-5001',per,cpf:v1(raiz,'cpfTrab'),vrCpSeg:r2(somaN(q(raiz,'infoCpCalc')[0],'vrCpSeg')),vrDescSeg:r2(somaN(q(raiz,'infoCpCalc')[0],'vrDescSeg'))};
  if(nome==='evtIrrfBenef'){const cm=q(raiz,'consolidApurMen')[0]||q(raiz,'totApurMen')[0];return{tipo:'S-5002',per,cpf:v1(raiz,'cpfBenef'),vlrRendTrib:r2(somaN(cm,'vlrRendTrib')),vlrPrev:r2(somaN(cm,'vlrPrevOficial')),vlrCRMen:r2(somaN(cm,'vlrCRMen'))};}
  if(nome==='evtCS'){const cp=q(raiz,'infoCPSeg')[0];return{tipo:'S-5011',per,vrCpSeg:r2(somaN(cp,'vrCpSeg')),vrDescCP:r2(somaN(cp,'vrDescCP')),bases:r2(['vrBcCp00','vrBcCp15','vrBcCp20','vrBcCp25'].reduce((a,n)=>a+somaN(raiz,n),0)),fpas:q(raiz,'fpas').map(x=>x.textContent.trim()).filter((x,i,a)=>a.indexOf(x)===i).join(', ')};}
  return{tipo:'?',nome,per};}
function conciliar(comp){const c=DB.comps[comp],ret=(DB.ret||[]).filter(r=>r.per===comp),out=[];
  if(!c)return out;const tol=0.01;
  const linha=(esc2,item,calc,gov)=>out.push({esc2,item,calc:r2(calc),gov:r2(gov),dif:r2(gov-calc),ok:Math.abs(gov-calc)<=tol});
  const porCpf={};DB.empregados.forEach(e=>{if(c.res&&c.res[e.id])porCpf[onlyD(e.cpf)]=c.res[e.id];});
  ret.filter(r=>r.tipo==='S-5001').forEach(r=>{const x=porCpf[onlyD(r.cpf)];if(x)linha(r.cpf,'S-5001 — contribuição do segurado',x.inss,r.vrCpSeg);else out.push({esc2:r.cpf,item:'S-5001 — CPF sem cálculo na competência',calc:0,gov:r.vrCpSeg,dif:r.vrCpSeg,ok:false});});
  ret.filter(r=>r.tipo==='S-5002').forEach(r=>{const x=porCpf[onlyD(r.cpf)];if(x){linha(r.cpf,'S-5002 — IRRF retido',x.irrf+(x.irrfPlr||0),r.vlrCRMen);linha(r.cpf,'S-5002 — previdência oficial dedutível',x.inss,r.vlrPrev);}else out.push({esc2:r.cpf,item:'S-5002 — CPF sem cálculo na competência',calc:0,gov:r.vlrCRMen,dif:r.vlrCRMen,ok:false});});
  ret.filter(r=>r.tipo==='S-5011').forEach(r=>{const t=totaisComp(comp);linha('Empresa','S-5011 — contribuição dos segurados (total)',t.inss,r.vrCpSeg);});
  return out;}

/* ---------- Guias: espelho de conferência com vencimentos ---------- */
const FERIADOS_FIXOS=['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'];
/* Feriados móveis: calculados a partir da Páscoa (algoritmo de Meeus/Jones/Butcher, calendário gregoriano). */
function pascoa(a){const A=a%19,B=Math.floor(a/100),C=a%100,D=Math.floor(B/4),E=B%4,Fq=Math.floor((B+8)/25),G=Math.floor((B-Fq+1)/3),H=(19*A+B-D-G+15)%30,I=Math.floor(C/4),K=C%4,L=(32+2*E+2*I-H-K)%7,M=Math.floor((A+11*H+22*L)/451),mes=Math.floor((H+L-7*M+114)/31),dia=(H+L-7*M+114)%31+1;return new Date(Date.UTC(a,mes-1,dia));}
const FER_MOV_PAD={carnaval:true,sextaSanta:true,corpus:true};
function feriadosMoveis(a){const P=pascoa(a),add=n=>new Date(P.getTime()+n*864e5).toISOString().slice(0,10),c=Object.assign({},FER_MOV_PAD,(typeof DB!=='undefined'&&DB&&DB.cfg&&DB.cfg.ferMov)||{}),r=[];
  if(c.carnaval){r.push([add(-48),'Carnaval (segunda-feira)']);r.push([add(-47),'Carnaval (terça-feira)']);}
  if(c.sextaSanta)r.push([add(-2),'Sexta-feira Santa']);
  if(c.corpus)r.push([add(60),'Corpus Christi']);return r;}
function feriadosAno(a){const nome={'01-01':'Confraternização Universal','04-21':'Tiradentes','05-01':'Dia do Trabalho','09-07':'Independência','10-12':'Nossa Senhora Aparecida','11-02':'Finados','11-15':'Proclamação da República','11-20':'Consciência Negra','12-25':'Natal'},r=FERIADOS_FIXOS.map(k=>[a+'-'+k,nome[k]||'Feriado']);
  feriadosMoveis(a).forEach(x=>r.push(x));const ex=(typeof DB!=='undefined'&&DB&&DB.cfg&&DB.cfg.feriadosExtra)||[];
  ex.forEach(x=>{const d=String(x.d||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&+d.slice(0,4)===a)r.push([d,x.n||'Feriado local']);else if(/^\d{2}-\d{2}$/.test(d))r.push([a+'-'+d,x.n||'Feriado local']);});
  return r.sort((x,y)=>x[0]<y[0]?-1:1);}
function ehFeriado(d){const iso=d.toISOString().slice(0,10);return feriadosAno(+iso.slice(0,4)).some(x=>x[0]===iso);}
function diaUtilAnterior(d){while(d.getUTCDay()===0||d.getUTCDay()===6||ehFeriado(d))d=new Date(d.getTime()-864e5);return d;}
function vencGuia(comp,dia){const [a,m]=comp.split('-').map(Number);return diaUtilAnterior(new Date(Date.UTC(m===12?a+1:a,m===12?0:m,dia))).toISOString().slice(0,10);}

async function updFetch(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||12000);try{const r=await fetch(url,{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer',signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return r;}finally{clearTimeout(t);}}

const _fin=v=>typeof v==='number'&&isFinite(v);
function updMesclar(atual,novo,caminho){if(Array.isArray(atual)){if(!Array.isArray(novo)||!novo.length)throw new Error(caminho+': lista inválida');return novo.map((x,i)=>{const mod=atual[Math.min(i,atual.length-1)];return updMesclar(mod,x,caminho+'['+i+']');});}

  modal(`<h2>Atualizações do sistema</h2>

  ${UPDS.erro?'<div class="note err">'+esc(UPDS.erro)+'</div>':''}${UPDS.invalidos?'<div class="note err">'+UPDS.invalidos+' pacote(s) com assinatura inválida foram ignorados.</div>':''}
  ${pend.length?`<h3>Pendentes (${pend.length})</h3><div class="tw"><table class="t"><thead><tr><th>Nº</th><th>Tipo</th><th>Título</th><th>O que muda</th></tr></thead><tbody>${pend.map(p=>`<tr><td>${p.seq}</td><td>${esc(p.tipo)}</td><td><b>${esc(p.titulo)}</b><br><small>${esc(p.versao||'')} · ${esc(dtHora(p.publicadoEm))}</small><br><small>${esc(p.notas||'')}</small></td><td><small>${(prevs[p.seq]||[]).map(esc).join('<br>')||'—'}</small>${p.arquivos&&p.arquivos.length?'<br>'+arq(p):''}</td></tr>`).join('')}</tbody></table></div>
  <div class="row" style="margin-top:8px"><button class="btn pri" data-act="updAplicar">Aplicar ${pend.length} atualização(ões)</button></div><p class="sub">Parâmetros e rubricas alteram os cálculos. Confira o quadro “O que muda” e, se necessário, use “Desfazer” depois.</p>`:(UPDS.em&&!UPDS.erro?'<p>Nenhuma atualização pendente.</p>':'')}
  ${DB&&DB.updUndo?`<p>Última aplicação alterou parâmetros/rubricas (pacotes nº ${DB.updUndo.seqs.join(', ')}). <button class="btn" data-act="updDesfazer">Desfazer</button></p>`:''}
  ${apl.length?`<h3>Aplicadas recentemente</h3><div class="tw"><table class="t"><tbody>${apl.map(a=>`<tr><td>${a.seq}</td><td>${esc(a.tipo)}</td><td>${esc(a.titulo)}</td><td>${esc(dtHora(a.em))}</td></tr>`).join('')}</tbody></table></div>`:''}
  <details style="margin-top:10px"><summary>Servidor de atualizações</summary><div class="row"><div class="f" style="flex:1"><label for="updUrl">Endereço</label><input id="updUrl" value="${esc((DB&&DB.cfg&&DB.cfg.updUrl)||'')}" placeholder="${esc(UPD.url)}"></div><button class="btn" data-act="updSalvarUrl">Salvar</button></div></details>
  <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-act="updVerificar">Verificar novamente</button> <button class="btn" data-act="closeModal">Fechar</button></div>`);}

if(!window.__FP_NOGATE&&!window.__SVON)window.addEventListener('load',()=>{setTimeout(()=>{if(DB)updChecar(true);},4000);setInterval(()=>{if(DB)updChecar(true);},30*60e3);});

/* ===================== FICHA FINANCEIRA (consolidada, individualizada, rascunho) ===================== */
const FICH_MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const FICH_SEL=new Set();
let FICH_BUSCA='';
const fichAno=p=>String(p.ano||(DB.cfg.comp||'').slice(0,4)||new Date().getFullYear());
const fichMeses=(ano,rasc)=>FICH_MES.map((_,i)=>{const k=ano+'-'+String(i+1).padStart(2,'0'),c=DB.comps[k];const ok=c&&c.res&&Object.keys(c.res).length&&(rasc||c.status==='fechada');return ok?{k,c}:null;});
/* Monta as linhas (rubricas x 12 meses) para um conjunto de resultados por mês: getRes(mes)->res|null */
function fichLinhas(meses,getRes){const rub=new Map(),tot={prov:Array(12).fill(0),desc:Array(12).fill(0),liq:Array(12).fill(0),cp:Array(12).fill(0),fgtsB:Array(12).fill(0),fgts:Array(12).fill(0),irB:Array(12).fill(0),inss:Array(12).fill(0),irrf:Array(12).fill(0)};
  meses.forEach((m,i)=>{if(!m)return;const rs=getRes(m);rs.forEach(r=>{if(!r)return;(r.itens||[]).filter(x=>x.tp!==3).forEach(x=>{const key=x.cod+'|'+x.desc;let o=rub.get(key);if(!o){o={cod:x.cod,desc:x.desc,tp:x.tp,v:Array(12).fill(0)};rub.set(key,o);}o.v[i]=r2(o.v[i]+x.valor);});
    tot.prov[i]+=r.totProv;tot.desc[i]+=r.totDesc;tot.liq[i]+=r.liquido;tot.cp[i]+=r.baseCP||0;tot.fgtsB[i]+=r.baseFGTS||0;tot.fgts[i]+=r.fgts||0;tot.irB[i]+=(r.irrfInfo&&r.irrfInfo.base)||0;tot.inss[i]+=r.inss||0;tot.irrf[i]+=r.irrf||0;});});
  for(const k in tot)tot[k]=tot[k].map(r2);
  const lista=[...rub.values()].sort((a,b)=>a.tp-b.tp||String(a.cod).localeCompare(String(b.cod),'pt',{numeric:true}));return{lista,tot};}
const fichSoma=a=>r2(a.reduce((s,x)=>s+x,0));
function fichTabela(meses,L,rasc){const cel=v=>`<td style="text-align:right;white-space:nowrap">${v?brl(v):'<span style="color:#9aa5b1">–</span>'}</td>`;
  const lin=(o,neg)=>`<tr><td>${esc(o.cod||'')}</td><td>${esc(o.desc)}</td>${o.v.map(cel).join('')}<td style="text-align:right;font-weight:700">${brl(fichSoma(o.v))}</td></tr>`;
  const sec=(t,tp)=>{const ls=L.lista.filter(o=>o.tp===tp);return ls.length?`<tr><th colspan="15" style="text-align:left;background:#eef2f6">${t}</th></tr>${ls.map(lin).join('')}`:'';};
  const tl=(t,a,cls)=>`<tr style="font-weight:700;${cls||''}"><td colspan="2">${t}</td>${a.map(cel).join('')}<td style="text-align:right">${brl(fichSoma(a))}</td></tr>`;
  const st=m=>m?(m.c.status==='fechada'?'F':'<b title="Competência não fechada">R</b>'):'–';
  return `<table class="fich"><thead><tr><th style="width:46px">Cód.</th><th>Rubrica</th>${FICH_MES.map(x=>`<th>${x}</th>`).join('')}<th>Total</th></tr><tr><td colspan="2"><small>Situação (F = fechada${rasc?'; R = rascunho':''})</small></td>${meses.map(m=>`<td style="text-align:center"><small>${st(m)}</small></td>`).join('')}<td></td></tr></thead>
  <tbody>${sec('PROVENTOS',1)}${tl('Total de proventos',L.tot.prov)}${sec('DESCONTOS',2)}${tl('Total de descontos',L.tot.desc)}${tl('LÍQUIDO',L.tot.liq,'background:#e8f3ec')}
  <tr><th colspan="15" style="text-align:left;background:#eef2f6">BASES E ENCARGOS (informativo)</th></tr>${tl('Base INSS',L.tot.cp)}${tl('INSS retido',L.tot.inss)}${tl('Base FGTS',L.tot.fgtsB)}${tl('FGTS do mês',L.tot.fgts)}${tl('Base IRRF',L.tot.irB)}${tl('IRRF retido',L.tot.irrf)}</tbody></table>`;}
function fichCab(titulo,ano,rasc,extra){const E=DB.empresa;return `<div class="fch-hd"><div><h4 style="text-align:left;margin:0">${esc(E.razao||'')}</h4>CNPJ ${fmtCNPJ(E.cnpj||'')}</div><div style="text-align:right"><h4 style="margin:0">${titulo}</h4>Exercício: <b>${ano}</b>${rasc?'<br><b style="color:#b42318">RASCUNHO — sem valor oficial</b>':''}</div></div>${extra||''}`;}
function fichaConsolHTML(ano,rasc){const meses=fichMeses(ano,rasc);const L=fichLinhas(meses,m=>Object.values(m.c.res));const n=Math.max(0,...meses.map(m=>m?Object.keys(m.c.res).length:0));
  return `<div class="fch ${rasc?'fch-r':''}">${fichCab('FICHA FINANCEIRA CONSOLIDADA',ano,rasc,`<div style="margin:6px 0"><small>Todos os empregados da competência (até ${n} no mês de maior movimento). Valores somados por rubrica.</small></div>`)}${meses.some(Boolean)?fichTabela(meses,L,rasc):'<div class="note">Nenhuma competência '+(rasc?'calculada':'fechada')+' em '+ano+'.</div>'}</div>`;}
function fichaEmpHTML(e,ano,rasc){const meses=fichMeses(ano,rasc).map(m=>m&&m.c.res[e.id]?m:null);const L=fichLinhas(meses,m=>[m.c.res[e.id]]);const cg=byId(DB.cargos,e.cargo)||{},lo=byId(DB.lotacoes,e.lotacao)||{};
  const id=`<table style="margin:6px 0"><tr><td><small>Matrícula</small><br><b>${esc(e.mat)}</b></td><td><small>Nome</small><br><b>${esc(e.nome)}</b></td><td><small>CPF</small><br>${fmtCPF(e.cpf)}</td><td><small>Cargo / CBO</small><br>${esc(cg.nome||'')} ${esc(cg.cbo||'')}</td><td><small>Lotação</small><br>${esc(lo.desc||'')}</td><td><small>Admissão</small><br>${fmtData(e.admissao)}</td></tr></table>`;
  return `<div class="fch ${rasc?'fch-r':''}" style="page-break-after:always">${fichCab('FICHA FINANCEIRA INDIVIDUAL',ano,rasc,id)}${meses.some(Boolean)?fichTabela(meses,L,rasc):'<div class="note">Sem competências '+(rasc?'calculadas':'fechadas')+' para este empregado em '+ano+'.</div>'}</div>`;}
const fichEmpsAno=(ano,rasc)=>{const ids=new Set();fichMeses(ano,rasc).forEach(m=>m&&Object.keys(m.c.res).forEach(i=>ids.add(i)));return DB.empregados.filter(e=>ids.has(e.id));};
const fichNorm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function fichFiltrados(ano,rasc){const q=fichNorm(FICH_BUSCA).trim(),qd=q.replace(/\D/g,'');return fichEmpsAno(ano,rasc).filter(e=>!q||fichNorm(e.nome).includes(q)||fichNorm(e.mat).includes(q)||(qd&&String(e.cpf||'').replace(/\D/g,'').includes(qd)));}
function fichLista(ano,rasc){const ls=fichFiltrados(ano,rasc);if(!ls.length)return '<div class="note">Nenhum empregado encontrado com movimento '+(rasc?'calculado':'fechado')+' em '+ano+'.</div>';
  return `<table><thead><tr><th style="width:34px"><input type="checkbox" id="fichAll" title="Selecionar todos os listados"></th><th>Matrícula</th><th>Nome</th><th>CPF</th><th>Situação</th></tr></thead><tbody>${ls.map(e=>`<tr><td><input type="checkbox" class="fichChk" value="${e.id}" ${FICH_SEL.has(e.id)?'checked':''}></td><td>${esc(e.mat)}</td><td>${esc(e.nome)}</td><td>${fmtCPF(e.cpf)}</td><td>${esc(e.situacao||'')}</td></tr>`).join('')}</tbody></table>`;}
SC.ficha={view(p){const ano=fichAno(p),modo=p.modo||'consol',alvo=p.alvo||'consol',rasc=modo==='rasc';
  const tab=(k,l)=>`<a class="btn sm ${modo===k?'pri':''}" data-act="fichModo" data-arg="${k}">${l}</a>`;
  const anoI=`<b>Exercício:</b> <input type="number" id="fichAno" value="${ano}" min="2000" max="2100" style="width:84px;padding:7px 9px;border:1px solid #c7d0d9;border-radius:6px;font:inherit">`;
  let corpo='';
  if(modo==='consol')corpo=fichaConsolHTML(ano,false);
  else if(modo==='rasc'&&alvo==='consol')corpo=`<div class="note">Rascunho: inclui competências calculadas e ainda não fechadas, assinaladas com “R”. Documento de conferência, sem valor oficial.</div>`+fichaConsolHTML(ano,true);
  else{const rs=modo==='rasc';const sel=[...FICH_SEL].filter(id=>byId(DB.empregados,id));
    corpo=`${rs?`<div class="note">Rascunho: inclui competências calculadas e ainda não fechadas. Documento de conferência, sem valor oficial.</div>`:''}<div class="row" style="margin-bottom:10px"><b>Localizar empregado:</b><input id="fichBusca" placeholder="Nome, matrícula ou CPF" value="${esc(FICH_BUSCA)}" style="padding:7px 9px;border:1px solid #c7d0d9;border-radius:6px;font:inherit;min-width:260px"><span id="fichCnt">${badge(sel.length+' selecionado(s)',sel.length?'ok':'gray')}</span><button class="btn sm" data-act="fichLimpa">Limpar seleção</button></div><div id="fichLista" style="max-height:300px;overflow:auto;margin-bottom:12px">${fichLista(ano,rs)}</div>
    ${sel.length?`<h3 style="margin:10px 0">Pré-visualização (${sel.length} ficha(s))</h3>${sel.map(id=>fichaEmpHTML(byId(DB.empregados,id),ano,rs)).join('')}`:'<div class="note">Selecione um ou mais empregados na lista para visualizar e imprimir as fichas individuais.</div>'}`;}
  return `<h1>Ficha Financeira</h1><p class="sub">Evolução anual das rubricas por competência, com bases e encargos. Fichas oficiais usam apenas competências fechadas.</p>
  <div class="row" style="margin-bottom:12px">${anoI}${tab('consol','Ficha consolidada')}${tab('indiv','Ficha individualizada por empregado')}${tab('rasc','Rascunho')}${modo==='rasc'?`<span>Rascunho de:</span>${`<a class="btn sm ${alvo==='consol'?'pri':''}" data-act="fichAlvo" data-arg="consol">consolidada</a><a class="btn sm ${alvo==='indiv'?'pri':''}" data-act="fichAlvo" data-arg="indiv">individual</a>`}`:''}</div>${corpo}`;},
  mount(p){const a=$('#fichAno');a&&a.addEventListener('change',()=>refresh({ano:a.value}));
    const rs=(p.modo||'consol')==='rasc',ano=fichAno(p);
    const bind=()=>{const all=$('#fichAll');all&&all.addEventListener('change',()=>{document.querySelectorAll('.fichChk').forEach(c=>{c.checked=all.checked;all.checked?FICH_SEL.add(c.value):FICH_SEL.delete(c.value);});});};
    const b=$('#fichBusca');if(b){b.addEventListener('input',()=>{FICH_BUSCA=b.value;$('#fichLista').innerHTML=fichLista(ano,rs);a11yNomear($('#fichLista'));bind();});bind();}},
  actions:p=>[{label:'👁 Visualizar / atualizar',act:'fichVer'},{label:'🖨 Imprimir',act:'fichPrint',cls:'pri',key:'save'}]};
document.addEventListener('change',fichChk);
function fichChk(ev){const c=ev.target;if(!c||!c.classList||!c.classList.contains('fichChk'))return;c.checked?FICH_SEL.add(c.value):FICH_SEL.delete(c.value);}
ACT.fichModo=el=>refresh({modo:el.dataset.arg});
ACT.fichAlvo=el=>refresh({alvo:el.dataset.arg});
ACT.fichLimpa=()=>{FICH_SEL.clear();refresh();};
ACT.fichVer=()=>refresh();
ACT.fichPrint=()=>{const p=NAV.cur.params,ano=fichAno(p),modo=p.modo||'consol',alvo=p.alvo||'consol',rasc=modo==='rasc';let h='';
  if(modo==='consol'||(rasc&&alvo==='consol'))h=fichaConsolHTML(ano,rasc);
  else{const ids=[...FICH_SEL].filter(id=>byId(DB.empregados,id));if(!ids.length){toast('Selecione ao menos um empregado.','err');return;}h=ids.map(id=>fichaEmpHTML(byId(DB.empregados,id),ano,rasc)).join('');}
  $('#printarea').innerHTML=h;document.body.classList.add('printing');
  try{window.print();}catch(e){toast('Impressão indisponível neste ambiente. Abra o arquivo HTML no navegador para imprimir ou salvar em PDF.','err');}
  setTimeout(()=>{document.body.classList.remove('printing');$('#printarea').innerHTML='';},800);};

/* ===================== MULTIEMPRESA: Novo cadastro, trocar e excluir ===================== */
/* A empresa ativa é o próprio DB; as demais ficam em DB._emps como instantâneos (todos dentro do mesmo cofre cifrado). */
function empSnap(){const c=Object.assign({},DB);delete c._emps;delete c.audit;return JSON.stringify(c);}
function empArquivar(){if(!DB.empresa)return;DB._id=DB._id||uid('c');const l=(DB._emps=DB._emps||[]).filter(x=>x.id!==DB._id);l.push({id:DB._id,cnpj:DB.empresa.cnpj||'',razao:DB.empresa.razao||'',snap:empSnap(),em:agoraISO(),ex:!!DB._exemplo});DB._emps=l;}
function empTroca(novo,resto){novo._emps=resto;novo.audit=DB.audit;VAULT.audit=DB.audit;DB=novo;NAV.stack=[];}
ACT.empNovo=()=>modalConfirm('Será aberto um cadastro em branco para uma nova empresa. O cadastro atual'+(DB.empresa?' (<b>'+esc(DB.empresa.razao||'')+'</b>)':'')+' é preservado integralmente e poderá ser reaberto na lista “Empresas cadastradas”. Os parâmetros legais e a configuração de ambiente do eSocial são mantidos.',()=>{
  empArquivar();const n=emptyDB();n.params=DB.params;n.cfg=Object.assign({},DB.cfg,{comp:compAtual()});n._id=uid('c');empTroca(n,DB._emps);audit('empresa.novo','novo cadastro iniciado');saveDB();go('empresa');toast('Novo cadastro iniciado. Preencha os dados da empresa.','ok');},{title:'Novo cadastro de empresa',yes:'Abrir cadastro em branco'});
ACT.empTrocar=el=>{const id=el.dataset.arg;const alvo=(DB._emps||[]).find(x=>x.id===id);if(!alvo)return;empArquivar();const resto=DB._emps.filter(x=>x.id!==id);const n=loadDB(alvo.snap);n._id=id;empTroca(n,resto);audit('empresa.trocar',alvo.cnpj);saveDB();go('home');toast('Empresa aberta: '+alvo.razao,'ok');};
ACT.empJaAberta=()=>toast('Esta empresa já está aberta. Para abrir outra, clique no nome dela na lista.','ok');
ACT.empAbrirConf=el=>{const x=(DB._emps||[]).find(y=>y.id===el.dataset.arg);if(!x)return;modalConfirm('<b>Deseja abrir a empresa cadastrada?</b><br><br>'+esc(x.razao||'(sem razão social)')+(x.cnpj?'<br>CNPJ '+fmtCNPJ(x.cnpj):'')+'<br><br>A empresa em uso'+(DB.empresa&&DB.empresa.razao?' (<b>'+esc(DB.empresa.razao)+'</b>)':'')+' é preservada integralmente e continuará na lista.',()=>ACT.empTrocar(el),{title:'Abrir empresa',yes:'Sim, abrir'});};
function empExcluirModal(id){const ativa=!id;const alvo=ativa?{razao:(DB.empresa||{}).razao||'(cadastro em branco)',cnpj:(DB.empresa||{}).cnpj||''}:(DB._emps||[]).find(x=>x.id===id);if(!alvo)return;
  const env=ativa?DB.eventos.filter(e=>e.status==='processado').length:0;
  modal(`<p>Será excluído, de forma <b>irreversível</b>, todo o cadastro de <b>${esc(alvo.razao)}</b>${alvo.cnpj?' (CNPJ '+fmtCNPJ(alvo.cnpj)+')':''}: empregados, folhas, eventos, férias, rescisões e demais registros locais.</p>
  ${env?`<div class="note err">Há ${env} evento(s) já processado(s) pelo eSocial. A exclusão remove apenas os registros deste sistema; <b>não</b> cancela nem exclui nada no ambiente nacional do eSocial. Guarde os recibos e a biblioteca de eventos antes de prosseguir.</div>`:''}
  <div class="note err" role="alert"><b>Deseja realmente excluir este cadastro?</b><br>Este ato é <b>irreversível</b>: depois de confirmado, os dados não poderão ser recuperados, a não ser por um backup feito antes.</div>
  <p class="sub">Recomenda-se gerar o backup cifrado antes (menu Sistema › Backup e dados).</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="closeModal" id="exNao">Não, cancelar</button><button class="btn pri" id="exOk" style="background:#b42318;border-color:#b42318">Sim, excluir definitivamente</button></div>`,{title:'Excluir cadastro de empresa'});
  $('#exNao').focus();
  $('#exOk').onclick=()=>{closeModal();audit('empresa.excluir',(alvo.cnpj||'')+' '+(ativa?'(ativa)':'(arquivada)'));
    if(!ativa){DB._emps=DB._emps.filter(x=>x.id!==id);saveDB();refresh();toast('Cadastro excluído.','ok');return;}
    const resto=(DB._emps||[]).slice();let n;if(resto.length){const p=resto.shift();n=loadDB(p.snap);n._id=p.id;}else{n=emptyDB();n.params=DB.params;n.cfg=Object.assign({},DB.cfg,{comp:compAtual()});n._id=uid('c');}
    empTroca(n,resto);saveDB();go(n.empresa?'home':'empresa');toast('Cadastro excluído.','ok');};}
ACT.empExcluir=el=>empExcluirModal(el&&el.dataset&&el.dataset.arg||'');
/* lista na tela da empresa + botões na barra */
const _empView=SC.empresa.view;
SC.empresa.view=function(p){const l=(DB._emps||[]);const ativa=DB.empresa;

function hxDiffEmp(){DB.hSnap=DB.hSnap||{};DB.hAlt=DB.hAlt||[];const ts=new Date().toISOString();
  (DB.empregados||[]).forEach(e=>{const cur=hxSnap(e),old=DB.hSnap[e.id];if(!old){DB.hSnap[e.id]=cur;DB.hAlt.push({id:uid('h'),empId:e.id,ts,campo:'',de:'',para:'Registro inicial no controle de histórico'});return;}
    let mud=false;const ks=new Set(Object.keys(cur).concat(Object.keys(old)));ks.forEach(k=>{if(old[k]===cur[k]||(old[k]===undefined&&cur[k]===''))return;mud=true;

function hxSoma(empId){const L=(DB.atest||[]).filter(a=>a.empId===empId&&['d','at','ai'].includes(a.tipo)&&a.ini&&Math.floor(Number(a.dias))>0).sort((x,y)=>x.ini<y.ini?-1:x.ini>y.ini?1:0);const est={},out=[];
  L.forEach(a=>{const k=(String(a.grupo||'').trim()||String(a.cid||'').trim().slice(0,3)).toUpperCase()||('#'+a.id);const s=est[k]||(est[k]={fim:'',acum:0,n:0});
    const d0=Math.floor(Number(a.dias)),fimA=hxAdd(a.ini,d0-1);let ini=a.ini,ov=0;if(s.fim&&ini<=s.fim){ov=hxDiff(ini,s.fim)+1;ini=hxAdd(s.fim,1);}
    const dias=Math.max(0,d0-ov);let gap=null,cont=false;if(s.fim){gap=hxDiff(hxAdd(s.fim,1),ini);cont=gap<=60;}
    if(!cont){s.acum=0;s.n++;}const antes=s.acum;let emp=0,inss=0;if(a.tipo==='ai')inss=dias;else{emp=Math.max(0,Math.min(dias,15-antes));inss=dias-emp;}
    s.acum=antes+dias;if(!s.fim||fimA>s.fim)s.fim=fimA;
    out.push({a,key:k,semChave:k[0]==='#',cad:s.n,antes,emp,inss,inssDesde:inss>0&&a.tipo!=='ai'?hxAdd(ini,emp):'',gap,cont,fim:fimA,ac:s.acum});});
  return out;}
const hxSomaTxt=r=>{if(!['d','at','ai'].includes(r.tipo))return '<span style="color:var(--mut)">não soma (art. 75 trata de incapacidade)</span>';const x=hxSoma(r.empId).find(y=>y.a.id===r.id);if(!x)return '';
  const p=[];if(x.semChave)p.push('<small>sem CID/grupo: não somado a outros</small>');else if(x.cont&&x.antes>0)p.push('soma com anteriores ('+x.antes+' d)');
  if(r.tipo==='ai')p.push('INSS: '+x.inss+' d');else{p.push('empresa: '+x.emp+' d');if(x.inss>0)p.push('<b style="color:#b42318">INSS a partir de '+fmtData(x.inssDesde)+' ('+x.inss+' d)</b>');}return p.join(' · ');};

function hxLinha(e){const L=[];const P=(d,cat,tit,det)=>{if(d)L.push({d,cat,tit,det:det||''});};

  (DB.movs||[]).filter(x=>x.empId===e.id).forEach(x=>P(x.data,'ctr',({'S-2206':'Alteração contratual/salarial','S-2230':'Afastamento (movimentação)','S-2299':'Desligamento (movimentação)'})[x.tipo]||x.tipo,x.det));

  (DB.hCurso||[]).filter(x=>x.empId===e.id).forEach(x=>P(x.dtFim,'cur','Curso: '+x.curso,[x.entidade,x.ch?x.ch+' h':'',x.validade?'validade '+fmtData(x.validade):''].filter(Boolean).join(' · ')));
  (DB.sstAso||[]).filter(x=>x.empId===e.id).forEach(x=>P(x.dtAso,'aso','ASO '+(HX_ASO[x.tpExame]||''),(x.resAso==='2'?'Inapto':'Apto')+(x.medNome?' · Dr(a). '+x.medNome:'')));
  (DB.sstCat||[]).filter(x=>x.empId===e.id).forEach(x=>P(x.dtAcid,'aso','CAT — acidente de trabalho',x.diag||x.cid||''));
  (DB.atest||[]).filter(x=>x.empId===e.id).forEach(x=>{const n=Math.floor(Number(x.dias))||0;P(x.ini,'afa',HX_ATIPO[x.tipo]||'Afastamento',n+' dia(s) até '+fmtData(hxAdd(x.ini,Math.max(0,n-1)))+(x.cid?' · CID '+x.cid:'')+(x.obs?' · '+x.obs:''));});

  return L.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);}

SC.integr={view(){const C=DB.cfg;
  return `<h1>Webservice do eSocial / Integração</h1><p class="sub">Configuração do ambiente e do serviço de transmissão.</p>
  <div data-form id="f"><div class="card"><h2>Ambiente e modo de envio</h2><div class="grid">${F('Ambiente do eSocial','ambiente',C.ambiente,{t:'select',opts:[['2','2 – Produção restrita (testes)'],['1','1 – Produção (valor jurídico)']],w:4})+F('Modo de envio','modo',C.modo,{t:'select',opts:[['sim','Simulação local (sem transmissão)'],['gw','Webservice via gateway']],w:4})+F('URL do gateway de integração','gateway',C.gateway,{w:4,ph:'https://seu-servidor/esocial'})}</div></div></div>
  <div class="card"><h2>Como a transmissão real funciona</h2><p>O eSocial exige <b>comunicação segura com certificado digital (e-CNPJ ou e-CPF de procurador)</b> e <b>assinatura XMLDSig</b> em cada evento — operações que um navegador não executa com segurança nem consegue sempre realizar por restrição de CORS. Por isso este sistema separa as responsabilidades:</p>
  <p class="sub"><b>Referência normativa:</b> ${esc(LEIAUTE_REF)}. Antes de transmitir em produção, confirme no Portal do eSocial se os esquemas XSD correspondem à etapa em vigor.</p>
  <p><b>1. Este sistema (front-end)</b> cadastra, calcula, gera o XML de cada evento (leiaute S-1.3), mantém a biblioteca e controla status, recibo e retificações.<br><b>2. Gateway de integração (servidor seu)</b> valida o XML contra os XSD oficiais, assina com o certificado A1, monta o <span class="mono">envioLoteEventos</span> e chama os serviços SOAP do eSocial.</p>
  <h3>Serviços do eSocial (conferir no Manual de Orientação do Desenvolvedor, seção “URL dos Web Services”)</h3>
  <div class="tw"><table class="t"><tbody><tr><td>Envio de lote — produção restrita</td><td class="mono">https://webservices.producaorestrita.esocial.gov.br/servicos/empregador/enviarloteeventos/WsEnviarLoteEventos.svc</td></tr><tr><td>Consulta de lote — produção restrita</td><td class="mono">https://webservices.producaorestrita.esocial.gov.br/servicos/empregador/consultarloteeventos/WsConsultarLoteEventos.svc</td></tr><tr><td>Envio / consulta — produção</td><td class="mono">https://webservices.envio.esocial.gov.br/servicos/empregador/… (mesmos nomes de serviço)</td></tr></tbody></table></div>
  <h3 style="margin-top:14px">Contrato que o gateway deve expor para este sistema</h3>
  <pre class="xml">POST {gateway}/lotes
{ "ambiente": 2, "grupo": 1|2|3,           // 1 tabelas/iniciais · 2 não periódicos · 3 periódicos
  "empregador": {"tpInsc":1,"nrInsc":"CNPJ14"},
  "eventos": [ {"id":"ID1…","tipo":"S-1200","xml":"&lt;eSocial …&gt;"} ]  // até 50 por lote
}  →  200 {"protocolo":"…"}

GET {gateway}/lotes/{protocolo}
  →  {"status":"processando"|"processado",
      "eventos":[{"id":"ID1…","situacao":"sucesso"|"rejeitado","recibo":"…",
                  "ocorrencias":[{"codigo":"…","descricao":"…"}]}]}

GET {gateway}/status   →  200 (teste de conexão)</pre>
  <div class="note">Em páginas publicadas como artefato do Claude o navegador bloqueia chamadas a outros domínios; o modo webservice funciona quando o arquivo HTML é aberto localmente ou hospedado no seu domínio (com CORS liberado no gateway). Antes de usar em <b>produção</b>, valide todos os eventos em produção restrita.</div></div>`;},
  actions:()=>[{label:'Testar conexão',act:'intTest'},{label:'💾 Salvar configuração',act:'intSave',cls:'pri',key:'save'}]};
ACT.intSave=()=>{const o=readForm($('#f'));DB.cfg.ambiente=Number(o.ambiente);DB.cfg.modo=o.modo;DB.cfg.gateway=o.gateway;if(o.modo==='gw'&&!o.gateway){toast('Informe a URL do gateway.','err');return;}saveDB();DIRTY=false;toast('Configuração salva.','ok');refresh();};

  if(!t&&el.closest('td')){const td=el.closest('td'),tb=td.closest('table'),th=tb&&tb.tHead&&tb.tHead.rows[0]&&tb.tHead.rows[0].cells[td.cellIndex];t=(th?th.textContent:'')+(td.closest('tr').cells[1]?' — '+td.closest('tr').cells[1].textContent:'');}
  if(!t){const row=el.closest('.row,.card,div');let p=el.previousElementSibling;while(p&&!t){if(/^(B|LABEL|SPAN)$/.test(p.tagName)&&p.textContent.trim().length>1)t=p.textContent;p=p.previousElementSibling;}if(!t&&row){const b=row.querySelector('b');if(b)t=b.textContent;}}
  if(!t)t=el.placeholder||el.name||(el.type==='checkbox'?'Selecionar':'Campo');

/* ===================== RUBRICAS: INCLUIR, PAUSAR E EXCLUIR ===================== */
/* Rubricas do sistema (salário, INSS, IRRF, FGTS, férias, 13º etc.) são estruturais: o cálculo depende delas e não podem ser pausadas nem excluídas.
   Rubricas incluídas pelo usuário (custom) entram no cálculo conforme vigência, público e pausas. Pausa vale a partir da competência indicada
   (inclusive); competências anteriores permanecem como foram calculadas. Excluir apaga a rubrica; se já foi usada em folha calculada, a exclusão
   é barrada (o histórico e os XML dependem dela) e a pausa é o caminho. */
const rubMesAnt=c=>compAdd(c,-1);
const rubUsadaEv=r=>rubricaUsada(r.sys)||(DB.eventos||[]).some(e=>e.tipo==='S-1010'&&e.gen&&e.gen.args&&e.gen.args.id===r.sys);
const rubSit=r=>{if(!r.custom)return badge('Sistema','gray');const hoje0=compAtual();const pz=(r.pausas||[]).find(p=>!p.ate);
  if(pz)return badge('Pausada desde '+pz.de.split('-').reverse().join('/'),'warn');
  if(r.fim&&r.fim<hoje0)return badge('Encerrada','gray');return badge('Ativa','ok');};

  cfg.cols=cfg.cols.slice();

ACT.rubPausar=el=>{const r=DB.rubricas.find(x=>x.sys===el.dataset.id);if(!r||!r.custom)return;
  rubModalMes('Pausar rubrica '+r.cod+' — '+r.desc,'A rubrica deixa de ser calculada <b>a partir</b> da competência escolhida (inclusive). Competências anteriores permanecem como estão. Você pode retomá-la depois.',compAtual(),'Pausar',v=>{
    const calc=Object.keys(DB.comps||{}).filter(k=>k>=v&&DB.comps[k].res&&Object.keys(DB.comps[k].res).length);
    const go=()=>{r.pausas=(r.pausas||[]).filter(p=>!(p.de>=v&&!p.ate));r.pausas.push({de:v});audit('rubrica pausada',r.cod+' desde '+v);saveDB();refresh();toast('Rubrica pausada a partir de '+v.split('-').reverse().join('/')+'.','ok');};
    if(calc.length)modalConfirm('Já existem competências calculadas a partir de '+v+' ('+calc.join(', ')+'). Elas só mudarão se você recalcular a folha; as fechadas devem ser reabertas antes. Pausar mesmo assim?',go,{yes:'Pausar'});else go();});};
ACT.rubRetomar=el=>{const r=DB.rubricas.find(x=>x.sys===el.dataset.id);if(!r||!r.custom)return;const pz=(r.pausas||[]).find(p=>!p.ate);if(!pz)return;
  rubModalMes('Retomar rubrica '+r.cod+' — '+r.desc,'A rubrica volta a ser calculada <b>a partir</b> da competência escolhida (inclusive). Pausada desde '+pz.de.split('-').reverse().join('/')+'.',compAtual()>pz.de?compAtual():pz.de,'Retomar',v=>{
    if(v<=pz.de)r.pausas=r.pausas.filter(p=>p!==pz);else pz.ate=rubMesAnt(v);
    audit('rubrica retomada',r.cod+' desde '+v);saveDB();refresh();toast('Rubrica retomada a partir de '+v.split('-').reverse().join('/')+'.','ok');});};

   cada usuário entra com e-mail, senha e código MFA, e o servidor — não o navegador — decide o que cada um pode ler e gravar. */

 sstCat:'sst',sstAso:'sst',sstRisco:'sst',saude:'sst',hist:'historico',hAdv:'historico',hCurso:'historico',atest:'historico',lanc:'folha',folha:'folha',d13:'folha',holerite:'folha',ficha:'folha',ferias:'ferias',resc:'ferias',
 relEmp:'relatorios',relat:'relatorios',painel:'relatorios',cmp:'relatorios',envio:'esocial',biblioteca:'esocial',retornos:'esocial',guias:'esocial',integr:'esocial',params:'config',backup:'config',marca:'config',usuarios:'usuarios',auditSrv:'auditoria'};

async function svApi(m,p,b,opt){const h={'Content-Type':'application/json'};if(SV.tok)h.Authorization='Bearer '+SV.tok;let r;
  try{r=await fetch(FPAPI+p,{method:m,headers:h,body:b===undefined?undefined:JSON.stringify(b)});}catch(e){return{s:0,j:{erro:'Sem conexão com o servidor.'}};}
  let j={};try{j=await r.json();}catch(e){}if(r.status===401&&SV.tok&&!(opt&&opt.semLogout)){SV.tok=null;svTelaLogin('Sessão expirada. Entre novamente.');}return{s:r.status,j};}

const svBrand=()=>`<h1 id="gt">${esc(BRAND.nome)} ${esc(BRAND.produto)}</h1>`;
function svTelaLogin(msg,pedeCodigo,email){SV.t&&clearTimeout(SV.t);DB=null;$('#main').innerHTML='';$('#side').innerHTML='';$('#bar').innerHTML='';$('#topemp').textContent='Acesso restrito';
  gate(`${svBrand()}<p>${msg?'<b>'+esc(msg)+'</b><br>':''}Entre com seu usuário e senha.</p><div class="f"><label for="sve">E-mail</label><input id="sve" type="email" autocomplete="username" value="${esc(email||'')}"></div><div class="f"><label for="svs">Senha</label><input id="svs" type="password" autocomplete="current-password"></div>${pedeCodigo?'<div class="f"><label for="svc">Código do aplicativo autenticador (6 dígitos)</label><input id="svc" inputmode="numeric" autocomplete="one-time-code" maxlength="7"></div>':''}<div class="row" style="margin-top:10px"><button class="btn pri" id="svok">Entrar</button></div><p id="sver" class="note err" style="display:none"></p>`);
  const go2=async()=>{const e=$('#sve').value.trim(),s=$('#svs').value,c=$('#svc')?$('#svc').value:'';$('#svok').disabled=true;const r=await svApi('POST','/api/auth/login',{email:e,senha:s,codigo:c||undefined},{semLogout:1});$('#svok').disabled=false;
    if(r.s!==200){const x=$('#sver');x.textContent=r.j.erro||'Falha no acesso.';x.style.display='block';return;}
    if(r.j.exigeCodigo){svTelaLogin('',true,e);$('#svs').value=s;const c2=$('#svc');c2&&c2.focus();return;}
    SV.tok=r.j.token;SV.user=r.j.usuario;

function svTelaSenha(atual,obrig){gate(`${svBrand()}<p>${obrig?'Primeiro acesso: defina uma nova senha.':'Alterar senha.'} Mínimo de 12 caracteres, com ao menos três entre minúscula, maiúscula, número e símbolo.</p>${atual===undefined?'<div class="f"><label for="sva">Senha atual</label><input id="sva" type="password" autocomplete="current-password"></div>':''}<div class="f"><label for="svn">Nova senha</label><input id="svn" type="password" autocomplete="new-password"></div><div class="f"><label for="svn2">Repita a nova senha</label><input id="svn2" type="password" autocomplete="new-password"></div><div class="row" style="margin-top:10px"><button class="btn pri" id="svok">Salvar senha</button>${obrig?'':'<button class="btn" id="svcx">Cancelar</button>'}</div><p id="sver" class="note err" style="display:none"></p>`);
  const x=m=>{const e=$('#sver');e.textContent=m;e.style.display='block';};
  const f=async()=>{const n=$('#svn').value;if(n!==$('#svn2').value)return x('As senhas não coincidem.');const a=atual!==undefined?atual:$('#sva').value;const r=await svApi('POST','/api/auth/senha',{atual:a,nova:n});if(r.s!==200)return x(r.j.erro||'Falha.');
    if(r.j.escopo==='mfa')return svTelaMfa();if(obrig)return svEntrar();gateClose();toast('Senha alterada.','ok');};
  $('#svok').onclick=f;gate_enter(f);const c=$('#svcx');if(c)c.onclick=()=>gateClose();}
async function svTelaMfa(){const r=await svApi('POST','/api/auth/mfa/iniciar',{});if(r.s!==200){svTelaLogin(r.j.erro||'Falha ao iniciar o MFA.');return;}
  gate(`${svBrand()}<p>O acesso exige verificação em duas etapas. No aplicativo autenticador (Google Authenticator, Microsoft Authenticator, Authy etc.), adicione uma conta <b>manualmente</b> com a chave abaixo (tipo: baseada em tempo) e informe o código de 6 dígitos.</p><p><b>Chave:</b> <code id="svk" style="font-size:1.1em;letter-spacing:2px;user-select:all">${esc(r.j.segredo)}</code></p><p class="sub">Guarde a chave em local seguro: sem ela e sem o aplicativo, só o administrador pode reiniciar seu acesso.</p><div class="f"><label for="svc">Código de 6 dígitos</label><input id="svc" inputmode="numeric" maxlength="7"></div><div class="row" style="margin-top:10px"><button class="btn pri" id="svok">Ativar e entrar</button></div><p id="sver" class="note err" style="display:none"></p>`);
  const f=async()=>{const q=await svApi('POST','/api/auth/mfa/confirmar',{codigo:$('#svc').value});if(q.s!==200){const e=$('#sver');e.textContent=q.j.erro||'Código inválido.';e.style.display='block';return;}svEntrar();};$('#svok').onclick=f;gate_enter(f);}

async function svEntrar(){const r=await svApi('GET','/api/auth/eu');if(r.s!==200){svTelaLogin(r.j.erro||'Falha no acesso.');return;}SV.user=r.j.usuario;SV.conta=r.j.conta;SV.lic=r.j.conta.estado;
  const ls=await svApi('GET','/api/empresas');const es=ls.j.empresas||[];
  const pode=SV.user.perfil==='admin'||(+(SV.user.perms||{}).cadastros||0)>=3;
  const lista=es.map(e=>`<button class="btn" data-act="svAbrir" data-id="${esc(e.id)}" style="display:block;width:100%;text-align:left;margin:4px 0"><b>${esc(e.nome||'(sem nome)')}</b>${e.cnpj?' · '+esc(fmtCNPJ(e.cnpj)):''} · ${e.vinculos} vínculo(s)</button>`).join('');
  gate(`${svBrand()}<p>Olá, <b>${esc(SV.user.nome)}</b>. ${es.length?'Escolha a empresa:':'Nenhuma empresa disponível para o seu usuário.'}</p>${lista}${pode?'<div class="row" style="margin-top:10px"><button class="btn pri" data-act="svNovaEmp">＋ Nova empresa</button></div>':''}<div class="row" style="margin-top:8px"><button class="btn" data-act="svSair">Sair</button></div><p class="sub">Plano ${esc(SV.conta.plano)} · ${SV.conta.uso.empresas}/${SV.conta.limites.empresas} empresas · ${SV.conta.uso.vinculos}/${SV.conta.limites.vinculos} vínculos · ${SV.conta.uso.usuarios}/${SV.conta.limites.usuarios} usuários${SV.lic!=='ativa'?' · <b>licença '+esc(SV.lic)+'</b>':''}</p>`);}

/* ---------- sincronização ---------- */
const SV_IGN=new Set(['audit','_emps','_id','_exemplo','ver']);
const svSnapDe=()=>{const o={};Object.keys(DB).forEach(k=>{if(!SV_IGN.has(k))o[k]=JSON.stringify(DB[k]);});return o;};
function svAgendar(){clearTimeout(SV.t);SV.t=setTimeout(svPush,700);}
/* envia só as chaves alteradas desde a última sincronização (o ruído de migração/normalização do carregamento não conta) */
async function svPush(){if(!SV.on||!SV.tok||!SV.emp||!DB)return;if(SV.busy){SV.again=true;return;}SV.busy=true;SV.t=null;
  try{do{SV.again=false;const atual=svSnapDe(),mud={},env={};Object.keys(atual).forEach(k=>{if(atual[k]!==SV.snap[k]&&DB[k]!==undefined){mud[k]=JSON.parse(atual[k]);env[k]=atual[k];}});if(!Object.keys(mud).length)break;
    const r=await svApi('PUT','/api/empresas/'+encodeURIComponent(SV.emp)+'/dados',{versao:SV.ver,mudancas:mud});
    if(r.s===200){SV.ver=r.j.versao;Object.assign(SV.snap,env);DIRTY=false;
      const o=r.j.outras||{};const ks=Object.keys(o);if(ks.length){ks.forEach(k=>{DB[k]=o[k];SV.snap[k]=JSON.stringify(o[k]);});toast('Dados atualizados com alterações de outro usuário ('+ks.join(', ')+').','ok');if(NAV&&NAV.cur&&!DIRTY&&!document.querySelector('#modal.on'))render();}}
    else if(r.s===409){modal(`<p>Outro usuário alterou os mesmos dados desta empresa (${esc((r.j.chaves||[]).join(', '))}). Recarregue para continuar; as suas alterações ainda não gravadas nessas partes serão descartadas.</p><div class="row" style="justify-content:flex-end"><button class="btn pri" data-act="svRecarregar">Recarregar</button></div>`,{title:'Dados alterados por outro usuário'});SV.again=false;}
    else if(r.s===403||r.s===402){toast(r.j.erro||'Gravação não permitida.','err');SV.again=false;svRecarregar();}
    else if(r.s!==401){toast(r.j.erro||'Falha ao gravar no servidor.','err');}
  }while(SV.again);}finally{SV.busy=false;}}
async function svFlush(){clearTimeout(SV.t);if(SV.on&&SV.tok&&SV.emp&&DB){await svPush();while(SV.busy)await new Promise(r=>setTimeout(r,20));}}
function svRecarregar(){closeModal();if(SV.emp)svAbrir(SV.emp);}

/* ===================== CONTABILIDADE · FINANCEIRO · ARQUIVOS BANCÁRIOS =====================
   Contabilização automática da folha (partidas dobradas), contas a pagar da folha e remessa/retorno CNAB 240.
   Premissas: regime de competência (Lei 6.404/1976, art. 177; Código Civil, arts. 1.179 e 1.183 **).
   O leiaute CNAB 240 segue o padrão FEBRABAN; cada banco adota variações (convênio, câmara, finalidade, códigos de ocorrência).
   Toda remessa precisa ser homologada com o banco antes do uso em produção **. */

/* ---------- utilitários ---------- */
const ctbDB=()=>{DB.ctb=DB.ctb||{};const c=DB.ctb;c.regra=c.regra||{};c.lanc=c.lanc||[];c.fech=c.fech||{};c.seq=c.seq||0;if(!c.plano||!c.plano.length)c.plano=ctbPlanoPadrao();return c;};
const finDB=()=>{DB.fin=DB.fin||{};const f=DB.fin;f.contas=f.contas||[];f.tit=f.tit||[];f.rem=f.rem||[];f.seq=f.seq||0;return f;};
const ctbUlt=comp=>{const [a,m]=comp.split('-').map(Number);return new Date(Date.UTC(a,m,0)).toISOString().slice(0,10);};
const ctbSemAc=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7E]/g,' ').toUpperCase();
const cnA=(s,n)=>ctbSemAc(s).slice(0,n).padEnd(n,' ');
const cnN=(v,n)=>{const s=String(Math.max(0,Math.round(Number(v)||0))).replace(/\D/g,'');if(s.length>n)throw new Error('Campo numérico excede '+n+' posições: '+s);return s.padStart(n,'0');};
const cnV=(v,n)=>cnN(Math.round(r2(v)*100),n);
const cnD=iso=>iso?iso.slice(8,10)+iso.slice(5,7)+iso.slice(0,4):'00000000';
const cnB=n=>' '.repeat(n);
const cents=v=>Math.round(r2(v)*100);
function quintoDiaUtil(comp){const [a,m]=comp.split('-').map(Number);let d=new Date(Date.UTC(m===12?a+1:a,m===12?0:m,1)),n=0;
  while(true){const f=ehFeriado(d);if(d.getUTCDay()!==0&&!f){n++;if(n===5)break;}d=new Date(d.getTime()+864e5);}return d.toISOString().slice(0,10);}
const somaDias=(iso,n)=>new Date(new Date(iso+'T00:00:00Z').getTime()+n*864e5).toISOString().slice(0,10);

/* ---------- plano de contas e parametrização ---------- */
function ctbPlanoPadrao(){return[
 {cod:'1.1.1.01',nome:'Caixa',nat:'D'},{cod:'1.1.1.02',nome:'Bancos conta movimento',nat:'D'},
 {cod:'2.1.2.01',nome:'Salários e ordenados a pagar',nat:'C'},{cod:'2.1.2.02',nome:'INSS a recolher',nat:'C'},{cod:'2.1.2.03',nome:'IRRF a recolher',nat:'C'},
 {cod:'2.1.2.04',nome:'FGTS a recolher',nat:'C'},{cod:'2.1.2.05',nome:'Contribuições a terceiros a recolher',nat:'C'},{cod:'2.1.2.06',nome:'Descontos de empregados a repassar',nat:'C'},
 {cod:'2.1.2.07',nome:'Provisão de férias e encargos',nat:'C'},{cod:'2.1.2.08',nome:'Provisão de 13º salário e encargos',nat:'C'},{cod:'2.1.2.10',nome:'Fornecedores e outras contas a pagar',nat:'C'},
 {cod:'3.1.1.01',nome:'Salários e ordenados',nat:'D'},{cod:'3.1.1.02',nome:'Férias e adicional de 1/3',nat:'D'},{cod:'3.1.1.03',nome:'13º salário',nat:'D'},{cod:'3.1.1.04',nome:'Rescisões e indenizações',nat:'D'},
 {cod:'3.1.2.01',nome:'INSS patronal',nat:'D'},{cod:'3.1.2.02',nome:'RAT/FAP',nat:'D'},{cod:'3.1.2.03',nome:'Contribuições a terceiros',nat:'D'},{cod:'3.1.2.04',nome:'FGTS',nat:'D'},
 {cod:'3.1.3.01',nome:'Provisão de férias e encargos (despesa)',nat:'D'},{cod:'3.1.3.02',nome:'Provisão de 13º salário e encargos (despesa)',nat:'D'}];}
const CTB_REGRAS=[['despSal','Despesa — salários e ordenados','3.1.1.01'],['despFer','Despesa — férias e 1/3','3.1.1.02'],['despD13','Despesa — 13º salário','3.1.1.03'],['despResc','Despesa — rescisões','3.1.1.04'],
 ['despPat','Despesa — INSS patronal','3.1.2.01'],['despRat','Despesa — RAT/FAP','3.1.2.02'],['despTerc','Despesa — terceiros','3.1.2.03'],['despFgts','Despesa — FGTS','3.1.2.04'],['despProvFer','Despesa — provisão de férias','3.1.3.01'],['despProvD13','Despesa — provisão de 13º','3.1.3.02'],
 ['pasSal','Passivo — salários a pagar','2.1.2.01'],['pasInss','Passivo — INSS a recolher','2.1.2.02'],['pasIrrf','Passivo — IRRF a recolher','2.1.2.03'],['pasFgts','Passivo — FGTS a recolher','2.1.2.04'],['pasTerc','Passivo — terceiros a recolher','2.1.2.05'],
 ['pasOutros','Passivo — descontos a repassar','2.1.2.06'],['pasProvFer','Passivo — provisão de férias','2.1.2.07'],['pasProvD13','Passivo — provisão de 13º','2.1.2.08'],['pasForn','Passivo — fornecedores/outros','2.1.2.10'],['banco','Ativo — bancos conta movimento','1.1.1.02']];
const ctbRegra=k=>{const c=ctbDB();return c.regra[k]||(CTB_REGRAS.find(x=>x[0]===k)||[])[2];};
const ctbNome=cod=>{const x=ctbDB().plano.find(p=>p.cod===cod);return x?x.nome:'(conta inexistente)';};
const FER_SYS=['FERIAS','FERTERCO','ABONO','ABONOTERCO','FERVENC','FERPROP','FERPTERCO'],D13_SYS=['D13','D13PROP'],RESC_SYS=['AVISO'];

/* ---------- geração automática dos lançamentos da folha ---------- */
function ctbGerar(comp){
  const c=ctbDB(),C=DB.comps[comp];
  if(!C||!Object.keys(C.res||{}).length)return{erro:'Calcule a folha da competência antes de contabilizar.'};
  if(c.fech[comp])return{erro:'Competência contábil encerrada. Reabra para regenerar.'};
  const T=totaisComp(comp);let sal=0,fer=0,d13=0,resc=0,liq=0,inss=0,irrf=0,plr=0,outros=0,bruto=0,baseProv=0;
  for(const id in C.res){const r=C.res[id];liq+=r.liquido;inss+=r.inss;irrf+=r.irrf;plr+=r.irrfPlr||0;bruto+=r.totProv;
    for(const x of r.itens){if(x.tp!==1)continue;if(FER_SYS.includes(x.sys))fer+=x.valor;else if(D13_SYS.includes(x.sys))d13+=x.valor;else if(RESC_SYS.includes(x.sys))resc+=x.valor;else sal+=x.valor;}}
  sal=r2(sal);fer=r2(fer);d13=r2(d13);resc=r2(resc);liq=r2(liq);inss=r2(inss);irrf=r2(irrf);plr=r2(plr);bruto=r2(bruto);
  outros=r2(bruto-liq-inss-irrf-plr);baseProv=sal;
  c.lanc=c.lanc.filter(l=>!(l.auto&&l.comp===comp&&l.tipo!=='baixa'));
  const dt=ctbUlt(comp),mk=(tipo,hist,ps)=>{const pp=ps.filter(p=>Math.abs(p.d||0)>=0.005||Math.abs(p.c||0)>=0.005);const D=r2(pp.reduce((a,p)=>a+(p.d||0),0)),K=r2(pp.reduce((a,p)=>a+(p.c||0),0));
    if(!pp.length)return null;if(D!==K)throw new Error('Lançamento desbalanceado ('+tipo+'): D '+D+' ≠ C '+K);c.seq++;const l={id:'L'+String(c.seq).padStart(6,'0'),comp,data:dt,tipo,auto:true,hist,partidas:pp};c.lanc.push(l);return l;};
  const gen=[];
  /* 1) apropriação da folha */
  const ps=[];
  [['despSal',sal],['despFer',fer],['despD13',d13],['despResc',resc]].forEach(([k,v])=>{if(v>0)ps.push({conta:ctbRegra(k),d:v,c:0});});
  ps.push({conta:ctbRegra('pasSal'),d:0,c:liq});
  if(inss>0)ps.push({conta:ctbRegra('pasInss'),d:0,c:inss});
  if(irrf+plr>0)ps.push({conta:ctbRegra('pasIrrf'),d:0,c:r2(irrf+plr)});
  if(outros>0.004)ps.push({conta:ctbRegra('pasOutros'),d:0,c:outros});else if(outros<-0.004)ps.push({conta:ctbRegra('pasOutros'),d:-outros,c:0});
  gen.push(mk('folha','Apropriação da folha de pagamento '+compLabel(comp)+' — proventos, descontos legais e líquido a pagar',ps));
  /* 2) encargos patronais (não há patronal no Simples Nacional do Anexo I a III — o cálculo do app devolve zero) */
  const pe=[];
  if(T.pat>0)pe.push({conta:ctbRegra('despPat'),d:T.pat,c:0});if(T.rat>0)pe.push({conta:ctbRegra('despRat'),d:T.rat,c:0});if(T.terc>0)pe.push({conta:ctbRegra('despTerc'),d:T.terc,c:0});
  if(T.pat+T.rat>0)pe.push({conta:ctbRegra('pasInss'),d:0,c:r2(T.pat+T.rat)});if(T.terc>0)pe.push({conta:ctbRegra('pasTerc'),d:0,c:T.terc});
  gen.push(mk('enc','Encargos patronais sobre a folha '+compLabel(comp)+' (INSS patronal, RAT/FAP e terceiros)',pe));
  /* 3) FGTS */
  if(T.fgts>0)gen.push(mk('fgts','FGTS da competência '+compLabel(comp),[{conta:ctbRegra('despFgts'),d:T.fgts,c:0},{conta:ctbRegra('pasFgts'),d:0,c:T.fgts}]));
  /* 4) provisões (opcional) */
  if(c.prov){const pe2=num(c.encProv)/100,pf=r2(baseProv/12*4/3*(1+pe2)),p13=r2(baseProv/12*(1+pe2));
    if(pf>0)gen.push(mk('prov','Provisão mensal de férias e 1/3 '+compLabel(comp)+(pe2?' (com encargos de '+brl(num(c.encProv))+'%)':''),[{conta:ctbRegra('despProvFer'),d:pf,c:0},{conta:ctbRegra('pasProvFer'),d:0,c:pf}]));
    if(p13>0)gen.push(mk('prov','Provisão mensal de 13º salário '+compLabel(comp)+(pe2?' (com encargos de '+brl(num(c.encProv))+'%)':''),[{conta:ctbRegra('despProvD13'),d:p13,c:0},{conta:ctbRegra('pasProvD13'),d:0,c:p13}]));}
  saveDB();audit('Contabilização',comp+' · '+gen.filter(Boolean).length+' lançamentos');
  return{n:gen.filter(Boolean).length};
}
function ctbSaldos(ate){const m={};ctbDB().lanc.forEach(l=>{if(ate&&l.data>ate)return;l.partidas.forEach(p=>{const o=m[p.conta]=m[p.conta]||{d:0,c:0};o.d=r2(o.d+(p.d||0));o.c=r2(o.c+(p.c||0));});});return m;}

/* ---------- financeiro: títulos a pagar ---------- */
function finEmpBanco(e){return{forma:e.formaPgto||'cc',banco:onlyD(e.banco).slice(0,3),ag:onlyD(e.agencia),agDv:String(e.agDv||'').trim(),conta:onlyD(e.conta),contaDv:String(e.contaDv||'').trim(),tipoConta:e.tipoConta||'cc'};}
function finGerar(comp){
  const f=finDB(),C=DB.comps[comp];if(!C||!Object.keys(C.res||{}).length)return{erro:'Calcule a folha da competência antes de gerar os títulos.'};
  const P=DB.params,T=totaisComp(comp),E=DB.empresa||{},sn=E.regime==='sn'&&E.anexo==='std';
  const alvo=[];
  for(const id in C.res){const r=C.res[id],e=byId(DB.empregados,id);if(!e||!(r.liquido>0))continue;
    const resc=e.desligamento&&e.desligamento.slice(0,7)===comp;
    alvo.push({orig:comp+'|'+(resc?'resc':'sal')+'|'+id,comp,tipo:resc?'resc':'sal',emp:id,desc:(resc?'Verbas rescisórias — ':'Salário líquido — ')+e.nome,favorecido:e.nome,doc:onlyD(e.cpf),valor:r.liquido,
      venc:resc?somaDias(e.desligamento,10):quintoDiaUtil(comp),pas:'pasSal',...finEmpBanco(e)});}
  const dI=vencGuia(comp,P.venc.inss),dF=vencGuia(comp,P.venc.fgts),plr=r2(Object.values(C.res).reduce((a,r)=>a+(r.irrfPlr||0),0)),irT=r2(T.irrf-plr);
  const ins=r2(T.inss+(sn?0:T.pat+T.rat));
  if(ins>0)alvo.push({orig:comp+'|inss',comp,tipo:'inss',desc:'INSS (DCTFWeb/DARF) '+compLabel(comp),favorecido:'Receita Federal do Brasil',valor:r2(ins+(sn?0:T.terc)),venc:dI,pas:'pasInss',partes:[{pas:'pasInss',valor:ins}].concat(!sn&&T.terc>0?[{pas:'pasTerc',valor:T.terc}]:[]),guia:true});
  if(irT+plr>0)alvo.push({orig:comp+'|irrf',comp,tipo:'irrf',desc:'IRRF (DCTFWeb/DARF) '+compLabel(comp),favorecido:'Receita Federal do Brasil',valor:r2(irT+plr),venc:dI,pas:'pasIrrf',guia:true});
  if(T.fgts>0)alvo.push({orig:comp+'|fgts',comp,tipo:'fgts',desc:'FGTS Digital '+compLabel(comp),favorecido:'Caixa Econômica Federal — FGTS',valor:T.fgts,venc:dF,pas:'pasFgts',guia:true});
  const chaves=new Set(alvo.map(a=>a.orig));
  f.tit=f.tit.filter(t=>!(t.comp===comp&&t.origem==='folha'&&t.status==='aberto'&&!chaves.has(t.orig)));
  let novos=0,atual=0,mant=0;
  alvo.forEach(a=>{const ex=f.tit.find(t=>t.orig===a.orig&&t.origem==='folha');
    if(ex){if(ex.status==='aberto'){Object.assign(ex,a);atual++;}else mant++;}
    else{f.seq++;f.tit.push(Object.assign({id:'T'+String(f.seq).padStart(6,'0'),origem:'folha',status:'aberto'},a));novos++;}});
  saveDB();audit('Títulos da folha',comp+' · '+novos+' novos');return{novos,atual,mant};
}

function cnabValida(t){const m=[];if(t.forma!=='cc')m.push('forma de pagamento "'+(t.forma==='pix'?'PIX':'dinheiro')+'" não é gerada por este arquivo');
  if(t.forma==='cc'){if(!/^\d{3}$/.test(t.banco||''))m.push('código do banco (3 dígitos) ausente');if(!t.ag)m.push('agência ausente');if(!t.conta)m.push('conta ausente');if(!(t.valor>0))m.push('valor inválido');
    if(t.doc&&t.doc.length===11&&!cpfValido(t.doc))m.push('CPF inválido');if(!t.doc)m.push('CPF/CNPJ do favorecido ausente');}return m;}
function cnabGerar(o){
  /* o: {conta,tits,dtPag,servico:'30'|'20',segB:bool,nsa,msg} -> {texto,nLinhas,total,inclusos,pend} */
  const E=DB.empresa;if(!E)throw new Error('Cadastre a empresa.');const cb=o.conta,inclusos=[],pend=[];
  o.tits.forEach(t=>{const m=cnabValida(t);if(m.length)pend.push({t,m});else inclusos.push(t);});
  if(!inclusos.length)return{texto:'',nLinhas:0,total:0,inclusos,pend};
  const cnpj=cnN(onlyD(E.cnpj),14),banco=cnN(cb.banco,3),ins='2';
  const hdrConta=cnN(cb.ag,5)+cnA(cb.agDv,1)+cnN(cb.conta,12)+cnA(cb.contaDv,1)+' ';
  const L=[];
  const add=s=>{if(s.length!==240)throw new Error('Registro CNAB com '+s.length+' posições (esperado 240): '+s.slice(0,20));L.push(s);};
  const agora=new Date(),hh=String(agora.getHours()).padStart(2,'0')+String(agora.getMinutes()).padStart(2,'0')+String(agora.getSeconds()).padStart(2,'0');
  add(banco+'0000'+'0'+cnB(9)+ins+cnpj+cnA(cb.convenio,20)+hdrConta+cnA(E.razao,30)+cnA(cb.bancoNome,30)+cnB(10)+'1'+cnD(hoje())+hh+cnN(o.nsa||1,6)+'103'+'01600'+cnB(20)+cnB(20)+cnB(29));
  const grp={};inclusos.forEach(t=>{const fm=t.banco===cnN(cb.banco,3)?'01':'41';(grp[fm]=grp[fm]||[]).push(t);});
  let lote=0,regs=0;
  Object.keys(grp).sort().forEach(fm=>{lote++;const ts=grp[fm];let seq=0,soma=0;
    add(banco+cnN(lote,4)+'1'+'C'+cnN(o.servico||'30',2)+fm+'045'+' '+ins+cnpj+cnA(cb.convenio,20)+hdrConta+cnA(E.razao,30)+cnA(o.msg||'',40)+cnA(E.logr||'',30)+cnA(E.nr||'',5)+cnA(E.compl||'',15)+cnA(E.municipio||'',20)+cnN(onlyD(E.cep)||0,8)+cnA(E.uf||'',2)+cnB(8)+cnB(10));
    ts.forEach(t=>{seq++;soma+=cents(t.valor);
      add(banco+cnN(lote,4)+'3'+cnN(seq,5)+'A'+'0'+'00'+(fm==='41'?'018':'000')+cnN(t.banco,3)+cnN(t.ag,5)+cnA(t.agDv,1)+cnN(t.conta,12)+cnA(t.contaDv,1)+' '+cnA(t.favorecido,30)+cnA(t.id,20)+cnD(o.dtPag)+'BRL'+cnN(0,15)+cnV(t.valor,15)+cnB(20)+cnN(0,8)+cnN(0,15)+cnB(40)+'  '+cnB(5)+'  '+cnB(3)+'0'+cnB(10));
      if(o.segB){seq++;const d=onlyD(t.doc);add(banco+cnN(lote,4)+'3'+cnN(seq,5)+'B'+cnB(3)+(d.length===11?'1':'2')+cnN(d,14)+cnB(30)+cnB(5)+cnB(15)+cnB(15)+cnB(20)+cnB(8)+cnB(2)+cnN(0,8)+cnN(0,15)+cnN(0,15)+cnN(0,15)+cnN(0,15)+cnN(0,15)+cnB(15)+' '+cnB(6)+cnN(0,8));}});
    add(banco+cnN(lote,4)+'5'+cnB(9)+cnN(seq+2,6)+cnN(soma,18)+cnN(0,18)+cnN(0,6)+cnB(165)+cnB(10));regs+=seq+2;});
  add(banco+'9999'+'9'+cnB(9)+cnN(lote,6)+cnN(L.length+1,6)+cnN(0,6)+cnB(205));
  const total=r2(inclusos.reduce((a,t)=>a+t.valor,0));
  return{texto:L.join('\r\n')+'\r\n',nLinhas:L.length,total,inclusos,pend};
}
/* retorno: lê segmentos A e interpreta as ocorrências (posições 231–240, pares de 2 caracteres) */
function cnabRetorno(txt){
  const out=[];String(txt).split(/\r?\n/).forEach(l=>{if(l.length<240)return;if(l[7]!=='3'||l[13]!=='A')return;
    const doc=l.slice(73,93).trim(),oc=l.slice(230,240).trim().match(/.{1,2}/g)||[],val=Number(l.slice(119,134))/100;
    let st='rejeitado';if(oc.includes('00'))st='pago';else if(oc.includes('BD')||oc.includes('02'))st='agendado';out.push({doc,oc,val,st,favorecido:l.slice(43,73).trim()});});
  return out;
}

/* ===================== DCTFWeb: apuração, créditos, prazos e multas =====================
   Fonte: Manual de Orientação da DCTFWeb (janeiro/2025) e MOS eSocial S-1.3 (consolidado até a NO S-1.3 – 12.2026).
   Espelho de conferência: a DCTFWeb é gerada pela RFB a partir do S-1299 e do R-2099 e transmitida no e-CAC; este módulo
   não a transmite nem emite DARF. Valores apurados aqui são estimativas e devem ser conferidos com o S-5011 **. */
const dctfDB=()=>{DB.dctf=DB.dctf||{};const d=DB.dctf;d.cred=d.cred||{};d.trans=d.trans||{};return d;};
const diaUtilPosterior=d=>{while(d.getUTCDay()===0||d.getUTCDay()===6||ehFeriado(d))d=new Date(d.getTime()+864e5);return d;};
const isoD=d=>d.toISOString().slice(0,10),dUTC=iso=>new Date(iso+'T00:00:00Z');
const proxComp=comp=>{const [a,m]=comp.split('-').map(Number);return m===12?(a+1)+'-01':a+'-'+String(m+1).padStart(2,'0');};
/* último dia útil do mês seguinte (Manual DCTFWeb, item 4.2) */
const dctfPrazoEntrega=comp=>{const [a,m]=proxComp(comp).split('-').map(Number);return isoD(diaUtilAnterior(new Date(Date.UTC(a,m,0))));};
/* dia 15 do mês seguinte, postergado (MOS S-1.3: S-1200, S-1210, S-1299) */
const esocPrazo15=comp=>{const [a,m]=proxComp(comp).split('-').map(Number);return isoD(diaUtilPosterior(new Date(Date.UTC(a,m-1,15))));};
/* 13º salário: dia 20 de dezembro, antecipado */
const prazo13=ano=>isoD(diaUtilAnterior(new Date(Date.UTC(ano,11,20))));

function dctfApurar(comp){
  const C=DB.comps[comp];if(!C||!Object.keys(C.res||{}).length)return null;
  const P=DB.params,E=DB.empresa||{},cr=dctfDB().cred[comp]||{};
  const A={inssM:0,inssD:0,patM:0,patD:0,ratM:0,ratD:0,tercM:0,tercD:0,irM:0,irD:0,plr:0,sf:0,fgts:0};
  for(const id in C.res){const r=C.res[id],e=byId(DB.empregados,id);
    const i13=r.inss13||0,ir13=r.irrf13||0;
    A.inssM+=Math.max(0,r.inss-i13);A.inssD+=i13;A.irM+=Math.max(0,r.irrf-ir13);A.irD+=ir13;A.plr+=r.irrfPlr||0;A.sf+=r.sf||0;A.fgts+=r.fgts||0;
    const em=encargosEmpresa(Object.assign({},r,{baseCP13:0}),P,E,e,comp,true),ed=encargosEmpresa(Object.assign({},r,{baseCP:0}),P,E,e,comp,true);
    A.patM+=em.patronal;A.ratM+=em.rat;A.tercM+=em.terc;A.patD+=ed.patronal;A.ratD+=ed.rat;A.tercD+=ed.terc;}
  for(const k in A)A[k]=tr2(A[k]);
  const L=[ /* [cr, descrição, grupo, valor, categoria] */
   ['1082-01','CP Segurados — empregados/avulsos','seg',A.inssM,'M'],['1138-01','CP Patronal — empregados/avulsos','pat',A.patM,'M'],['1646-01','CP Patronal — GILRAT ajustado (RAT × FAP)','pat',A.ratM,'M'],
   ['(por entidade)','CP Terceiros — outras entidades e fundos, conforme FPAS/código de terceiros da lotação','terc',A.tercM,'M'],
   ['0561-07','IRRF — rendimentos do trabalho assalariado','ir',A.irM,'M'],['3562-01','IRRF — participação nos lucros ou resultados (PLR)','ir',A.plr,'M'],
   ['1082-21','CP Segurados — 13º salário','seg',A.inssD,'D'],['1138-21','CP Patronal — 13º salário','pat',A.patD,'D'],['1646-21','CP Patronal — GILRAT ajustado — 13º salário','pat',A.ratD,'D'],
   ['(por entidade)','CP Terceiros — 13º salário','terc',A.tercD,'D'],['0561-07','IRRF — 13º salário (confirmar código na tabela do Anexo I)','ir',A.irD,'D']].filter(l=>l[3]>0).map(l=>({cr:l[0],desc:l[1],grp:l[2],deb:l[3],cat:l[4],cred:0,creditos:{}}));
  if(typeof dctfExtras==='function')dctfExtras(comp,L,E).forEach(x=>L.push(x));
  /* créditos vinculáveis — ordem padrão: pagamentos, salário-família, salário-maternidade, retenção Lei 9.711/98; só abatem CP e terceiros (PA ≥ 09/2023) */
  const creds=[['sf','Salário-família',A.sf],['sm','Salário-maternidade',num(cr.sm)],['ret','Retenção Lei 9.711/98',num(cr.ret)]];
  const ordem=['seg','pat','terc'],alvo=L.filter(l=>l.cat==='M'&&ordem.includes(l.grp)).sort((a,b)=>ordem.indexOf(a.grp)-ordem.indexOf(b.grp));
  const sobra={};
  creds.forEach(([k,n,v])=>{let rest=r2(v);alvo.forEach(l=>{const disp=r2(l.deb-l.cred),u=Math.min(rest,disp);if(u>0){l.cred=r2(l.cred+u);l.creditos[k]=r2((l.creditos[k]||0)+u);rest=r2(rest-u);}});sobra[k]=rest;});
  L.forEach(l=>{l.saldo=r2(l.deb-l.cred);});
  const tot=(f)=>r2(L.filter(f).reduce((a,l)=>a+l.saldo,0));
  const deb=r2(L.reduce((a,l)=>a+l.deb,0)),cre=r2(L.reduce((a,l)=>a+l.cred,0));
  return{L,creds,sobra,deb,cre,saldoM:tot(l=>l.cat==='M'),saldoD:tot(l=>l.cat==='D'),saldo:r2(deb-cre),fgts:A.fgts,sn:E.regime==='sn'&&E.anexo==='std',cprb:!!E.cprb};

/* ---------- calendário de prazos eSocial e DCTFWeb ---------- */
function prazosComp(comp){
  const P=DB.params,a=+comp.slice(0,4),m=+comp.slice(5),out=[];const hj=hoje();
  const proc=(t)=>DB.eventos.some(e=>e.tipo===t&&e.status==='processado'&&((e.gen&&e.gen.args&&e.gen.args.comp)?e.gen.args.comp===comp:true));
  const add=(obrig,data,base,feito)=>out.push({obrig,data,base,feito:!!feito});
  add('S-1200 — remuneração do trabalhador',esocPrazo15(comp),'MOS S-1.3, S-1200: dia 15 do mês seguinte, postergado se dia não útil',proc('S-1200'));
  add('S-1210 — pagamentos de rendimentos',esocPrazo15(comp),'MOS S-1.3, S-1210: dia 15, postergado se dia não útil',proc('S-1210'));
  add('S-1299 — fechamento dos eventos periódicos',esocPrazo15(comp),'MOS S-1.3, S-1299: dia 15, postergado; após S-1200/S-1210',proc('S-1299'));
  add('DCTFWeb mensal — transmissão',dctfPrazoEntrega(comp),'Manual da DCTFWeb, item 4.2: último dia útil do mês seguinte',!!(dctfDB().trans[comp]&&dctfDB().trans[comp].data));
  add('DARF da DCTFWeb (CP, terceiros e IRRF)',vencGuia(comp,P.venc.inss),'Parâmetros legais (dia '+P.venc.inss+', antecipado) — Lei 8.212/1991, art. 30, I, “b” **',false);
  add('FGTS Digital — guia mensal',vencGuia(comp,P.venc.fgts),'Parâmetros legais (dia '+P.venc.fgts+', antecipado) — Lei 8.036/1990, art. 15 **',false);
  if(m===12){add('S-1200/S-1299 anual — 13º salário',prazo13(a),'MOS S-1.3: dia 20 de dezembro, antecipado se dia não útil',false);add('DCTFWeb 13º salário — transmissão',prazo13(a),'Manual da DCTFWeb, item 4.2: até 20 de dezembro',false);}
  DB.empregados.forEach(e=>{
    if(e.admissao&&e.admissao.slice(0,7)===proxComp(comp)&&!e.admPre)add('S-2200 — admissão de '+e.nome,isoD(new Date(dUTC(e.admissao).getTime()-864e5)),'MOS S-1.3, S-2200, alínea “a”: até o dia imediatamente anterior ao início da prestação (empregado)',DB.eventos.some(x=>x.tipo==='S-2200'&&x.status==='processado'&&x.gen&&x.gen.args&&x.gen.args.id===e.id));
    if(e.desligamento&&e.desligamento.slice(0,7)===comp){const lim=isoD(diaUtilAnterior(new Date(dUTC(e.desligamento).getTime()+10*864e5)));
      add('S-2299 — desligamento de '+e.nome,lim,'MOS S-1.3, S-2299: até 10 dias do desligamento (exclui o dia), antecipado se dia não útil',DB.eventos.some(x=>x.tipo==='S-2299'&&x.status==='processado'&&x.gen&&x.gen.args&&x.gen.args.id===e.id));
      const dd=+e.desligamento.slice(8);if(dd>=1&&dd<=4)add('S-1200 de '+e.nome+' (mês anterior ao desligamento)',lim,'MOS S-1.3, S-1200: desligamento do 1º ao 4º dia — remuneração do mês anterior até o 10º dia seguinte ao desligamento',false);}});
  return out.sort((x,y)=>x.data<y.data?-1:x.data>y.data?1:0).map(x=>Object.assign(x,{sit:x.feito?['Cumprido','ok']:x.data<hj?['Vencido','err']:(dUTC(x.data)-dUTC(hj))/864e5<=7?['Vence em até 7 dias','warn']:['A vencer','gray']}));
}

/* ---------- multas e acréscimos ---------- */
function maedCalc(o){/* o:{montante,prazo,entrega,perfil:'geral'|'sn'|'mei',semFato,espontanea} */
  const T=dUTC(somaDiasIso(o.prazo,1)),En=dUTC(o.entrega);if(En<=dUTC(o.prazo))return{meses:0,multa:0,minimo:0,base:0};
  const meses=(En.getUTCFullYear()*12+En.getUTCMonth())-(T.getUTCFullYear()*12+T.getUTCMonth())+1;
  const fator=o.perfil==='mei'?0.1:o.perfil==='sn'?0.5:1;const minimo=r2((o.semFato?200:500)*fator);
  const pct=Math.min(20,2*meses),base=r2(o.montante*pct/100);let multa=Math.max(base,minimo);
  if(o.espontanea)multa=Math.max(r2(multa*0.5),minimo);
  return{meses,pct,base,minimo,multa:r2(multa)};
}
const somaDiasIso=(iso,n)=>new Date(dUTC(iso).getTime()+n*864e5).toISOString().slice(0,10);
function moraCalc(o){/* o:{valor,venc,pag,selic} */
  if(o.pag<=o.venc)return{dias:0,multa:0,juros:0,total:o.valor};
  const dias=Math.round((dUTC(o.pag)-dUTC(o.venc))/864e5),pm=Math.min(20,0.33*dias),multa=r2(o.valor*pm/100),jp=num(o.selic)+1,juros=r2(o.valor*jp/100);
  return{dias,pm:r2(pm),multa,jp,juros,total:r2(o.valor+multa+juros)};
}

/* ===================== EXPORTAÇÃO DE QUALQUER TELA PARA PDF E EXCEL =====================
   Sem bibliotecas: lê o conteúdo exibido (títulos, textos, campos e tabelas) e gera .xlsx (OOXML em ZIP sem compressão)
   e .pdf (PDF 1.4 com fonte Helvetica) direto no navegador. Nada é enviado a servidor. */
const XB_SKIP=new Set(['SCRIPT','STYLE','BUTTON','NAV','DATALIST','SVG','CANVAS','NOSCRIPT']);
const XB_BLK='DIV,P,TABLE,H1,H2,H3,H4,UL,OL,LI,FORM,SECTION,DETAILS,FIELDSET';
function xbTxt(n){let s='';(function w(x){for(const c of x.childNodes){if(c.nodeType===3)s+=c.textContent;else if(c.nodeType===1){const t=c.tagName;if(XB_SKIP.has(t))continue;if(c.hidden&&!c.hasAttribute('data-tab'))continue;
  if(t==='BR'){s+=' ';continue;}
  if(t==='INPUT'){if(c.type==='checkbox'||c.type==='radio')s+=c.checked?'Sim':'Não';else if(c.type!=='hidden'&&c.type!=='file'&&c.type!=='button')s+=c.value;continue;}
  if(t==='SELECT'){s+=Array.from(c.selectedOptions||[]).map(o=>o.textContent).join(', ');continue;}
  if(t==='TEXTAREA'){s+=c.value;continue;}
  s+=' ';w(c);s+=' ';}}})(n);return s.replace(/\s+/g,' ').trim();}
function xbTabela(t){
  const rows=[];const span=[];
  Array.from(t.rows).forEach((tr,ri)=>{const r=[],isH=!!tr.closest('thead')||Array.from(tr.cells).every(c=>c.tagName==='TH');let ci=0;
    const put=(v,c,h)=>{while(span[ci]&&span[ci].n>0){r.push({v:'',r:false});span[ci].n--;ci++;}r.push({v,r:c,h});ci++;};
    Array.from(tr.cells).forEach(c=>{while(span[ci]&&span[ci].n>0){r.push({v:'',r:false});span[ci].n--;ci++;}
      const cs=+c.getAttribute('colspan')||1,rs=+c.getAttribute('rowspan')||1,v=xbTxt(c),rt=c.classList.contains('r')||c.style.textAlign==='right';
      r.push({v,r:rt,h:isH});if(rs>1)span[ci]={n:rs-1};ci++;for(let k=1;k<cs;k++){r.push({v:'',r:false,h:isH});if(rs>1)span[ci]={n:rs-1};ci++;}});
    while(span[ci]&&span[ci].n>0){r.push({v:'',r:false});span[ci].n--;ci++;}
    rows.push({c:r,h:isH});});
  const nc=Math.max(0,...rows.map(r=>r.c.length));rows.forEach(r=>{while(r.c.length<nc)r.c.push({v:'',r:false});});
  /* descarta colunas totalmente vazias (ex.: coluna de botões) */
  const keep=[];for(let j=0;j<nc;j++)if(rows.some(r=>r.c[j].v!==''))keep.push(j);
  const R=rows.filter(r=>r.c.some(c=>c.v!=='')).map(r=>({h:r.h,c:keep.map(j=>r.c[j])}));
  return R.length?{t:'tbl',rows:R,nc:keep.length}:null;}
function xbBlocos(root){
  const out=[];const push=b=>{if(b)out.push(b);};
  const kv=(k,v)=>{const l=out[out.length-1];if(l&&l.t==='kv')l.rows.push([k,v]);else out.push({t:'kv',rows:[[k,v]]});};
  (function walk(el){for(const n of el.childNodes){
    if(n.nodeType===3){const t=n.textContent.replace(/\s+/g,' ').trim();if(t)push({t:'p',v:t});continue;}
    if(n.nodeType!==1)continue;const tag=n.tagName;
    if(XB_SKIP.has(tag))continue;if(n.hidden&&!n.hasAttribute('data-tab'))continue;if(n.classList.contains('hid')||n.style.display==='none')continue;
    if(tag==='TABLE'){push(xbTabela(n));continue;}
    if(/^H[1-4]$/.test(tag)){const v=xbTxt(n);if(v)push({t:'h',v,l:+tag[1]});continue;}
    if(n.classList.contains('f')){const lb=n.querySelector('label'),v=xbTxt(n),k=lb?xbTxt(lb):'';let val=v;if(k&&v.startsWith(k))val=v.slice(k.length).trim();const sm=n.querySelector('small');if(sm){const h=xbTxt(sm);if(val.endsWith(h))val=val.slice(0,val.length-h.length).trim();}
      if(k||val)kv(k.replace(/\s*\*$/,''),val);continue;}
    if(n.classList.contains('kpi')){const k=n.firstElementChild;if(k){const kt=xbTxt(k),all=xbTxt(n);kv(kt,all.slice(kt.length).trim());continue;}}
    if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')continue;
    if(n.matches(XB_BLK)&&!n.querySelector(XB_BLK.toLowerCase())&&!n.querySelector('.f')){const v=xbTxt(n);if(v)push({t:'p',v});continue;}

/* ===================== Contribuintes individuais, CPRB, SENAI adicional, terceiros por entidade e espelho do EFD-Reinf =====================
   Estimativas de conferência: a apuração oficial é a da DCTFWeb (S-5011/R-5011). Pontos marcados com ** dependem de confirmação em fonte oficial. */
const rfDB=()=>{DB.rf=DB.rf||{};const r=DB.rf;r.ci=r.ci||[];if(!Array.isArray(r.cprb))r.cprb=[];r.nf=r.nf||[];return r;};
const CI_TIPOS={'723':'723 – Empresário, sócio e membro de conselho (pró-labore)','721':'721 – Diretor não empregado, com FGTS','722':'722 – Diretor não empregado, sem FGTS','701':'701 – Autônomo em geral (RPA)','731':'731 – Cooperado de cooperativa de trabalho','738':'738 – Cooperado de cooperativa de produção'};
const CI_S2300_OBRIG=['721','722','723','731','734','738'];/* MOS S-1.3, item 10.2.1 */
/* Lei 8.212/1991, art. 22, III (20% a cargo da empresa) e art. 30, §4º c/c Lei 10.666/2003, art. 4º (retenção de 11% limitada ao teto) */
function ciCalc(r,P){P=P||DB.params;const E=DB.empresa||{},v=num(r.valor),teto=num(P.tetoInss),outras=num(r.outras);
  const base=Math.max(0,Math.min(v,teto-outras)),seg=tr2(base*11/100);
  const R=regraLot(E,null,r.comp,P),pat=R.pat?tr2(v*num(E.patronal!=null&&E.patronal!==''?E.patronal:P.patronal)/100*R.fator/100):0;
  const ir=calcIrrf(Math.max(0,v),seg,num(r.dep),0,P,true);
  /* cooperado de cooperativa de produção: adicional de 12, 9 ou 6 p.p. a cargo da cooperativa (Lei 10.666/2003, art. 1º, §2º) ** */
  const apP=r.cat==='738'?({'25':6,'20':9,'15':12}[String(r.apEsp)]||0):0,adic=tr2(v*apP/100);
  return{baseInss:base,seg,pat,adic,irrf:ir.irrf,liq:r2(v-seg-ir.irrf),excedeTeto:v>base};}
